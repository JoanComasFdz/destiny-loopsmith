name: Agent task
description: Work for the Claude routine. Add the "agent" label when it is ready.
title: "[agent] "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One checkable item per line.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What the agent must not touch.
  - type: textarea
    id: notes
    attributes:
      label: Notes and pointers
      description: Files, rules, related issues or PRs. Say if the work needs the Compendium snapshot.
