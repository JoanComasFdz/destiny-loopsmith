name: E2E videos

# The session that works a PR records its added or changed end-to-end scenarios itself (tools/e2e/record.sh) and pushes
# their GIFs and MP4s with tools/e2e/push-gifs.sh to a throwaway branch e2e-gifs/pr-<n>-<short sha>: the PR's head
# commit plus one commit that adds e2e-gifs/scenarios.json, the GIFs and the MP4s (and e2e-gifs/what-changed.md, the
# post's "What changed", when the session gave one). A session can't upload a file to
# GitHub, so this workflow does only that part: it checks the push, uploads them as pr-<n>-v<version>-<scenario>.gif
# and .mp4 to their release (a rule scenario's, under Rules/<…>/, to its rule group's rules-<…>-resources pre-release,
# created on its first upload; any other to `prs-resources`), posts them on the PR as a new comment (each GIF with a "▶ Play MP4" link to
# the site's player page; it never touches the PR's description) and deletes the branch. It builds, tests and records
# nothing. A push runs the workflow file inside the pushed commit, so the branch carries the PR's own version of this file.
# A failing scenario is marked ❌ in the post and never turns this check red; only the workflow's own failures do (a push
# that isn't a PR's GIFs, an upload or a post that GitHub refused). A new post collapses the PR's earlier posts into a
# closed <details> each ("Scenarios (V1) · 12 scenarios · replaced by V2"). Closing the PR deletes any e2e-gifs/pr-<n>-…
# branch left behind; in prs-resources it keeps its newest version's GIFs and MP4s, so its last post keeps showing and
# playing them, and deletes its older versions'; in each rule release it keeps the latest recording of every rule (a
# merged PR's replace those of closed PRs; a PR closed without merging loses its own). Then it shrinks each post whose
# recordings went to its summary line.
# docs/hosting.md, "E2E videos on pull requests".

on:
  push:
    branches: ['e2e-gifs/**']
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    if: github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.pr.outputs.number }}
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Read the PR from the branch's name
        id: pr
        run: |
          if [[ ! $BRANCH =~ ^e2e-gifs/pr-([0-9]+)-[0-9a-f]+$ ]]; then
            echo "::error::$BRANCH isn't named e2e-gifs/pr-<n>-<short sha> (tools/e2e/push-gifs.sh)."
            exit 1
          fi
          echo "number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Check the PR is open and from this repository
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '"\(.state) \(.head.repo.full_name) \(.head.sha)"') ||
            { echo "::error::There is no PR #$PR."; exit 1; }
          read -r state head_repo head_sha <<< "$pr"
          [ "$state" = open ] || { echo "::error::PR #$PR is $state."; exit 1; }
          [ "$head_repo" = "$GITHUB_REPOSITORY" ] || { echo "::error::PR #$PR comes from $head_repo, a fork."; exit 1; }
          # The GIFs' commit sits on a commit of the PR (its head, or an earlier one when the PR moved on since).
          parent=$(git rev-parse HEAD^)
          relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/$parent...$head_sha" --jq .status)
          [ "$relation" = identical ] || [ "$relation" = ahead ] ||
            { echo "::error::The GIFs' commit sits on $parent, which isn't in the history of PR #$PR."; exit 1; }
      - name: Check the commit only adds scenarios.json, what-changed.md, GIFs and MP4s
        run: |
          bad=0
          while IFS=$'\t' read -r status path; do
            if [ "$status" != A ] || [[ ! $path =~ ^e2e-gifs/(scenarios\.json|what-changed\.md|[A-Za-z0-9_/-]+\.(gif|mp4))$ ]]; then
              echo "::error::Not a GIF, an MP4, scenarios.json or what-changed.md added under e2e-gifs/: $status $path"
              bad=1
            elif [[ $path == *.gif ]] && [ "$(head -c 4 "$path")" != GIF8 ]; then
              echo "::error::Not a GIF: $path"
              bad=1
            elif [[ $path == *.mp4 ]] && [ "$(head -c 8 "$path" | tail -c 4)" != ftyp ]; then
              # An MP4 starts with its ftyp box: a 4-byte size, then "ftyp".
              echo "::error::Not an MP4: $path"
              bad=1
            fi
          done < <(git diff --name-status --no-renames HEAD^ HEAD)
          [ -f e2e-gifs/scenarios.json ] || { echo "::error::e2e-gifs/scenarios.json is missing."; bad=1; }
          exit $bad

  publish:
    needs: check
    runs-on: ubuntu-latest
    # One post per PR at a time, never cancelled midway, so two runs can't both post the same version.
    concurrency:
      group: e2e-videos-${{ needs.check.outputs.pr }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.check.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Upload the GIFs and MP4s and post them on the pull request
        run: python3 tools/e2e/post-scenarios.py --pr "$PR" --commit "$GITHUB_SHA" --out e2e-gifs

  delete-branch:
    # Whatever happened, the throwaway branch goes (its log says why a run failed).
    needs: [check, publish]
    if: always() && github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Delete the e2e-gifs branch
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" && echo "Deleted $BRANCH."

  clean:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # One cleanup at a time, across PRs: two PRs merged together would each read the other as closed and delete the
    # other's recording of a rule they both recorded, leaving it none.
    concurrency:
      group: e2e-videos-clean
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # Deleting needs nothing from the branch (which may predate this workflow); only the cleanup checks out main.
      - name: Delete the PR's e2e-gifs branches left behind
        run: |
          for ref in $(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/e2e-gifs/pr-$PR-" --jq '.[].ref'); do
            # matching-refs is a prefix match: pr-7- never catches pr-70-, but check the name in full anyway.
            [[ $ref =~ ^refs/heads/e2e-gifs/pr-$PR-[0-9a-f]+$ ]] || continue
            echo "Deleting ${ref#refs/heads/}"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/$ref"
          done
      # main's script, not the PR's: its branch may predate the cleanup, or be gone.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: tools/e2e
      # prs-resources keeps the PR's newest version; each rule release keeps the latest recording of every rule (merged:
      # the PR's replace closed PRs'; closed without merging: the PR's go). Then the posts whose recordings went shrink.
      - name: Clean the releases and shrink the PR's posts whose recordings were deleted
        env:
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          if [ "$MERGED" = true ]; then merged=--merged; else merged=; fi
          python3 tools/e2e/post-scenarios.py --pr "$PR" --closed $merged
