name: Deploy web app

# Publishes src/Loopsmith.Web (Blazor WebAssembly) to the root of the gh-pages branch.
# PR previews live next to it under pr-preview/ (see pr-preview.yml) and are left untouched.
# One-time setup (docs/hosting.md): Settings → Pages → Source: "Deploy from a branch", gh-pages, / (root).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test the engine before publishing it
        run: dotnet test -c Release
      - name: Publish the web app
        run: dotnet publish src/Loopsmith.Web -c Release -o publish
      - name: Prepare for GitHub Pages
        run: tools/web/prepare-pages.sh publish/wwwroot "/${GITHUB_REPOSITORY#*/}/" --root
      - name: Deploy to gh-pages (keeping PR previews)
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: publish/wwwroot
          clean-exclude: pr-preview/
          force: false
