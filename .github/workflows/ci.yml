name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Whether a pull request changes a file that dotnet build or test reads: anything but Markdown,
  # docs/, .github/, .claude/, .devcontainer/ and the Python and shell tools in tools/e2e/,
  # tools/compendium/ and tools/manifest/ (a rename counts its old path too; a PR with no changed
  # files builds nothing). If not, `build` is skipped, and a skipped required check counts as
  # passed. If this job fails, `build` runs. Pushes to main always build. pr-preview.yml uses the
  # same list plus tests/ (test files, e2e fixtures among them, are built here but never published).
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          n=$(printf '%s' "$files" | grep -cvE '\.md$|^docs/|^\.github/|^\.claude/|^\.devcontainer/|^tools/(e2e|compendium|manifest)/' || true)
          echo "code=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
