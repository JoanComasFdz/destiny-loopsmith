name: PR preview

# Every pull request from a branch of this repository that changes the site gets the web app deployed to
#   https://<owner>.github.io/<repo>/pr-preview/pr-<number>/
# and a comment with the link. The preview is removed when the PR is closed or merged.
# ci.yml calls this workflow once its `build` job has built, tested and published the PR's site (the `site`
# artifact), and only when the PR changes a file the site is built from (ci.yml, `changes`), so a PR is built once.
# Pull requests from forks are skipped (they never get write access to gh-pages).

on:
  workflow_call:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # One gh-pages deploy at a time (pages.yml uses the same group); only the job waits, so a pull request
    # with no preview doesn't take a place in the queue.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # A closed PR's merge ref is gone; removal only needs the repository, so use the default branch.
          ref: ${{ github.event.action == 'closed' && github.event.repository.default_branch || '' }}
          # No sparse-checkout: checkout makes it a blob:none partial clone, and the deploy action's re-added origin
          # then can't fetch gh-pages ("missing blob object").
      - name: Take the site ci.yml published
        if: github.event.action != 'closed'
        uses: actions/download-artifact@v8
        with:
          name: site
          path: publish/wwwroot
      - name: Prepare for GitHub Pages
        if: github.event.action != 'closed'
        run: tools/web/prepare-pages.sh publish/wwwroot "/${GITHUB_REPOSITORY#*/}/pr-preview/pr-${{ github.event.number }}/"
      - name: Deploy or remove the preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: publish/wwwroot
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          qr-code: "false"
