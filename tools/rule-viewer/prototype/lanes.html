<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arc Hunter Dependency Graph</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: header and tabs, then the graph as fixed columns (triggers on the left, each test layer and what it gives to the right), then the selected element's card. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --fg:#17202b; --muted:#5b6676; --line:#cfd6df; --edge:#9aa5b3; --focus:#1f77d0;
  --trigger:#46505e; --weapon:#c0620c; --ability:#1f77d0; --super:#5b3fc4; --aspect:#0e8a82; --fragment:#3f8f24;
  --buff:#1f9a68; --debuff:#c6402a; --pickup:#7c8796; --strike:#c2387a; --summon:#7a4fa8; --keyword:#6b4fd0; --effect:#3d6f8e; --outside:#6b7684;
  --display:"Chakra Petch",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#151c25; --fg:#e4e9f0; --muted:#98a4b4; --line:#2b3644; --edge:#5d6a7a; --focus:#5ab0ff;
  --trigger:#b4bfcc; --weapon:#f09a4a; --ability:#5ab0ff; --super:#a48cff; --aspect:#3cc7bd; --fragment:#7fcf5a;
  --buff:#4fd39a; --debuff:#ff7a63; --pickup:#e9edf3; --strike:#ff74b0; --summon:#c39af0; --keyword:#a68dff; --effect:#7fb3d4; --outside:#a3adba; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#151c25; --fg:#e4e9f0; --muted:#98a4b4; --line:#2b3644; --edge:#5d6a7a; --focus:#5ab0ff;
  --trigger:#b4bfcc; --weapon:#f09a4a; --ability:#5ab0ff; --super:#a48cff; --aspect:#3cc7bd; --fragment:#7fcf5a;
  --buff:#4fd39a; --debuff:#ff7a63; --pickup:#e9edf3; --strike:#ff74b0; --summon:#c39af0; --keyword:#a68dff; --effect:#7fb3d4; --outside:#a3adba; color-scheme:dark}
*{box-sizing:border-box}
#tabs,#tabnote,#filters,#legend,#lines,#scroller,#card{display:none!important}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(22px,3.2vw,30px);margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:78ch}
.tabs,.bar{display:flex;gap:6px;flex-wrap:wrap}
.tab,.chip{font:500 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 14px;border-radius:999px;cursor:pointer}
.chip{font-size:13px;padding:5px 11px}
.tab[aria-selected="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tabnote{color:var(--muted);font-size:14px;margin:0;max-width:85ch}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.key{display:inline-flex;flex-direction:column;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));border-radius:4px;padding:2px 8px;font-size:11px;line-height:1.25}
.key b{font:500 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.scroller{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:78vh;-webkit-overflow-scrolling:touch}
svg{display:block}
.node rect{stroke-width:1.5}
.node.sel > rect:first-child{stroke-width:2.5}
.node:focus{outline:none}
.node:focus-visible > rect:first-child{stroke-dasharray:4 2}
.node{cursor:pointer}
.node .t{font:500 9.5px var(--mono);letter-spacing:.04em;text-transform:uppercase}
.node .n{font:500 12.5px var(--body);fill:var(--fg)}
.edge{fill:none;stroke:var(--edge);stroke-width:1.2;opacity:.6}
.tbadge{font:13px var(--body);fill:var(--fg);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.dim .tbadge:not(.on){opacity:.12}
.lanesview{display:flex;flex-direction:column;gap:14px}
.lscroll{overflow-x:auto;display:flex;flex-direction:column;gap:20px;padding-bottom:6px}
.lgroup{display:flex;flex-direction:column;gap:8px;min-width:max-content}
.lgroup h3{font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;display:flex;gap:8px;align-items:center}
.lgroup h3 img{width:22px;height:22px;border-radius:3px;background:#1c232c}
.lgroup h3 small{font:500 11px var(--mono);letter-spacing:0}
.lane3{position:relative;display:flex;align-items:center;gap:52px;padding:10px 2px;border-top:1px solid var(--line);width:max-content}
.lane3 .seg{position:relative;z-index:1;display:flex;gap:8px}
.lane3 .tcol,.lane3 .rcol{flex-direction:column;align-items:stretch}
.lane3 .ccol{flex-direction:row;align-items:center;gap:40px}
.lane3.kw{padding-top:22px}
.ltag{position:absolute;left:2px;top:4px;font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--keyword)}
.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.wires .w{fill:none;stroke:var(--fg);stroke-width:1.8;stroke-linecap:round;opacity:.75}
.wires .w.arrow{marker-end:url(#lhead)}
.wires .w.and{stroke-dasharray:2 4;opacity:.6}
.wires .wl{font:500 10.5px var(--mono);fill:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbox{display:flex;gap:8px;align-items:center;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));border-radius:4px;padding:5px 9px 5px 5px;min-width:10.5rem}
.lbox img,.lbox i{width:30px;height:30px;border-radius:3px;background:#1c232c;flex:none}
.lbox i{background:none;border:1px dashed color-mix(in srgb,var(--c) 40%,transparent)}
.lbox b{display:block;font:500 9.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--c)}
.lbox span{display:block;font:500 13px var(--body);color:var(--fg)}
.lbox small{display:block;font:11px var(--mono);color:var(--muted)}
.lbox.ends{border-style:dashed}
.bmask{position:relative;width:30px;height:30px;flex:none;border-radius:3px;background:#1c232c;overflow:hidden}
.bmask img{position:absolute;inset:5px;width:20px;height:20px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:none;filter:grayscale(.2)}
.bmask svg{position:absolute;inset:0;width:30px;height:30px}
.bmask polygon{fill:none;stroke:#4fd39a;stroke-width:1.8}
.emo.many{font-size:8.5px;letter-spacing:0}
.emo{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;line-height:1;letter-spacing:-2px;border-radius:3px;background:#1c232c;white-space:nowrap;overflow:hidden}
.lane3 .ccol.none{align-self:flex-start}
.lalways{font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
.lor,.land{font:500 11px var(--mono);color:var(--muted)}
.larrow{display:flex;justify-content:center}
.larrow svg path:first-child{fill:none;stroke:var(--fg);stroke-width:2.2}
.larrow svg path:last-child{fill:var(--fg)}
.stub{fill:none;stroke:var(--edge);stroke-width:1.6;opacity:.75;marker-end:url(#arrow)}
.stub.on{stroke:var(--fg);stroke-width:1.6;opacity:1;marker-end:url(#arrow-on)}
.dim .stub:not(.on){opacity:.06}
.edge.gives{stroke-dasharray:none}
.edge.needs{stroke-dasharray:4 3}
.edge.ends{stroke-dasharray:1 3;stroke-linecap:round;stroke-width:1.6}
.edge.collects{stroke-dasharray:9 4}
.edge.boosts{stroke-width:2.2}
.lines{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted);align-items:center}
.lines svg{display:inline-block;vertical-align:middle;margin-right:6px}
.colhead{font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.dim .node:not(.on){opacity:.18} .dim .edge:not(.on){opacity:.06}
.edge.on{opacity:1;stroke-width:2;stroke:var(--fg)}
.elabel{font:11px var(--mono);fill:var(--fg);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font-family:var(--display);font-size:18px;font-weight:600;margin:0 0 8px}
.card dl{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:4px 12px;margin:0;font-size:14px}
.card dt{color:var(--muted)} .card dd{margin:0;overflow-wrap:anywhere}
.card ul{margin:0;padding-left:18px}
.mono{font-family:var(--mono);font-size:12.5px}
</style>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:8px">
    <h1 id="title">Lanes</h1>
    <p class="lede">Every rule in Loopsmith's rules as one lane, read left to right: what sets it off, what must be in place, what it gives. Lanes are grouped by what sets them off.</p>
  </header>
  <div class="tabs" role="tablist" id="tabs"></div>
  <p class="tabnote" id="tabnote"></p>
  <div class="bar" id="filters"></div>
  <div class="legend" id="legend"></div>
  <div class="lines" id="lines"></div>
  <div id="lanes" class="lanesview" hidden></div>
  <div class="scroller" id="scroller"><svg id="svg" role="img" aria-label="Dependency graph"></svg></div>
  <section class="card" id="card"></section>
</div>
<script>
const G = __DATA__;
// Prototype: a copy of tab 1 whose "needed by" lines carry when the need is met (computed here in the page, not by the tool yet).
G.scopes.splice(1, 0, {...G.scopes[0], id:'subclassTiming', name:'Arc subclass · timing', timing:true});
G.lanes = __LANES__;
G.scopes.splice(2, 0, {...G.scopes[0], id:'lanes', name:'Lanes', lanes:true});
const AUTO_PICKUPS = new Set(['ionic-trace']); // glossary: collectsAutomatically
const TIMING = {now:['⚡','same moment','inside one event\'s cascade: a strike, or a pickup that collects itself'],
  action:['↳','same action','a later event of the same step: a hit or cast gives it, that action\'s kill uses it'],
  next:['⏭','next action','it waits for another step: another kill, another ability, a pickup on the ground, a declared max']};
function eventOrder(label){ if (!label) return -1; if (/cast|last charge/.test(label)) return 0; if (/hit|finisher|pick up/.test(label)) return 1; if (/kill/.test(label)) return 2; return -1; }
function ownEvent(id){ // the earliest event of an element's own triggers
  const os = scope.edges.filter(e => e.to === id && e.kind === 'needs').map(e => eventOrder(e.label)).filter(o => o >= 0);
  return os.length ? Math.min(...os) : -1; }
function timingOf(e){
  if (!scope.timing || e.kind !== 'needs') return null;
  const from = G.nodes[e.from];
  if (from.type === 'trigger' || from.type === 'weapon') return null;
  if (from.type === 'strike') return 'now';
  if (from.type === 'pickup') return AUTO_PICKUPS.has(from.id) ? 'now' : 'next';
  if (/at max/.test(e.label)) return 'next';
  let need = eventOrder(e.label); if (need < 0) need = ownEvent(e.to);
  if (need < 0) return 'now'; // a passive: it holds as soon as the state does
  const gives = scope.edges.filter(g => g.to === e.from && g.kind === 'gives').map(g => ownEvent(g.from)).filter(o => o >= 0);
  if (!gives.length) return 'next';
  return Math.min(...gives) < need ? 'action' : 'next'; }
const TYPES = {
  trigger:['Trigger','--trigger'], weapon:['Weapon','--weapon'],
  subclassAbility:['Subclass ability','--ability'], subclassSuper:['Subclass super','--super'],
  subclassAspect:['Subclass aspect','--aspect'], subclassFragment:['Subclass fragment','--fragment'],
  buff:['Buff','--buff'], debuff:['Debuff','--debuff'], pickup:['Pickup','--pickup'], summon:['Summon','--summon'],
  strike:['Strike','--strike'], keyword:['Keyword','--keyword'], keywordRule:['Keyword rule','--keyword'], effect:['Effect','--effect'],
  armorMod:['Armor mod','--outside'], weaponPerk:['Weapon perk','--outside'], weaponMod:['Weapon mod','--outside'],
  artifactPerk:['Artifact perk','--outside'], exoticArmor:['Exotic armor','--outside'], exoticWeapon:['Exotic weapon','--outside'],
  catalyst:['Catalyst','--outside'], armorSetBonus:['Armor set bonus','--outside']};
const OUTSIDE = ['armorMod','weaponPerk','weaponMod','artifactPerk','exoticArmor','exoticWeapon','catalyst','armorSetBonus'];
const NOTES = {
  lanes:'',
  subclassTiming:'Tab 1 again, with a badge on each "needed by" line saying when the need can be met: ⚡ in the same moment, ↳ later in the same action, ⏭ only in a later action. Prototype: the page works it out from the lines\' labels.',
  subclass:'The Arc Hunter\'s own abilities, super, aspects and fragments, and the keywords they give or need. Spark of Beacons sits under "Needs outside": it needs an Arc weapon.',
  withNeeds:'Adds what the subclass can\'t do without from outside it: weapons. Spark of Discharge and Spark of Beacons need an Arc weapon, and Jolt reacts to any weapon hit.',
  withDependents:'Adds every element outside the subclass that reacts to something in it: a grenade or melee hit, Jolt, Amplified, an Orb of Power… The chips show or hide each kind.'};
const TRIGGER_ORDER = ['Dodge','Air dodge','Melee','Sliding melee','Grenade','Finisher','Weapon','Arc weapon','Super','Shield broken','Critical health'];
const TYPE_ORDER = ['trigger','weapon','subclassAbility','subclassAspect','subclassFragment','subclassSuper','keywordRule','buff','debuff','pickup','strike','summon','effect','keyword',...OUTSIDE];
const hidden = new Set();
// Each box is normal, highlighted or selected. Tapping a box selects it: its links and the boxes at their other end light up,
// on top of what is lit already. Tapping a selected box again leaves it highlighted, without its links. Tapping the background clears all.
let scope = G.scopes.find(s => s.lanes), shown = null;
const selected = new Set(), kept = new Set();
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SLOTS = {grenade:'Grenade', melee:'Melee', classAbility:'Class ability'};
const titleOf = n => (TYPES[n.type]?.[0] ?? n.type) + (n.slot ? ' · ' + (SLOTS[n.slot] ?? n.slot) : '') ;
const colorOf = n => TYPES[n.type]?.[1] ?? '--outside';
const W = 244, H = 44, TX = 46, GAPX = 110, MERGE = 22, GAPY = 12, LEFT = 16;
// The lanes the backward lines run along, between the column headings and the first row of boxes.
const LANES = 16, LANE_GAP = 4, LANE_TOP = 34, TOP = LANE_TOP + LANES * LANE_GAP + 10;
// A polyline through the points, with its corners rounded.
function route(p){ const r = 5; let d = `M${p[0][0]},${p[0][1]}`;
  for (let i = 1; i < p.length - 1; i++){ const [ax,ay] = p[i-1], [bx,by] = p[i], [cx,cy] = p[i+1];
    const r1 = Math.min(r, Math.hypot(bx-ax, by-ay)/2), r2 = Math.min(r, Math.hypot(cx-bx, cy-by)/2);
    const ux = Math.sign(bx-ax), uy = Math.sign(by-ay), vx = Math.sign(cx-bx), vy = Math.sign(cy-by);
    d += ` L${bx-ux*r1},${by-uy*r1} Q${bx},${by} ${bx+vx*r2},${by+vy*r2}`; }
  return d + ` L${p[p.length-1][0]},${p[p.length-1][1]}`; }

function visibleNodes(){ return scope.nodes.filter(id => !hidden.has(G.nodes[id].type)); }
function layout(ids){
  const set = new Set(ids);
  const edges = scope.edges.filter(e => set.has(e.from) && set.has(e.to));
  const cols = {}; let maxc = 0;
  for (const id of ids){ const c = scope.columns[id]; if (c !== undefined) maxc = Math.max(maxc, c); }
  const outside = maxc + 1;
  for (const id of ids){ const c = scope.columns[id] ?? outside; (cols[c] ||= []).push(id); }
  const pos = {};
  const keys = Object.keys(cols).map(Number).sort((a,b) => a-b);
  for (const c of keys){
    let list = cols[c];
    if (c === 0) list.sort((a,b) => rank(a) - rank(b));
    else if (c % 2 === 1) list.sort((a,b) => groupRank(a) - groupRank(b) || slotRank(a) - slotRank(b) || G.nodes[a].name.localeCompare(G.nodes[b].name));
    else {
      const bary = id => { const ys = edges.filter(e => (e.to === id && pos[e.from]) || (e.from === id && pos[e.to])).map(e => pos[e.to === id ? e.from : e.to].row); return ys.length ? ys.reduce((s,y) => s+y, 0) / ys.length : 1e3; };
      list.sort((a,b) => bary(a) - bary(b) || TYPE_ORDER.indexOf(G.nodes[a].type) - TYPE_ORDER.indexOf(G.nodes[b].type) || G.nodes[a].name.localeCompare(G.nodes[b].name));
    }
    list.forEach((id,i) => pos[id] = {col:c, row:i, x: LEFT + keys.indexOf(c) * (W + GAPX), y: TOP + i * (H + GAPY)});
  }
  return {pos, edges, keys, cols, outside};
}
// A layer column lists the subclass's supers, then its abilities, aspects and fragments, then everything else; each group by name.
const LAYER_ORDER = ['subclassSuper','subclassAbility','subclassAspect','subclassFragment'];
// Abilities in the game's order on the subclass screen, left to right: class ability, (jump,) melee, grenade.
const SLOT_ORDER = ['classAbility','melee','grenade'];
function slotRank(id){ const i = SLOT_ORDER.indexOf(G.nodes[id].slot); return i < 0 ? SLOT_ORDER.length : i; }
function groupRank(id){ const i = LAYER_ORDER.indexOf(G.nodes[id].type); return i < 0 ? LAYER_ORDER.length : i; }
function rank(id){ const n = G.nodes[id]; const i = TRIGGER_ORDER.indexOf(n.name); return i < 0 ? 50 + (n.type === 'weapon' ? 0 : 10) : i; }
function head(c, outside){ return c === 0 ? 'Triggers' : c === outside ? 'Needs outside' : c % 2 ? 'Layer ' + (c+1)/2 : 'Gives'; }
function draw(){
  document.getElementById('lanes').hidden = !scope.lanes;
  document.getElementById('scroller').hidden = !!scope.lanes;
  document.getElementById('legend').hidden = !!scope.lanes; document.getElementById('lines').hidden = !!scope.lanes;
  if (scope.lanes) { drawLanes(); return; }
  const ids = visibleNodes();
  const {pos, edges, keys, cols, outside} = layout(ids);
  const width = LEFT*2 + keys.length * W + (keys.length-1) * GAPX;
  const height = TOP + Math.max(...keys.map(c => cols[c].length)) * (H + GAPY) + 16;
  const svg = document.getElementById('svg');
  svg.setAttribute('width', width); svg.setAttribute('height', height); svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  // The lines into a box meet a little left of it, and one short horizontal line with an arrow carries them in.
  let s = `<defs>${['arrow','arrow-on'].map(m => `<marker id="${m}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css(m === 'arrow' ? '--edge' : '--fg')}"/></marker>`).join('')}</defs>`;
  keys.forEach((c,i) => s += `<text class="colhead" x="${LEFT + i*(W+GAPX)}" y="22">${head(c, outside)}</text>`);
  let back = 0;
  edges.forEach((e,i) => {
    const a = pos[e.from], b = pos[e.to];
    let d;
    // Every line leaves its source on the right and enters its target on the left. A line back to an earlier (or the same)
    // column runs out into the gap on the source's right, up to its own lane above the boxes, across, and down the gap on the
    // target's left, so it never crosses a box.
    const x1 = a.x + W, y1 = a.y + H/2, x2 = b.x, y2 = b.y + H/2;
    const xm = x2 - MERGE;
    if (b.x > a.x){ const k = (xm - x1) / 2; d = `M${x1},${y1} C${x1+k},${y1} ${xm-k},${y2} ${xm},${y2}`; }
    else {
      const lane = back++ % LANES, off = 6 + (lane % 8) * 5;
      d = route([[x1,y1],[x1+off,y1],[x1+off,LANE_TOP + lane*LANE_GAP],[xm-off,LANE_TOP + lane*LANE_GAP],[xm-off,y2],[xm,y2]]);
    }
    s += `<path class="edge ${e.kind}" data-i="${i}" data-a="${esc(e.from)}" data-b="${esc(e.to)}" d="${d}"/>`;
  });
  for (const id of ids){
    const n = G.nodes[id], p = pos[id], col = css(colorOf(n));
    s += `<g class="node" data-id="${esc(id)}" transform="translate(${p.x},${p.y})" tabindex="0" role="button" aria-label="${esc(titleOf(n) + ': ' + n.name)}">
      <rect width="${W}" height="${H}" rx="4" fill="color-mix(in srgb, ${col} 10%, ${css('--surface')})" stroke="${col}"/>
      ${n.icon ? `<rect x="6" y="6" width="${H-12}" height="${H-12}" rx="3" fill="#1c232c"/><image href="${esc(n.icon)}" x="6" y="6" width="${H-12}" height="${H-12}" preserveAspectRatio="xMidYMid meet"/>` : `<rect x="6.5" y="6.5" width="${H-13}" height="${H-13}" rx="3" fill="none" stroke="${col}" stroke-opacity=".35" stroke-dasharray="2 2"/>`}
      <text class="t" x="${TX}" y="15" fill="${col}">${esc(titleOf(n))}</text>
      <text class="n" x="${TX}" y="33">${esc(fit(n.name))}</text></g>`;
  }
  // The arrows into each box, drawn over the boxes so a box's border never hides its arrow.
  for (const id of new Set(edges.map(e => e.to))){ const b = pos[id], y = b.y + H/2;
    s += `<path class="stub" data-b="${esc(id)}" d="M${b.x - MERGE},${y} L${b.x - 1.5},${y}"/>`; }
  if (scope.timing) edges.forEach((e,i) => { const k = timingOf(e); if (!k) return;
    s += `<text class="tbadge" data-i="${i}" data-k="${k}">${TIMING[k][0]}</text>`; });
  s += '<g id="labels"></g>';
  svg.innerHTML = s;
  svg._pos = pos; svg._edges = edges;
  svg.querySelectorAll('.tbadge').forEach(b => { const p = svg.querySelector(`.edge[data-i="${b.dataset.i}"]`); const L = p.getTotalLength(), pt = p.getPointAtLength(Math.max(0, L - 30));
    b.setAttribute('x', pt.x); b.setAttribute('y', pt.y + 5); b.setAttribute('text-anchor','middle'); });
  svg.querySelectorAll('.node').forEach(g => { g.onclick = () => select(g.dataset.id); g.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(g.dataset.id); } }; });
  svg.onclick = ev => { if (ev.target === svg) select(null); };
  for (const id of [...selected, ...kept]) if (!ids.includes(id)) { selected.delete(id); kept.delete(id); }
  paint();
  if (!shown || !ids.includes(shown)) clearCard();
}
function fit(t){ return t.length > 28 ? t.slice(0, 27) + '…' : t; }
function select(id){
  if (!id){ selected.clear(); kept.clear(); shown = null; paint(); clearCard(); return; }
  if (selected.has(id)){ selected.delete(id); kept.add(id); }
  else { kept.delete(id); selected.add(id); }
  shown = id; paint(); card(id);
}
function clearCard(){ document.getElementById('card').innerHTML = '<h2>Pick a box</h2><p class="lede">Tap a box to light up its links. Tap more boxes to add theirs; tap a lit box again to drop its links. Tap the background to clear.</p>'; }
function paint(){
  const svg = document.getElementById('svg');
  svg.querySelectorAll('.on, .sel').forEach(x => x.classList.remove('on', 'sel'));
  const labels = svg.querySelector('#labels'); labels.innerHTML = '';
  const lit = new Set(kept);
  svg.querySelectorAll('.edge').forEach(p => {
    const touches = selected.has(p.dataset.a) || selected.has(p.dataset.b);
    if (!touches) return;
    p.classList.add('on'); lit.add(p.dataset.a); lit.add(p.dataset.b);
    svg.querySelector(`.stub[data-b="${CSS.escape(p.dataset.b)}"]`)?.classList.add('on');
    svg.querySelector(`.tbadge[data-i="${p.dataset.i}"]`)?.classList.add('on');
    const e = svg._edges[+p.dataset.i];
    if (e.label){ const len = p.getTotalLength(), pt = p.getPointAtLength(len/2); labels.insertAdjacentHTML('beforeend', `<text class="elabel" x="${pt.x}" y="${pt.y+4}" text-anchor="middle">${esc(e.label)}</text>`); }
  });
  selected.forEach(id => lit.add(id));
  svg.classList.toggle('dim', lit.size > 0);
  lit.forEach(id => svg.querySelector(`.node[data-id="${CSS.escape(id)}"]`)?.classList.add('on'));
  selected.forEach(id => svg.querySelector(`.node[data-id="${CSS.escape(id)}"]`)?.classList.add('sel'));
}
function card(id){
  const n = G.nodes[id];
  const ins = scope.edges.filter(e => e.to === id), outs = scope.edges.filter(e => e.from === id);
  const li = (xs, end) => '<ul>' + xs.map(e => `<li>${esc(G.nodes[e[end]].name)} <span class="mono">${esc(titleOf(G.nodes[e[end]]).toLowerCase())}${e.label ? ' · ' + esc(e.label) : ''}${e.kind !== 'gives' && e.kind !== 'needs' ? ' · ' + e.kind : ''}${timingOf(e) ? ' · ' + TIMING[timingOf(e)][0] + ' ' + TIMING[timingOf(e)][1] : ''}</span></li>`).join('') + '</ul>';
  const row = (label, xs, end) => xs.length ? `<dt>${label}</dt><dd>${li(xs, end)}</dd>` : '';
  const c = scope.columns[id];
  document.getElementById('card').innerHTML = `<h2 style="display:flex;gap:10px;align-items:center">${n.icon ? `<img src="${esc(n.icon)}" alt="" width="40" height="40" style="background:#1c232c;border-radius:4px">` : ''}${esc(n.name)}</h2><dl>
    <dt>Kind</dt><dd style="color:var(${colorOf(n)})">${esc(titleOf(n))}</dd>
    <dt>Column</dt><dd>${c === undefined ? 'needs something outside this tab' : head(c)}</dd>
    ${n.file ? `<dt>Rules file</dt><dd class="mono">${esc(n.file)}</dd>` : ''}
    ${n.source ? `<dt>Source</dt><dd class="mono">${esc(n.source)}</dd>` : ''}
    ${row('Needs', ins.filter(e => e.kind === 'needs'), 'from')}
    ${row('Given by', ins.filter(e => e.kind !== 'needs'), 'from')}
    ${row('Gives', outs.filter(e => e.kind !== 'needs'), 'to')}
    ${row(n.type === 'trigger' || n.type === 'weapon' ? 'Used by' : 'Needed by', outs.filter(e => e.kind === 'needs'), 'to')}
    ${n.description ? `<dt>Description</dt><dd>${esc(n.description)}</dd>` : ''}
    ${n.reasons?.length ? `<dt>Rules say</dt><dd><ul>${n.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul></dd>` : ''}
  </dl>`;
}
function tabs(){
  const t = document.getElementById('tabs'); t.innerHTML = '';
  G.scopes.forEach((sc,i) => { const b = document.createElement('button'); b.className = 'tab'; b.setAttribute('role','tab'); b.setAttribute('aria-selected', sc === scope); b.textContent = `${i+1} · ${sc.name}`;
    b.onclick = () => { scope = sc; selected.clear(); kept.clear(); shown = null; tabs(); filters(); legend(); lines(); draw(); document.getElementById('tabnote').textContent = NOTES[sc.id] ?? ''; }; t.appendChild(b); });
}
function filters(){
  const f = document.getElementById('filters'); f.innerHTML = '';
  const present = [...new Set(scope.nodes.map(id => G.nodes[id].type))].filter(t => OUTSIDE.includes(t));
  for (const t of present){ const b = document.createElement('button'); b.className = 'chip'; b.setAttribute('aria-pressed', !hidden.has(t)); b.textContent = TYPES[t][0] + 's';
    b.onclick = () => { hidden.has(t) ? hidden.delete(t) : hidden.add(t); filters(); draw(); }; f.appendChild(b); }
}
// ---- Lanes: one row per rule, read left to right: its trigger ➜ what must be in place ➜ what it gives.
const START_ORDER = ['trigger:dodge','trigger:air-dodge','trigger:melee','trigger:sliding-melee','trigger:grenade','trigger:finisher','trigger:super','weapon:weapon','weapon:arc-weapon','trigger:critical-health'];
let laneScope = 'subclass';
function laneNodes(){ return new Set(G.scopes.find(s => s.id === laneScope).nodes); }
// Icons the manifest doesn't have: an emoji for Orb of Power and Armor Charge; and the buffs whose icon is their element's
// (Lethal Current, Combination Blow) or none (Super) get a buff's green diamond over it, the Super's from the Super stat icon.
const EMOJI = {'orb-of-power':'⚪', 'rule:orb-of-power':'⚪', 'armor-charge':'🟨🔳🔳'};
function iconOf(n){
  if (!n) return '<i></i>';
  if (EMOJI[n.id]) return `<em class="emo${[...EMOJI[n.id]].length > 1 ? ' many' : ''}">${EMOJI[n.id]}</em>`;
  const masked = n.type === 'buff' && (n.id.startsWith('status:') || n.id === 'super');
  const src = n.id === 'super' ? G.nodes['trigger:super']?.icon : n.icon;
  if (masked && src) return `<span class="bmask"><img src="${esc(src)}" alt=""><svg viewBox="0 0 30 30"><polygon points="15,2 28,15 15,28 2,15"/></svg></span>`;
  return n.icon ? `<img src="${esc(n.icon)}" alt="">` : '<i></i>';
}
function lbox(node, name, caption, cls, title){ const n = node && G.nodes[node]; const col = n ? `var(${colorOf(n)})` : 'var(--trigger)';
  return `<div class="lbox ${cls||''}" style="--c:${col}">${iconOf(n)}<div><b>${esc(title ?? (n ? titleOf(n) : 'Trigger'))}</b><span>${esc(name ?? n?.name ?? '')}</span>${caption ? `<small>${esc(caption)}</small>` : ''}</div></div>`; }
// Results in this order: strikes, refunds and other effects, buffs, debuffs, pickups, summons; what a lane ends or adds to last.
const RESULT_ORDER = ['strike','effect','buff','debuff','pickup','summon'];
function resultRank(r){ if (r.kind !== 'gives') return 10; const n = r.node && G.nodes[r.node]; const i = n ? RESULT_ORDER.indexOf(n.type) : -1; return i < 0 ? 9 : i; }
function laneRow(l){
  const trig = l.triggers.map(x => lbox(x.node, x.text, '', 'trig', 'Trigger')).join('');
  const el = G.nodes[l.element];
  // A keyword's rule is in every build, so its lane shows only what must be in place.
  const isKeyword = el.type === 'keywordRule' || el.type === 'keyword';
  const owners = isKeyword ? [] : [lbox(l.element, el.name, 'equipped')];
  const when = [...owners, ...l.conditions.map(c => lbox(c.node, c.node ? G.nodes[c.node]?.name : c.text, c.node ? c.text : ''))].join('') || '<span class="lalways">always produces</span>';
  const res = [...l.results].sort((a,b) => resultRank(a) - resultRank(b)).map(r => { const n = r.node && G.nodes[r.node];
    const cap = [r.kind === 'ends' ? 'ends' : r.kind === 'collects' ? 'collects' : r.kind === 'boosts' ? 'adds to' : '', r.text].filter(Boolean).join(' · ');
    return lbox(r.node, n?.name ?? r.text, cap, r.kind); }).join('');
  return `<div class="lane3"><svg class="wires" aria-hidden="true"></svg><div class="seg tcol">${trig}</div><div class="seg ccol${owners.length || l.conditions.length ? '' : ' none'}">${when}</div><div class="seg rcol">${res}${l.chance ? '<span class="lor">(chance)</span>' : ''}</div></div>`;
}
// The wires of a lane, drawn after layout from where its boxes landed: the triggers meet in one arrow into the first
// condition, the conditions are joined by "and", and from the last condition one line splits into an arrow per result.
function wireLanes(){
  // An odd number of results lines its middle one up with the last condition, so the middle arrow runs straight: the
  // column gets a margin on one side (the lane centres it, so a margin of 2·d moves it by d).
  document.querySelectorAll('.lane3').forEach(lane => {
    const col = lane.querySelector('.rcol'), boxes = col.querySelectorAll('.lbox'), cond = lane.querySelectorAll('.ccol .lbox');
    col.style.marginTop = col.style.marginBottom = '0px';
    if (boxes.length % 2 === 1 && cond.length){
      const mid = boxes[(boxes.length - 1) / 2].getBoundingClientRect(), c = cond[cond.length - 1].getBoundingClientRect();
      const d = (c.top + c.bottom) / 2 - (mid.top + mid.bottom) / 2;
      if (d > 0) col.style.marginTop = `${2 * d}px`; else col.style.marginBottom = `${-2 * d}px`;
    }
  });
  document.querySelectorAll('.lane3').forEach(lane => {
    const svg = lane.querySelector('.wires'), o = lane.getBoundingClientRect();
    const box = el => { const r = el.getBoundingClientRect(); return {l:r.left-o.left, r:r.right-o.left, t:r.top-o.top, b:r.bottom-o.top, m:(r.top+r.bottom)/2-o.top}; };
    const trig = [...lane.querySelectorAll('.tcol .lbox')].map(box), cond = [...lane.querySelectorAll('.ccol .lbox')].map(box), res = [...lane.querySelectorAll('.rcol .lbox')].map(box);
    svg.setAttribute('width', lane.scrollWidth); svg.setAttribute('height', lane.offsetHeight);
    let s = '';
    const curve = (x1,y1,x2,y2) => { const k = (x2-x1)/2; return `M${x1},${y1} C${x1+k},${y1} ${x2-k},${y2} ${x2},${y2}`; };
    if (!cond.length){ const t0 = trig[0], sx0 = t0.r + 16; s += `<path class="w" d="M${t0.r},${t0.m} L${sx0},${t0.m}"/>`; res.forEach(r => s += `<path class="w arrow" d="${curve(sx0, t0.m, r.l - 2, r.m)}"/>`); svg.innerHTML = `<defs><marker id="lhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="${css('--fg')}"/></marker></defs>` + s; return; }
    const c0 = cond[0], cl = cond[cond.length-1];
    const mx = c0.l - 16;
    trig.forEach(t => s += `<path class="w" d="${curve(t.r, t.m, mx, c0.m)}"/>`);
    s += `<path class="w arrow" d="M${mx},${c0.m} L${c0.l - 2},${c0.m}"/>`;
    for (let i = 1; i < cond.length; i++){ const a = cond[i-1], b = cond[i], x = (a.r + b.l)/2;
      s += `<path class="w and" d="M${a.r},${a.m} L${b.l},${b.m}"/><text class="wl" x="${x}" y="${a.m - 6}" text-anchor="middle">and</text>`; }
    const sx = cl.r + 16;
    s += `<path class="w" d="M${cl.r},${cl.m} L${sx},${cl.m}"/>`;
    res.forEach(r => s += `<path class="w arrow" d="${curve(sx, cl.m, r.l - 2, r.m)}"/>`);
    svg.innerHTML = `<defs><marker id="lhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="${css('--fg')}"/></marker></defs>` + s;
  });
}
addEventListener('resize', () => { if (scope.lanes) wireLanes(); });
function drawLanes(){
  const inScope = laneNodes(), box = document.getElementById('lanes');
  const lanes = G.lanes.filter(l => inScope.has(l.element));
  const keyOf = l => l.triggers[0].node ?? ('text:' + l.triggers[0].text.replace(/ (hit|kill|cast|sustained hit|\d.*)$/, ''));
  const groups = new Map();
  for (const l of lanes){ const k = keyOf(l); (groups.get(k) ?? groups.set(k, []).get(k)).push(l); }
  const rank = k => { const i = START_ORDER.indexOf(k); return i >= 0 ? i : k === 'text:Always' ? 999 : k.startsWith('trigger:') || k.startsWith('weapon:') ? 50 : 100; };
  const order = [...groups.keys()].sort((a,b) => rank(a) - rank(b) || a.localeCompare(b));
  const nameOf = k => k.startsWith('text:') ? (k === 'text:Always' ? 'Always on' : k.slice(5)) : (G.nodes[k]?.name ?? k);
  const scopeChip = `<div class="bar">${['subclass','withNeeds','withDependents'].map(id => `<button class="chip" aria-pressed="${laneScope===id}" data-scope="${id}">${esc(G.scopes.find(s => s.id===id).name)}</button>`).join('')}</div>`;
  box.innerHTML = `` + scopeChip
    + `<div class="lscroll">` + order.map(k => { const n = G.nodes[k];
      return `<section class="lgroup"><h3>${n?.icon ? `<img src="${esc(n.icon)}" alt="">` : ''}${esc(nameOf(k))} <small>${groups.get(k).length}</small></h3>${groups.get(k).map(laneRow).join('')}</section>`; }).join('') + `</div>`;
  box.querySelectorAll('[data-scope]').forEach(b => b.onclick = () => { laneScope = b.dataset.scope; drawLanes(); });
  requestAnimationFrame(wireLanes);
}
function lines(){
  if (scope.timing){ document.getElementById('lines').innerHTML = [['gives','gives','solid'],['needs','is needed by','4 3']].map(([c,txt,d]) => `<span><svg width="34" height="8"><line x1="1" y1="4" x2="33" y2="4" stroke="var(--edge)" stroke-width="1.5" ${d==='solid'?'':`stroke-dasharray="${d}"`}/></svg>${txt}</span>`).join('')
    + Object.values(TIMING).map(([g,txt,why]) => `<span title="${why}"><b style="color:var(--fg);margin-right:5px">${g}</b>${txt}: ${why}</span>`).join(''); return; }
  const k = [['gives','gives','solid'],['needs','is needed by','4 3'],['ends','ends or spends','1 3'],['collects','collects','9 4'],['boosts','adds stacks to','solid']];
  document.getElementById('lines').innerHTML = k.map(([c,txt,d]) => `<span><svg width="34" height="8"><line x1="1" y1="4" x2="33" y2="4" stroke="var(--edge)" stroke-width="${c==='boosts'?2.4:1.5}" ${d==='solid'?'':`stroke-dasharray="${d}"`} stroke-linecap="round"/></svg>${txt}</span>`).join('');
}
function legend(){
  const present = new Set(scope.nodes.map(id => G.nodes[id].type));
  document.getElementById('legend').innerHTML = TYPE_ORDER.filter(t => present.has(t) && !OUTSIDE.includes(t)).map(t => `<span class="key" style="--c:var(${TYPES[t][1]})"><b>${TYPES[t][0]}</b></span>`).join('')
    + (OUTSIDE.some(t => present.has(t)) ? `<span class="key" style="--c:var(--outside)"><b>Outside the subclass</b></span>` : '');
}
document.getElementById('title').textContent = G.title + ' lanes';
document.getElementById('tabnote').textContent = NOTES[scope.id] ?? '';
tabs(); filters(); legend(); lines(); draw();
const redraw = () => draw();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw);
new MutationObserver(redraw).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
</script>
