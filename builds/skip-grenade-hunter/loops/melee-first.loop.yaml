# Loopsmith loop v1
loop: Melee first
description: |-
  Open with the melee instead of the dodge: slide-melee to jolt the pack, then skip grenade and
  Arc weapon into it, grab the orbs and dodge last to refill the melee. Gambler's Dodge's melee
  refill depends on the Melee stat, so the rules give it as unknown ("?").
catalog: authored-ad14b84025e4
steps:
  - do: pack:new
    note: 'The next group of enemies: a new pack, nothing on it yet'
  - do: melee:slide:kill
    note: "Slide + melee: Tempest Strike's uppercut jolts, Impact Induction refunds grenade energy, Combination Blow"
  - do: max:bolt-charge
    note: Bolt Charge at x10 — Shinobu's Vow and Flashover; the next ability hit discharges it
  - do: grenade:kill
    note: 'Skip grenade into the jolted pack: its hit discharges Bolt Charge; Amplified and Ionic Traces'
  - do: energy:kill
    note: 'Arc weapon kill: Spark of Discharge traces, Harmonic Siphon orb'
  - do: pickup:orb-of-power
    note: 'Orbs: Armor Charge and Unraveling Rounds'
  - do: class
    note: Gambler's Dodge to refill the melee (the amount depends on the Melee stat)
build: |
  # Skip Grenade Hunter - Plunderthabooty's Arc Hunter "infinite skip grenade" build.
  # See note.txt (the user's explanation), transcript.txt (the video), note-map.md (golden trace
  # expectations) and discrepancies.md (where the sources disagree and what was encoded).
  name: Skip Grenade Hunter
  author: Plunderthabooty
  source: https://www.youtube.com/watch?v=zvd6sNS463E
  class: hunter
  subclass: arc
  # The video says "take whatever super you like" and suggests Arc Staff; the super's element matters
  # for Harmonic Siphon (Arc weapon kills).
  super: arc-staff
  grenade: skip-grenade
  melee: combination-blow
  classAbility: gamblers-dodge
  # Ascension is the creator's alternative to Flow State.
  aspects: [tempest-strike, flow-state]
  fragments: [spark-of-resistance, spark-of-frequency, spark-of-shock, spark-of-discharge]
  exoticArmor: shinobus-vow
  armorSetBonuses: [luminopotent-2pc, luminopotent-4pc]
  # Elemental Charge x2 (boots) and Grenade Kickstart x2 (gauntlets) per the video; the rest per the note.
  armorMods:
    - elemental-charge
    - elemental-charge
    - grenade-kickstart
    - grenade-kickstart
    - bomber
    - reaper
    - harmonic-siphon
    - strand-siphon
    - impact-induction
  artifactPerks:
    - defibrillating-blast
    - flashover
    - dielectric
    - to-shreds
    - horde-shuttle
    - unraveling-orbs
    - photonic-flare
  weapons:
    # Slice per the video. Attrition Orbs placement is INFERRED: the note credits it on strand weapon
    # kills, Clarity says it is a weapon trait, and Festival Flight is the only Strand weapon named.
    # Its slot, name, damage type and archetype (a Strand grenade launcher) are its hash's, from Bungie's manifest.
    - { hash: 4019651319, perks: [slice, attrition-orbs] } # Festival Flight
    # Crisis Inverted, the Arc hand cannon of the build's DIM link (dim-loadout.json): neither source names the energy
    # weapon, but Harmonic Siphon's orbs and Spark of Discharge's Ionic Traces need Arc weapon kills. Its slot,
    # name, damage type and archetype are its hash's (Bungie's manifest). No perks: the link names none.
    - { hash: 2888266564, perks: [] } # Crisis Inverted
  # Health is not given in the video. (It also says "a 100 class ability" once; 104 is the stated stat.)
  stats: { weapons: 47, class: 104, grenade: 145, super: 27, melee: 79 }
