# Loopsmith loop v1
loop: Infinite skip grenades
description: |-
  The creator's loop: dodge to arm Slice and Reaper, skip grenade into the pack, clean up with
  the Strand and Arc weapons, grab the orbs, skip grenade again. Every jolted kill feeds Bolt
  Charge and Ionic Traces, which give grenade energy back. Tempest Strike's Bolt Charge on those
  kills doesn't stack with Dielectric's, so the analysis lists it as wasted.
catalog: authored-e707a3336348
steps:
  - do: pack:new
    note: 'The next group of enemies: a new pack, nothing on it yet'
  - do: class
    note: "Gambler's Dodge: arms Slice and Reaper; Bomber refunds grenade energy"
  - do: grenade:kill
    note: 'Skip grenade into the pack: Spark of Shock jolts, the jolted kill gives Amplified, Bolt Charge and an Ionic Trace'
  - do: kinetic:kill
    note: 'Festival Flight: Slice severs, Reaper and Attrition Orbs drop orbs, To Shreds gives Woven Mail (and unravels once the pack is severed)'
  - do: energy:kill
    note: 'Arc weapon on the jolted pack: Spark of Discharge traces, Harmonic Siphon orb'
  - do: pickup:orb-of-power
    note: 'Grab the orbs: Armor Charge for Grenade Kickstart, and Unraveling Rounds'
  - do: max:bolt-charge
    note: Bolt Charge at x10 — Shinobu's Vow gives New Tricks and grenade energy, Flashover makes you Amplified
  - do: grenade:kill
    note: 'Second skip grenade: Kickstart spends Armor Charge, New Tricks is spent, and its hit discharges Bolt Charge'
build: |
  # Skip Grenade Hunter - Plunderthabooty's Arc Hunter "infinite skip grenade" build.
  # See note.txt (the user's explanation), transcript.txt (the video), note-map.md (golden trace
  # expectations) and discrepancies.md (where the sources disagree and what was encoded).
  name: Skip Grenade Hunter
  author: Plunderthabooty
  source: https://www.youtube.com/watch?v=zvd6sNS463E
  class: hunter
  subclass: arc
  # The video says "take whatever super you like" and suggests Arc Staff; the super's element matters
  # for Harmonic Siphon (Arc weapon kills).
  super: arc-staff
  grenade: skip-grenade
  melee: combination-blow
  classAbility: gamblers-dodge
  # Ascension is the creator's alternative to Flow State.
  aspects: [tempest-strike, flow-state]
  fragments: [spark-of-resistance, spark-of-frequency, spark-of-shock, spark-of-discharge]
  exoticArmor: shinobus-vow
  armorSetBonuses: [luminopotent-2pc, luminopotent-4pc]
  # Elemental Charge x2 (boots) and Grenade Kickstart x2 (gauntlets) per the video; the rest per the note.
  armorMods:
    - elemental-charge
    - elemental-charge
    - grenade-kickstart
    - grenade-kickstart
    - bomber
    - reaper
    - harmonic-siphon
    - strand-siphon
    - impact-induction
  artifactPerks:
    - defibrillating-blast
    - flashover
    - dielectric
    - to-shreds
    - horde-shuttle
    - unraveling-orbs
    - photonic-flare
  weapons:
    # Slice per the video. Attrition Orbs placement is INFERRED: the note credits it on strand weapon
    # kills, Clarity says it is a weapon trait, and Festival Flight is the only Strand weapon named.
    # Archetype omitted: no source names it.
    - { slot: kinetic, name: Festival Flight, type: strand, perks: [slice, attrition-orbs] }
    # Placeholder: neither source names the energy weapon, but Spark of Discharge and Harmonic
    # Siphon need Arc weapon kills to do anything.
    - { slot: energy, name: Any Arc weapon, type: arc, perks: [] }
  # Health is not given in the video. (It also says "a 100 class ability" once; 104 is the stated stat.)
  stats: { weapons: 47, class: 104, grenade: 145, super: 27, melee: 79 }
