# Demolitionist Hunter - the Demolitionist grenade loop: the grenade refills an Arc Hand Cannon rolling
# Demolitionist, and that hand cannon's kills give grenade energy back for the next grenade.
# The loop Mactics plays with an Arc Hand Cannon rolling Demolitionist; the rest of that build isn't known
# (no DIM link), so this build holds only what the loop needs. See discrepancies.md.
name: Demolitionist Hunter
class: hunter
subclass: arc
super: "?"
grenade: skip-grenade
weapons:
  # No source names the hand cannon: Crisis Inverted stands in for it, an Arc Hand Cannon that rolls Demolitionist
  # (Bungie's manifest). Its archetype picks Demolitionist's amount (10%; 20% only on Fusion Rifles, Glaives,
  # Shotguns and Sniper Rifles).
  - { hash: 2888266564, perks: [demolitionist] } # Crisis Inverted
