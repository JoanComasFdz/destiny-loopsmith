  - { hash: 3657186535, name: "Focusing Strike", kind: armorMod, type: "Arms Armor Mod", tier: basic, slot: arms, description: "Grants class ability energy when you cause damage with a powered melee attack.", icon: /common/destiny2_content/icons/ece0654ecd4b16e5011903f03eee8c74.png }
