  - { hash: 3067648983, name: "Solar Dexterity", kind: armorMod, type: "Arms Armor Mod", tier: basic, slot: arms, description: "Faster ready and stow speed for Solar weapons.", icon: /common/destiny2_content/icons/b77c4592c9bd332a94b75cc0179bb319.png }
  - { hash: 3168997075, name: "Stormcaller", kind: subclass, type: "Warlock Subclass", tier: basic, plugs: [25156515, 25156514, 4154539169, 4154539168, 4154539171, 1081893460, 1081893461, 1232050830, 1232050831, 2994412667, 2481624867, 2909720723, 1713935764, 146194908, 4198689901, 1582574009, 1293395731, 1293395730, 1293395729, 1293395728, 3478354817, 3478354816, 1727069367, 1727069366, 1727069365, 1727069364, 1727069363, 1727069362, 1727069361, 1727069360, 1727069375, 1727069374, 3277705906, 3277705907, 3277705904, 3277705905], description: "Stormtrance: Chain Arc Lightning from your hands to electrify targets with devastating streams of Arc Light that intensify over time. Casting Stormtrance creates a jolting shockwave underneath you.\n\n[Sprint] : Teleport forward, consuming a small amount of Super energy.\nChaos Reach: Unleash a long-range channeled beam of concentrated Arc energy. Sustained damage on a single target creates a jolting lightning strike at their position.\n\n [Super] while active to deactivate your Super early, saving Super energy.", icon: /common/destiny2_content/icons/949af7a61d60a8e6071282daafa9e6e9.png }
