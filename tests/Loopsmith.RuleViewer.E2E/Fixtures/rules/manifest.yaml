  - { hash: 3291545503, name: "Shadebinder", kind: subclass, type: "Warlock Subclass", tier: basic, plugs: [3492047641, 3492047640, 890263313, 890263312, 890263315, 2543177538, 1399217, 1399216, 1399219, 1399218, 668903196, 668903197, 2642597904, 2651551055, 3469412970, 3469412971, 3469412968, 3469412969, 3469412974, 3469412975, 537774540, 537774541, 537774542, 537774543, 2483898429, 2483898428, 2483898431, 2483898430, 2368990400, 2368990401], description: "Winter's Wrath: Summon a [Stasis] Stasis staff. While your Super is active:\n\n[Super Primary] : Cast out a barrage of [Stasis] Stasis shards that freeze targets.\n\n[Super Secondary] : Cast out a shockwave that shatters all frozen targets.", icon: /common/destiny2_content/icons/6e441ffa8c8171ce9caf71e51b72fc19.png }
