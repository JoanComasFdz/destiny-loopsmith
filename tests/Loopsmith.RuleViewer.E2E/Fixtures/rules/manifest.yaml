  - { hash: 3726719281, name: "Bolstering Detonation", kind: armorMod, type: "Arms Armor Mod", tier: basic, slot: arms, description: "Grants class ability energy when you cause damage with a grenade.", icon: /common/destiny2_content/icons/c0ed84b669c9ac2bf4c128f4ef177f11.png }
  - { hash: 3769507632, name: "Gathering Storm", kind: super, type: "Super Ability", description: "Hurl your Arc Staff forward, embedding it into surfaces or large targets and jolting nearby targets.\n\nAfter a short time, a devastating lightning bolt strikes the staff, overcharging it with Arc energy. While overcharged, your staff discharges lightning at nearby foes.", icon: /common/destiny2_content/icons/edf23f2e6951efcab4c4b10630b6f7c4.png }
  - { hash: 3769507633, name: "Arc Staff", kind: super, type: "Super Ability", description: "Form a staff of pure Arc energy and acrobatically take out your foes.\n\n[Block] : Hold to deflect incoming projectiles with your Arc staff.\n\nDeflecting a projectile grants you a stack of Bolt Charge.\n\nHeavy attack combos and airborne heavy slams blind targets.", icon: /common/destiny2_content/icons/435489f514e2bf88d25c452a96f2dff9.png }
  - { hash: 3769507635, name: "Storm's Edge", kind: super, type: "Super Ability", description: "Summon an electrified dagger and throw it in your aim direction.\n\nWhen the dagger hits a surface or a target, you blink to its location and perform a powerful whirling strike, damaging any nearby targets. Can be reactivated after the strike to perform additional throws.\n\nIf the dagger flies for long enough without impacting anything, it detonates and you blink to the detonation location.", icon: /common/destiny2_content/icons/515dafc7f95e310e26bf3189f640231c.png }
  - { hash: 3785442599, name: "Threadrunner", kind: subclass, type: "Hunter Subclass", tier: basic, plugs: [1282157891, 1282157890, 3721022587, 3721022586, 3721022585, 2463983862, 1680616210, 1377143502, 2809342386, 4228170798, 2470512752, 4249729127, 4249729126, 4249729125, 4249729124, 4208512218, 4208512219, 4208512216, 4208512217, 4208512222, 4208512223, 4208512220, 4208512221, 4208512210, 4208512211, 3192552689, 3192552688, 3192552691, 3192552690], description: "Silkstrike: Weave a vicious rope dart and tear through your targets.\n\n[Light Attack] : Swing the rope dart in front of you to deal damage. The tip of the dart deals bonus damage, and defeating targets with the tip causes them to explode.\n\n[Heavy Attack] : Swing the rope dart in a circular motion to deal heavy damage all around you.\n\n[Grenade] : Use the grapple to move forward quickly.", icon: /common/destiny2_content/icons/41c0024ce809085ac16f4e0777ea0ac4.png }
  - { hash: 3941205951, name: "Dawnblade", kind: subclass, type: "Warlock Subclass", tier: basic, plugs: [2979486803, 2979486802, 2979486801, 3686638443, 3686638442, 3686638441, 2274196886, 2274196887, 2274196884, 1470370539, 1470370538, 2946990961, 3969294337, 2581086849, 2216698406, 3199702642, 1013086087, 2202441959, 1841016428, 83039195, 83039194, 83039193, 83039192, 4180586737, 4180586736, 362132293, 362132292, 362132295, 362132294, 362132289, 362132288, 362132291, 362132290, 362132301, 362132300, 1051276348, 1051276349, 1051276350, 1051276351], description: "Daybreak: Fashion Solar Light into blades and smite your foes from the sky.\n\nYour Daybreak projectiles scorch targets on impact.\nWell of Radiance: Thrust your Sword into the ground, damaging and scorching nearby targets. The sword projects a continuous aura, granting radiant effects and restoration to nearby allies, protecting them from the effects of Stasis.\nSong of Flame: Unleash your inner fire, making your equipped weapons radiant and enhancing your abilities.\n\n[Melee] : Release a supercharged melee attack that launches additional projectiles.\n\n[Grenade] : Create a sentient flame wisp that seeks out targets and detonates in a scorching explosion, then seeks out other nearby targets.\n\nWhile Song of Flame is active, you and nearby allies regenerate abilities more quickly, are more resistant to incoming damage, and your [Solar] Solar and Kinetic weapons scorch targets.", icon: /common/destiny2_content/icons/fedcb91b7ab0584c12f0e9fec730702b.png }
