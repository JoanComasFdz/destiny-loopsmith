  - { hash: 2240888816, name: "Gunslinger", kind: subclass, type: "Hunter Subclass", tier: basic, plugs: [3636300854, 3636300855, 3636300852, 1128768654, 1128768655, 1128768652, 375052469, 375052468, 375052471, 4016776974, 4016776975, 4016776972, 4016776973, 2946990961, 3969294337, 2581086849, 2216698406, 3199702642, 1013086087, 2202441959, 1841016428, 3066103998, 3066103999, 3066103996, 3066103997, 4180586737, 4180586736, 362132293, 362132292, 362132295, 362132294, 362132289, 362132288, 362132291, 362132290, 362132301, 362132300, 1051276348, 1051276349, 1051276350, 1051276351], description: "Golden Gun: Deadshot: Summon a rapid-fire flaming pistol that scorches and disintegrates targets with Solar Light.\n\nFinal blows with this weapon refund a Golden Gun round and extend your super duration.\n\nBenefits from being radiant.\nGolden Gun: Marksman: Summon a precision flaming pistol that scorches and disintegrates targets with Solar Light.\n\nYour Golden Gun deals massively increased precision damage, overpenetrates targets, and creates Orbs of Power on precision hits.\n\nBenefits from being radiant.\nBlade Barrage: Vault into the air and unleash a volley of Solar-charged knives that explode and scorch targets.", icon: /common/destiny2_content/icons/fedcb91b7ab0584c12f0e9fec730702b.png }
  - { hash: 2267311547, name: "Stasis Dexterity", kind: armorMod, type: "Arms Armor Mod", tier: basic, slot: arms, description: "Faster ready and stow speed for Stasis weapons.", icon: /common/destiny2_content/icons/7f9b32cd9d186059d88bb4d75532116c.png }
  - { hash: 2328211300, name: "Arcstrider", kind: subclass, type: "Hunter Subclass", tier: basic, plugs: [426473316, 426473317, 95544330, 95544331, 95544328, 95544329, 3769507633, 3769507632, 3769507635, 2716335211, 2716335210, 2994412667, 2481624867, 2909720723, 1713935764, 146194908, 4198689901, 1582574009, 4194622036, 4194622037, 4194622038, 4194622039, 3478354817, 3478354816, 1727069367, 1727069366, 1727069365, 1727069364, 1727069363, 1727069362, 1727069361, 1727069360, 1727069375, 1727069374, 3277705906, 3277705907, 3277705904, 3277705905], description: "Arc Staff: Form a staff of pure Arc energy and acrobatically take out your foes.\n\n[Block] : Hold to deflect incoming projectiles with your Arc staff.\n\nDeflecting a projectile grants you a stack of Bolt Charge.\n\nHeavy attack combos and airborne heavy slams blind targets.\nGathering Storm: Hurl your Arc Staff forward, embedding it into surfaces or large targets and jolting nearby targets.\n\nAfter a short time, a devastating lightning bolt strikes the staff, overcharging it with Arc energy. While overcharged, your staff discharges lightning at nearby foes.\nStorm's Edge: Summon an electrified dagger and throw it in your aim direction.\n\nWhen the dagger hits a surface or a target, you blink to its location and perform a powerful whirling strike, damaging any nearby targets. Can be reactivated after the strike to perform additional throws.\n\nIf the dagger flies for long enough without impacting anything, it detonates and you blink to the detonation location.", icon: /common/destiny2_content/icons/949af7a61d60a8e6071282daafa9e6e9.png }
  - { hash: 2447449706, name: "Heavy Handed", kind: armorMod, type: "Arms Armor Mod", tier: basic, slot: arms, description: "Your powered melee final blows create Orbs of Power.", icon: /common/destiny2_content/icons/b4f287bb2bea2ae61431cfc3a35f6fa5.png }
  - { hash: 2453351420, name: "Nightstalker", kind: subclass, type: "Hunter Subclass", tier: basic, plugs: [2816982784, 2816982785, 20616658, 20616659, 20616656, 2722573683, 2722573682, 2722573681, 1139822081, 1139822080, 1255073825, 2809141585, 2265076177, 1016030582, 1514173218, 1547656727, 3232422679, 187655372, 187655373, 187655374, 187655375, 3854948621, 3854948620, 2272984665, 2272984664, 2272984667, 2272984666, 2272984669, 2272984668, 2272984671, 2272984670, 2272984657, 2272984656, 2661180600, 2661180601, 2661180602, 2661180603], description: "Shadowshot: Deadfall: Tether foes to a Void Anchor, dramatically weakening and suppressing them for you and your allies.\n\nThe Void Anchors fired from Shadowshot pull targets toward the impact point, which then become traps and wait for prey. Void Anchors have increased range and last longer.\nSpectral Blades: Summon a pair of deadly Void blades and stalk the battlefield in a veil of shadows.\n\n[Light Attack] : Perform a quick melee attack.\n\n[Heavy Attack] : Perform a heavy attack that weakens your target, and once again vanish from sight.\nShadowshot: Moebius Quiver: Tether foes to a Void Anchor, dramatically weakening and suppressing them for you and your allies.\n\nFire two volleys of three Void Arrows that seek nearby targets. Shadowshot makes targets volatile and deals increased damage to tethered targets. Defeating tethered targets creates Orbs of Power.\n\nWhile the Super is active, dealing damage increases the damage of your Void Arrows and Bow weapons.", icon: /common/destiny2_content/icons/32b112a9460e6f0e2b9ee15dc53fe1c1.png }
  - { hash: 2479297167, name: "Harmonic Dexterity", kind: armorMod, type: "Arms Armor Mod", tier: basic, slot: arms, description: "Arc Dexterity: Faster ready and stow speed for Arc weapons.\nSolar Dexterity: Faster ready and stow speed for Solar weapons.\nStasis Dexterity: Faster ready and stow speed for Stasis weapons.\nStrand Dexterity: Faster ready and stow speed for Strand weapons.\nVoid Dexterity: Faster ready and stow speed for Void weapons.", icon: /common/destiny2_content/icons/dbd9f5aa248d9168ce4896679e05d620.png }
