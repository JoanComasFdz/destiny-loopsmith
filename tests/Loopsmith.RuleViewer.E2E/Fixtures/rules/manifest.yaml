  - { hash: 2794359402, name: "Arc Dexterity", kind: armorMod, type: "Arms Armor Mod", tier: basic, slot: arms, description: "Faster ready and stow speed for Arc weapons.", icon: /common/destiny2_content/icons/d5aff100d81a8b309afb6f06dffebf64.png }
  - { hash: 2842471112, name: "Sentinel", kind: subclass, type: "Titan Subclass", tier: basic, plugs: [2722641740, 2722641741, 1380268166, 1380268167, 1380268164, 4260353953, 4260353952, 4260353955, 4220332375, 4220332374, 1255073825, 2809141585, 2265076177, 1016030582, 1514173218, 1547656727, 3232422679, 1602994568, 1602994569, 1602994570, 1602994571, 3854948621, 3854948620, 2272984665, 2272984664, 2272984667, 2272984666, 2272984669, 2272984668, 2272984671, 2272984670, 2272984657, 2272984656, 2661180600, 2661180601, 2661180602, 2661180603], description: "Ward of Dawn: Create a protective dome for you and your allies.\n\nWhile inside Ward of Dawn, allies gain Void overshield and increased weapon damage, while targets inside the Ward are weakened.\n\nThe Ward's owner also gains increased melee damage while inside and can pick up and throw the Ward's core to reposition the Ward up to two times.\nSentinel Shield: [Super] : Summon a shield of Void Light. \nWhile Sentinel Shield is active:\n[Light Attack] : Attack.\n[Block] : Block.\n[Grenade] : Perform a Shield Throw.\n\nGuard with Sentinel Shield to create a defensive wall that draws hostile fire. Allies behind the shield have increased survivability, weapon damage, and passive reload.\n\nGuarding allies and blocking damage makes the shield last longer and increases your Shield Throw damage.\nTwilight Arsenal: [Super] : Summon three Void axes and throw them at your foes one after another. On impact, the axes pull in nearby targets and detonate in a weakening explosion. After exploding, the axes can be picked up by you or your allies and used as a weapon for a short time.\n\nWhile carrying a Void axe:\n[Light Attack] : Slash forward with your axe, dealing damage and weakening targets.\n[Heavy Attack] : Throw the axe, consuming all remaining ammo.", icon: /common/destiny2_content/icons/32b112a9460e6f0e2b9ee15dc53fe1c1.png }
  - { hash: 2849050827, name: "Voidwalker", kind: subclass, type: "Warlock Subclass", tier: basic, plugs: [2209081649, 2209081648, 1237488987, 1237488986, 1237488985, 1237488984, 1656118680, 1656118681, 1656118682, 2299867342, 1255073825, 2809141585, 2265076177, 1016030582, 1514173218, 1547656727, 3232422679, 2321824285, 2321824284, 2321824287, 2321824286, 3854948621, 3854948620, 2272984665, 2272984664, 2272984667, 2272984666, 2272984669, 2272984668, 2272984671, 2272984670, 2272984657, 2272984656, 2661180600, 2661180601, 2661180602, 2661180603], description: "Nova Warp: Step between dimensions to subvert the laws of physics.\n\n[Super Secondary] : Teleport a short distance and release weakening seekers.\n\n[Super Primary] : Unleash a deadly Void eruption. A fully charged attack makes targets volatile.\nNova Bomb: Vortex: Hurl an explosive bolt of Void Light at a target, disintegrating those caught within its blast.\n\nNova Bomb creates a singularity that pulls targets inward and continually damages those trapped inside.\nNova Bomb: Cataclysm: Hurl an explosive bolt of Void Light at a target, disintegrating those caught within its blast.\n\nNova Bomb travels slowly and seeks targets. Detonations shatter into smaller seeker projectiles.", icon: /common/destiny2_content/icons/32b112a9460e6f0e2b9ee15dc53fe1c1.png }
  - { hash: 2854370169, name: "The Focused Fist", kind: other, type: "Titan Finisher", tier: basic, description: "[Finisher] : Finish critically wounded combatants.", icon: /common/destiny2_content/icons/3ae934c2f8b724c3507cb1af83ec3533.jpg }
  - { hash: 2932390016, name: "Striker", kind: subclass, type: "Titan Subclass", tier: basic, plugs: [489583096, 489583097, 489583098, 1698387814, 1698387815, 1698387812, 119041299, 119041298, 2708585277, 2708585276, 2708585279, 2994412667, 2481624867, 2909720723, 1713935764, 146194908, 4198689901, 1582574009, 1656549672, 1656549673, 1656549674, 1656549675, 3478354817, 3478354816, 1727069367, 1727069366, 1727069365, 1727069364, 1727069363, 1727069362, 1727069361, 1727069360, 1727069375, 1727069374, 3277705906, 3277705907, 3277705904, 3277705905], description: "Fists of Havoc: Supercharge your fists and slam the ground with the force of a maelstrom. While active:\n\n[Light Attack] : Quickly dash forward, dealing damage to any impacted targets.\n\n[Heavy Attack] : Slam your fists to the ground, blinding targets and dealing damage in an area around you, leaving aftershocks in your wake. Performing a slam from the air or after a dash deals additional damage.\nThundercrash: Hurtle through the air like a missile and crash into targets to inflict meteoric damage.", icon: /common/destiny2_content/icons/949af7a61d60a8e6071282daafa9e6e9.png }
