  - { hash: 2984351204, name: "Roaring Flames", kind: aspect, type: "Solar Aspect", description: "Final blows with [Solar] Solar abilities or ignitions increase the damage of your Solar abilities. Stacks 3 times.", icon: /common/destiny2_content/icons/208e4d0d635832dd78288de5532fe062.jpg }
  - { hash: 2984351205, name: "Sol Invictus", kind: aspect, type: "Solar Aspect", description: "Solar ability final blows, Hammer of Sol impacts, and defeating scorched targets creates Sunspots. Your abilities regenerate faster, and your Super drains more slowly while standing in a Sunspot.\n\nSunspots apply scorch and deal damage to targets inside. Entering a Sunspot applies restoration.", icon: /common/destiny2_content/icons/1552df4d776b01d9f8c00d6c910aec97.jpg }
  - { hash: 2984351206, name: "Consecration", kind: aspect, type: "Solar Aspect", description: "While sliding, activate your charged melee ability to launch a wave of [Solar] Solar energy forward, damaging and scorching targets in front of you as you leap into the air.\n\nWhile airborne, activate your charged melee again to slam to the ground and create a second larger wave of damaging [Solar] Solar energy. If the wave hits a scorched target, they ignite.", icon: /common/destiny2_content/icons/5c71b63e8b653cd63a2ae0d8a8c64979.jpg }
  - { hash: 2984351207, name: "Shieldburst", kind: aspect, type: "Solar Aspect", description: "Enhances your equipped barricade with [Solar] Solar capabilities.\n\nTowering Barricade: Your barricade slides forward across the ground before stopping, allowing you to advance in safety.\n\nRally Barricade: Standing behind your barricade grants scorching rounds to your allies' Solar and Kinetic weapons.\n\nWhile your barricade is deployed, activate your class ability again to remotely detonate it, scorching combatants caught in the detonation. Dealing damage increases the power of the blast.\n\nThis ability's damage increases with your Class stat when your Class stat is 100 or higher.", icon: /common/destiny2_content/icons/7082b2bae0f0c4dfc49b7b070d8ce9e8.jpg }
