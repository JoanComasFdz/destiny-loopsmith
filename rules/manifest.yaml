  - { hash: 2793548555, name: "Stasis Loader", kind: armorMod, type: "Arms Armor Mod", tier: basic, slot: arms, description: "Increases reload speed of Stasis weapons.", icon: /common/destiny2_content/icons/19b832bc1566475c2f97b72b6cd3fa31.png }
  - { hash: 2794359402, name: "Arc Dexterity", kind: armorMod, type: "Arms Armor Mod", tier: basic, slot: arms, description: "Faster ready and stow speed for Arc weapons.", icon: /common/destiny2_content/icons/d5aff100d81a8b309afb6f06dffebf64.png }
  - { hash: 2801811288, name: "Stasis Holster", kind: armorMod, type: "Leg Armor Mod", tier: basic, slot: legs, description: "Gradually reloads your stowed Stasis weapons over time.", icon: /common/destiny2_content/icons/cfac1b2503007b51eb19e59ae6b0cc37.png }
  - { hash: 2805854721, name: "Strand Holster", kind: armorMod, type: "Leg Armor Mod", tier: basic, slot: legs, description: "Gradually reloads your stowed Strand weapons over time.", icon: /common/destiny2_content/icons/0fcd4ee15f9e2362479f33882571d210.png }
  - { hash: 2809141585, name: "Void Wall", kind: grenade, type: "Void Grenade", description: "A grenade that creates a horizontal wall of burning Void Light.", icon: /common/destiny2_content/icons/a905c46ea9edc45f2773b30b719bd6dc.jpg }
  - { hash: 2809342386, name: "Shackle Grenade", kind: grenade, type: "Strand Grenade", description: "A thrown weapon of weighted Strand matter that detonates on impact, suspending targets and creating additional suspending subprojectiles.", icon: /common/destiny2_content/icons/a2c73298753fdd565a22d3d6712820ab.jpg }
  - { hash: 2812559045, name: "Arc/Strand Siphon Combo", kind: armorMod, type: "Helmet Armor Mod", tier: basic, slot: helmet, description: "Arc Siphon: Rapid Arc weapon final blows create an Orb of Power.\nStrand Siphon: Rapid Strand weapon final blows create Orbs of Power.", icon: /common/destiny2_content/icons/97317a9742097d356e815e3bb5d58d5a.png }
  - { hash: 2815817957, name: "Void Scavenger", kind: armorMod, type: "Leg Armor Mod", tier: basic, slot: legs, description: "Void weapons get bonus reserves when picking up ammo used by that weapon.", icon: /common/destiny2_content/icons/b49ab98834bf9ffc7f597b1cbafed3fb.png }
