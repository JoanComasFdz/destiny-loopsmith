  - { hash: 3418165135, name: "Vorpal Weapon", kind: weaponPerk, type: "Enhanced Trait", tier: common, description: "Increased damage against bosses, vehicles, and Guardians with their Super active. Stability is improved. Swords have improved guard resistance.", icon: /common/destiny2_content/icons/bc5130b227ee577f2678ec2d2c97bf4a.png }
  - { hash: 3422796781, name: "Slice", kind: weaponPerk, type: "Enhanced Trait", tier: common, description: "Casting your class ability allows this weapon to sever targets on hit for an improved duration, up to a maximum number of targets.", icon: /common/destiny2_content/icons/5366f0752a2679e279672f07e1117a47.png }
  - { hash: 3511092054, name: "Elemental Capacitor", kind: weaponPerk, type: "Trait", tier: basic, description: "Increased stats based on the currently equipped Super.\n\u2022 [Solar] increases your reload speed.\n\u2022 [Arc] increases handling.\n\u2022 [Void] increases stability.\n\u2022 [Stasis] moderately controls recoil and increases movement speed when aiming down sights.\n\u2022 [Strand] increases airborne effectiveness.", icon: /common/destiny2_content/icons/e455d94dcafdab7a0d5a850712908020.png }
  - { hash: 3523296417, name: "Demolitionist", kind: weaponPerk, type: "Trait", tier: basic, description: "Kills with this weapon generate grenade energy. Activating your grenade ability reloads this weapon from reserves.", icon: /common/destiny2_content/icons/da009697110e06b65d6f827b3b6d5f70.png }
  - { hash: 3555252274, name: "Recycled Energy", kind: weaponPerk, type: "Enhanced Trait", tier: common, description: "Reloading after defeating targets grants an increased amount of energy to your lowest charged ability.", icon: /common/destiny2_content/icons/c42c7a489769ae6f2d7f84be17c5732b.png }
  - { hash: 3585856464, name: "Unraveling Orbs", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Picking up an Orb of Power or a Tangle grants [Strand]Strand weapons Unraveling Rounds.", icon: /common/destiny2_content/icons/14a1ddccf719d767162b94f3ff81db23.png }
  - { hash: 3585856465, name: "Photonic Flare", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Defeating an exhausted or severed target with [Arc]Arc damage releases a blinding burst.\n\nExhausted targets deal reduced outgoing damage.", icon: /common/destiny2_content/icons/888d22f5f20d5e4c5b7e9d3bdb15384b.png }
  - { hash: 3585856470, name: "Dielectric", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Defeating [Arc]Arc debuffed targets grants Bolt Charge.\n\nRapidly defeating Arc debuffed targets spawns an Orb of Power and heals a small portion of health.", icon: /common/destiny2_content/icons/2ba8a6fb47d9a36d8e5651bad5a86752.png }
