  - { hash: 2742146818, name: "Tazer Tag", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Arc-powered melee hits jolt combatants and deal further damage for a short duration.", icon: /common/destiny2_content/icons/c30820ca53f6ec778ddf10c6a0d6956b.png }
