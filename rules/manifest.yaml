  - { hash: 113508675, name: "Reaper's Tithe", kind: weaponPerk, type: "Trait", tier: basic, description: "Multiple simultaneous final blows queue up a stacking damage buff. Timer starts on next weapon fire; final blows extend this timer.", icon: /common/destiny2_content/icons/47bf1334aab994af4ebe63cbc45b7d67.png }
