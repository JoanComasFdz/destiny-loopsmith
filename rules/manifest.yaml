  - { hash: 2483898431, name: "Whisper of Hunger", kind: fragment, type: "Stasis Fragment", description: "Increases the melee energy gained from picking up [Stasis] Stasis shards.\n-20 Melee \u25bc\nUNLOCKED BY QUEST: Purchase this Stasis Fragment from the Exo Stranger on Europa after completing the Beyond Light campaign.", icon: /common/destiny2_content/icons/549368f903ac85dc177a56555ce69ae7.png }
