  - { hash: 4194622036, name: "Flow State", kind: aspect, type: "Arc Aspect", description: "Defeating a jolted target makes you amplified.\n\nWhile you are amplified, your dodge recharges more quickly, you are more resilient while dodging, and your reload speed is greatly increased.", icon: /common/destiny2_content/icons/83c6b789cfbe88a92f1d247ebf4ff62f.jpg }
  - { hash: 4194622037, name: "Tempest Strike", kind: aspect, type: "Arc Aspect", description: "While sliding, activate your charged melee ability to unleash a devastating uppercut attack that travels along the ground in front of you, damaging and jolting targets it hits.\n\nDefeating jolted targets grants a stack of Bolt Charge.", icon: /common/destiny2_content/icons/e216e32eaf026208ef4638f2f274e2dc.jpg }
  - { hash: 4194622038, name: "Lethal Current", kind: aspect, type: "Arc Aspect", description: "After dodging, your next melee attack has increased lunge range, jolts the target, and creates a damaging aftershock.\n\nDamaging any jolted target with melee attacks also blinds them.", icon: /common/destiny2_content/icons/aec5d87a0d36729045b0ab0baffb8620.jpg }
  - { hash: 4194622039, name: "Ascension", kind: aspect, type: "Arc Aspect", description: "[Air Move] While airborne, consume your class ability energy to summon your Arc Staff, propelling yourself upward and creating a burst of energy around you that amplifies allies and jolts targets.\n\nThis ability's damage increases with your Class stat when your Class stat is 100 or higher.", icon: /common/destiny2_content/icons/3bfe666002e12ec6ea3d0c3661f81f31.jpg }
