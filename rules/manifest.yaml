  - { hash: 293178904, name: "Unflinching Harmonic Aim", kind: armorMod, type: "Chest Armor Mod", tier: basic, slot: chest, description: "Unflinching Arc Aim: Reduces flinching from incoming fire while aiming an Arc weapon.\nUnflinching Solar Aim: Reduces flinching from incoming fire while aiming a Solar weapon.\nUnflinching Stasis Aim: Reduces flinching from incoming fire while aiming a Stasis weapon.\nUnflinching Strand Aim: Reduces flinching from incoming fire while aiming a Strand weapon.\nUnflinching Void Aim: Reduces flinching from incoming fire while aiming a Void weapon.", icon: /common/destiny2_content/icons/05ce3bf5aad22cea26ff3a808351076a.png }
