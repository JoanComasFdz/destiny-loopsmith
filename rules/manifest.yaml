  - { hash: 2628485816, name: "Strafe Glide", kind: movement, type: "Movement Ability", description: "Jump while airborne to activate Glide and start an airborne drift with strong directional control.", icon: /common/destiny2_content/icons/800f5b922e2215630b83d4a7cdc8cc64.png }
  - { hash: 2628485817, name: "Burst Glide", kind: movement, type: "Movement Ability", description: "Jump while airborne to activate Glide and start an airborne drift with a strong initial boost of speed.", icon: /common/destiny2_content/icons/63af5e661089e6a1abbbe70186573a50.png }
  - { hash: 2628485818, name: "Balanced Glide", kind: movement, type: "Movement Ability", description: "Jump while airborne to activate Glide and start an airborne drift with both moderate speed and directional control.", icon: /common/destiny2_content/icons/e2fe3d4207f35f35ad532e8798897f62.png }
  - { hash: 2634786903, name: "Void Holster", kind: armorMod, type: "Leg Armor Mod", tier: basic, slot: legs, description: "Gradually reloads your stowed Void weapons over time.", icon: /common/destiny2_content/icons/b4ca19e353ee7a0e137ba7f5e6dacc03.png }
  - { hash: 2642597904, name: "Bleak Watcher", kind: aspect, type: "Stasis Aspect", description: "[Grenade] : Hold to convert your grenade into a [Stasis] Stasis turret that fires slowing projectiles at nearby targets.\nUNLOCKED BY QUEST: ASPECT OF INFLUENCE\nPurchase this Stasis Aspect from the Exo Stranger on Europa after completing the Beyond Light campaign.", icon: /common/destiny2_content/icons/51d335e369d83d303203448c75fce439.png }
  - { hash: 2649250174, name: "Marksman Optics: Low", kind: weaponMod, type: "Weapon Mod", tier: legendary, description: "Slightly reduces zoom magnification.", icon: /common/destiny2_content/icons/c6f465c5ac5d2a2205422481acb6ed4c.png }
  - { hash: 2649291407, name: "Fastball", kind: armorMod, type: "Arms Armor Mod", tier: basic, slot: arms, description: "Increases grenade throw distance.", icon: /common/destiny2_content/icons/9f06fa14aa6b9558b5dd58a7c980a65e.png }
  - { hash: 2651551055, name: "Glacial Harvest", kind: aspect, type: "Stasis Aspect", description: "Picking up [Stasis] Stasis shards grants stacks of Frost Armor.\n\nWhile you have Frost Armor, defeating combatants with Stasis or Kinetic weapons may cause them to shatter, damaging other nearby foes. The shatter chance increases with your Frost Armor stacks.\n\nTaking damage while you have Frost Armor generates grenade energy.\nUNLOCKED BY QUEST: ASPECT OF INTERFERENCE\nPurchase this Stasis Aspect from the Exo Stranger on Europa after completing the Beyond Light campaign.", icon: /common/destiny2_content/icons/5fc9529c49b1d81ebeb7ed67779e6170.png }
  - { hash: 2657604783, name: "Harmonic Loader", kind: armorMod, type: "Arms Armor Mod", tier: basic, slot: arms, description: "Arc Loader: Increases reload speed of Arc weapons.\nSolar Loader: Increases reload speed of Solar weapons.\nStasis Loader: Increases reload speed of Stasis weapons.\nStrand Loader: Increases reload speed of Strand weapons.\nVoid Loader: Increases reload speed of Void weapons.", icon: /common/destiny2_content/icons/825e3aef7827d66f56f244b0873ded59.png }
  - { hash: 2659604384, name: "Frigid Glare", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "While Frost Armor is active, [Stasis]Stasis precision final blows cause combatants to release a freezing burst.", icon: /common/destiny2_content/icons/a8e0ad8585c13eead66d224a18608556.png }
  - { hash: 2659604385, name: "Tangled Web", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Creating a Tangle by defeating a [Strand]Strand debuffed target suspends nearby combatants.", icon: /common/destiny2_content/icons/82befe9a89b07a901cd352d7a4663239.png }
  - { hash: 2659604386, name: "Argent Quiver", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Reloading a Bow consumes one stack of Armor Charge, granting increased damage and reload speed for your next 3 shots or until you stow your Bow.", icon: /common/destiny2_content/icons/be505c181030939d775fdd38fef428e5.png }
  - { hash: 2659604387, name: "Iron Lord's Vigor", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "While wielding a Sword, you take decreased damage; rapid final blows grant ammo to the wielder.", icon: /common/destiny2_content/icons/08493ea0baf9f657c82c5a7e32e0ff66.png }
  - { hash: 2659604388, name: "Radiant Shrapnel", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Dealing sustained weapon damage while Radiant or defeating a scorched combatant with a weapon causes the target to release Solar projectiles that deal damage and scorch on impact.", icon: /common/destiny2_content/icons/8abd6d007f5a6a53e85202fddbb0fbb7.png }
  - { hash: 2659604390, name: "Elemental Overdrive", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Picking up an Elemental pickup or Tangle grants increased damage to weapons of the same element.", icon: /common/destiny2_content/icons/08d63e99efb583e4d0d13058a7ed63f4.png }
  - { hash: 2659604391, name: "Shieldcrush", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "While you have Woven Mail, Frost Armor, or a Void overshield, your melee recharges faster and deals increased damage.\n\nWhile you are Amplified or Radiant, your grenade recharges faster and deals increased damage.", icon: /common/destiny2_content/icons/fdd095c3fee6fff410f09a57fe5c9f0e.png }
  - { hash: 2661180600, name: "Echo of Instability", kind: fragment, type: "Void Fragment", description: "Defeating targets with grenades grants Volatile Rounds to your Void weapons.\n+10 Melee \u25b2", icon: /common/destiny2_content/icons/0ad46f9c0c14535c4d5776daf48e871e.jpg }
  - { hash: 2661180601, name: "Echo of Harvest", kind: fragment, type: "Void Fragment", description: "Defeating weakened targets creates an Orb of Power and a Void Breach.", icon: /common/destiny2_content/icons/6bd23524f7129761043724acbe90c7b5.jpg }
  - { hash: 2661180602, name: "Echo of Obscurity", kind: fragment, type: "Void Fragment", description: "Finisher final blows grant Invisibility.\n+10 Class \u25b2", icon: /common/destiny2_content/icons/7d711ce4bcfb264da29c289ff70b9876.jpg }
  - { hash: 2661180603, name: "Echo of Starvation", kind: fragment, type: "Void Fragment", description: "Picking up a Void Breach or an Orb of Power grants Devour.\n-10 Class \u25bc", icon: /common/destiny2_content/icons/19219ecd56fef82e9ead65aed8fea63a.jpg }
  - { hash: 2682205016, name: "Overflow", kind: weaponPerk, type: "Enhanced Trait", tier: common, description: "Picking up Special or Heavy ammo loads this weapon even further beyond normal capacity.", icon: /common/destiny2_content/icons/3165fec56b59363fa974a11f5730f4ec.png }
  - { hash: 2708585276, name: "Ballistic Slam", kind: melee, type: "Arc Melee", description: "After sprinting and while airborne, activate your charged melee ability to slam to the ground, dealing damage to nearby targets.\n\nGain Super energy and stacks of Bolt Charge based on number of targets hit by Ballistic Slam.", icon: /common/destiny2_content/icons/c9e36caa03cdb0d8dfcacc57f0e01938.jpg }
  - { hash: 2708585277, name: "Seismic Strike", kind: melee, type: "Arc Melee", description: "After sprinting for a short time, activate your charged melee ability to slam shoulder-first into your target, damaging and blinding targets in an area around them.\n\nWhile you are amplified, the blind radius is increased.", icon: /common/destiny2_content/icons/ef72ed2a57e2cf3405e72b93f2218e50.jpg }
  - { hash: 2708585279, name: "Thunderclap", kind: melee, type: "Arc Melee", description: "[Melee] : Hold while grounded to plant your feet and begin charging your fist with Arc energy.\n\n[Melee] : Release to unleash a devastating blast in front of you, dealing damage that increases with longer charge time.", icon: /common/destiny2_content/icons/45e77f67fbb1e12c36972cd923f7b9e0.jpg }
  - { hash: 2711519340, name: "Gambler's Dodge", kind: classAbility, type: "Class Ability", tier: basic, description: "Dodge to perform a deft tumble, avoiding combatant attacks and generating melee ability energy. Energy gain is scaled by your Melee stat. Dodging near enemies increases the energy gain.", icon: /common/destiny2_content/icons/f4190b3803b5ab33c08838dc8e22bf60.png }
  - { hash: 2711519341, name: "Marksman's Dodge", kind: classAbility, type: "Class Ability", tier: basic, description: "Dodge to perform an evasive maneuver with a steady hand. Dodging automatically collects nearby ammo boxes and reloads all weapons.", icon: /common/destiny2_content/icons/a340122b47c35efc613d89438e9ec7e4.png }
  - { hash: 2716335210, name: "Disorienting Blow", kind: melee, type: "Arc Melee", description: "Striking a target with this melee ability blinds them, amplifies you, and grants you a moderate amount of Bolt Charge.", icon: /common/destiny2_content/icons/0ac85c928868a34d47dba95dcff2da2a.jpg }
  - { hash: 2716335211, name: "Combination Blow", kind: melee, type: "Arc Melee", description: "A quick strike that temporarily increases your melee damage when defeating a target, stacking three times.\n\nDefeating targets with this, grants class ability energy and restores a small amount of health. Energy gain is scaled by your Class stat.", icon: /common/destiny2_content/icons/a7ff3045c06a03649199c6b8e185d7a3.jpg }
  - { hash: 2719698929, name: "Solar Targeting", kind: armorMod, type: "Helmet Armor Mod", tier: basic, slot: helmet, description: "Improved target acquisition, accuracy, and aim-down-sights speed for Solar weapons.", icon: /common/destiny2_content/icons/6662d14e32e684c67b090d449e1d109e.png }
  - { hash: 2722573681, name: "Shadowshot: Moebius Quiver", kind: super, type: "Super Ability", description: "Tether foes to a Void Anchor, dramatically weakening and suppressing them for you and your allies.\n\nFire two volleys of three Void Arrows that seek nearby targets. Shadowshot makes targets volatile and deals increased damage to tethered targets. Defeating tethered targets creates Orbs of Power.\n\nWhile the Super is active, dealing damage increases the damage of your Void Arrows and Bow weapons.", icon: /common/destiny2_content/icons/986e8f2dd0699371d605a331bb63742a.png }
  - { hash: 2722573682, name: "Spectral Blades", kind: super, type: "Super Ability", description: "Summon a pair of deadly Void blades and stalk the battlefield in a veil of shadows.\n\n[Light Attack] : Perform a quick melee attack.\n\n[Heavy Attack] : Perform a heavy attack that weakens your target, and once again vanish from sight.", icon: /common/destiny2_content/icons/1fbfacd5dfe847c5cd0262c5616653ff.png }
  - { hash: 2722573683, name: "Shadowshot: Deadfall", kind: super, type: "Super Ability", description: "Tether foes to a Void Anchor, dramatically weakening and suppressing them for you and your allies.\n\nThe Void Anchors fired from Shadowshot pull targets toward the impact point, which then become traps and wait for prey. Void Anchors have increased range and last longer.", icon: /common/destiny2_content/icons/61feac4f1271ba6cecc29cc50e20ab5a.png }
  - { hash: 2722641740, name: "Towering Barricade", kind: classAbility, type: "Class Ability", tier: basic, description: "Creates a large barrier that can be used to reinforce a position with cover, and draws hostile fire when you stand behind it.", icon: /common/destiny2_content/icons/8042b480c9dea2fc3301e15e7695feaf.jpg }
  - { hash: 2722641741, name: "Rally Barricade", kind: classAbility, type: "Class Ability", tier: basic, description: "Creates a small barrier that you can peek over while aiming down sights; increases weapon reload speed, stability, and range. Draws hostile fire when you stand behind it.", icon: /common/destiny2_content/icons/dbf616cee47329f90049fa84655790b8.jpg }
  - { hash: 2724068510, name: "Arc Siphon", kind: armorMod, type: "Helmet Armor Mod", tier: basic, slot: helmet, description: "Rapid Arc weapon final blows create an Orb of Power.", icon: /common/destiny2_content/icons/627b1fc72103e7c6081133d6b6eb1cc2.png }
  - { hash: 2733010662, name: "Kinetic Charge Siphon", kind: armorMod, type: "Helmet Armor Mod", tier: basic, slot: helmet, description: "Kinetic Siphon: Rapid Kinetic weapon final blows create an Orb of Power.\nArc Siphon: Rapid Arc weapon final blows create an Orb of Power.", icon: /common/destiny2_content/icons/fe43ec82456a170c93a9556bb6cd75e0.png }
