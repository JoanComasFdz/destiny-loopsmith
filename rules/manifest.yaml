  - { hash: 2596646300, name: "No Bell", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Rapid Glaive melee final blows grant Special ammo Glaives additional ammo. Blocking damage with Glaives increases their melee damage to targets.", icon: /common/destiny2_content/icons/a25bf672c20acc4f3702806d79ad5be8.png }
