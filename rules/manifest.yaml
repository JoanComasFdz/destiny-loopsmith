  - { hash: 4184589900, name: "Touch of Winter", kind: aspect, type: "Stasis Aspect", description: "Your Glacier, Duskfield, Coldsnap, and Shatter grenades have enhanced functionality.\n\nGlacier Grenade: Adds a [Stasis] Stasis crystal and changes the formation.\n\nDuskfield Grenade: Increases slow-field size and creates a small [Stasis] Stasis crystal on impact.\n\nColdsnap Grenade: Seekers duplicate after freezing a target and create a [Stasis] Stasis crystal on detonation.\n\nShatter Grenade: Creates additional shrapnel projectiles on detonation. Hitting frozen targets with this grenade refunds some grenade energy.\nUNLOCKED BY QUEST: ASPECT OF INTERFERENCE\nPurchase this Stasis Aspect from the Exo Stranger on Europa after completing the Beyond Light campaign.", icon: /common/destiny2_content/icons/b8e7bcaa96ec08540ff225a6d113a0d8.png }
