  - { hash: 2311625537, name: "Shock and Awe", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Arc final blows while you are amplified summon a burst of lightning that damages and jolts targets.", icon: /common/destiny2_content/icons/d0619bebb5fe2dbaede5282a51c6d3fb.png }
  - { hash: 2311625538, name: "Conductive Cosmic Needle", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Targets affected by Strand debuffs take increased damage from Arc and Void abilities.", icon: /common/destiny2_content/icons/802a490f2b11e346091926e4b0a1ebb7.png }
  - { hash: 2311625540, name: "Void Weapon Channeling", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "You gain a temporary bonus to Void weapon damage after you defeat a target with a Void weapon while at least one of your Void abilities is fully charged. This damage bonus increases based on the number of fully charged Void abilities you have.", icon: /common/destiny2_content/icons/22ca2ec59b144ae96610b2b6f25e8190.png }
  - { hash: 2311625541, name: "Passive Aggressive Guard", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Receive less damage from combatants that are close to you while you are wielding a Glaive.", icon: /common/destiny2_content/icons/c2b8daf574576911a89ae85dccaf67d3.png }
  - { hash: 2311625542, name: "Lightning Strikes Twice", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "After throwing an Arc grenade, gain increased grenade recharge for a short time. Arc final blows extend the duration of this benefit.", icon: /common/destiny2_content/icons/11401dfda102df2b4da5c9ff09950144.png }
  - { hash: 2311625543, name: "Squad Goals", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Performing a finisher while you are amplified grants Amplified to nearby allies. \n\nPerforming a finisher while you have Woven Mail grants Woven Mail to nearby allies. \n\nPerforming a finisher while you have Devour grants Devour to nearby allies.", icon: /common/destiny2_content/icons/46656d890be5ef3870606c84360429b0.png }
  - { hash: 2317325398, name: "Kindling Trigger", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Radiant causes Solar weapons to apply scorch to unscorched combatants.", icon: /common/destiny2_content/icons/abaf5494df7860b116e12f02ee0accc9.png }
  - { hash: 2317325399, name: "Blast Radius", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Rapid final blows with Rocket Launchers and Grenade Launchers\u00a0grant Armor Charge.", icon: /common/destiny2_content/icons/08966e730bae193ec6f30ed90b54662e.png }
  - { hash: 2318667184, name: "Kinetic Weapon Surge", kind: armorMod, type: "Leg Armor Mod", tier: basic, slot: legs, description: "Your Kinetic weapons gain a small bonus to damage while you have any Armor Charge. Your Armor Charge now decays over time.", icon: /common/destiny2_content/icons/c2fe612aa5de8e32052e4d679f13fb8b.png }
  - { hash: 2319885414, name: "Solar Weapon Surge", kind: armorMod, type: "Leg Armor Mod", tier: basic, slot: legs, description: "Collecting an Orb of Power causes you to gain 1 temporary Armor Charge.", icon: /common/destiny2_content/icons/5a986074a3872e3b3d73ea61d4e7b09b.png }
  - { hash: 2321824284, name: "Feed the Void", kind: aspect, type: "Void Aspect", description: "Defeat a target with a Void ability to activate Devour.\n\nYour Devour effects are improved, restoring additional health and grenade energy.", icon: /common/destiny2_content/icons/178bb0e78e55c5b960aa6f42660b9b66.jpg }
  - { hash: 2321824285, name: "Chaos Accelerant", kind: aspect, type: "Void Aspect", description: "[Grenade] : Overcharge your grenade, making it deadlier and more effective.\n\nVortex Grenade: Increases the size, linger duration, and pull of the vortex.\n\nAxion Bolt: Detonates twice and has enhanced seekers.\n\nScatter Grenade: Submunitions track to nearby targets.\n\nMagnetic Grenade, Spike Grenade, Voidwall Grenade, and Suppressor Grenade: Releases a short-range Void blast. Cooldown is reduced.\n\nGrants an additional grenade charge.", icon: /common/destiny2_content/icons/5a8a03d4876d34a89db6aedf6189ab86.jpg }
  - { hash: 2321824286, name: "Soul Siphon", kind: aspect, type: "Void Aspect", description: "Ready this aspect by striking a foe with your powered melee ability.\n\nOnce readied, press your melee ability to begin siphoning energy from all combatants in front of you, dealing damage and gathering Overshield and class ability energy from each target.\n\nSoul Siphon's damage is scaled by the enhanced benefit of the Melee stat.", icon: /common/destiny2_content/icons/36932a691aaeab872af392d4a1d8eba8.jpg }
  - { hash: 2321824287, name: "Child of the Old Gods", kind: aspect, type: "Void Aspect", description: "Cast your rift to create a Void Soul. When you damage a target with a weapon, your Void Soul flies to them and drains them, doing damage and weakening them. Combatants affected by the Soul are also briefly suppressed.\n\nWhen a target is being drained, you are granted grenade and melee energy (if running Healing Rift) or health (if running Empowering Rift).\n\nDefeating a target who is being drained by your Void Soul grants class ability energy.\n\nThe Void Soul's damage is scaled by the enhanced benefit of the Grenade stat.", icon: /common/destiny2_content/icons/ced6965ddcda23fdc728639aaf0ebd4d.jpg }
  - { hash: 2325151798, name: "Unflinching Kinetic Aim", kind: armorMod, type: "Chest Armor Mod", tier: basic, slot: chest, description: "Reduces flinching from incoming fire while aiming a Kinetic weapon.", icon: /common/destiny2_content/icons/f62c0984b937a74e5d15afc05bc0c253.png }
  - { hash: 2328211300, name: "Arcstrider", kind: subclass, type: "Hunter Subclass", tier: basic, plugs: [426473316, 426473317, 95544330, 95544331, 95544328, 95544329, 3769507633, 3769507632, 3769507635, 2716335211, 2716335210, 2994412667, 2481624867, 2909720723, 1713935764, 146194908, 4198689901, 1582574009, 4194622036, 4194622037, 4194622038, 4194622039, 3478354817, 3478354816, 1727069367, 1727069366, 1727069365, 1727069364, 1727069363, 1727069362, 1727069361, 1727069360, 1727069375, 1727069374, 3277705906, 3277705907, 3277705904, 3277705905], description: "Arc Staff: Form a staff of pure Arc energy and acrobatically take out your foes.\n\n[Block] : Hold to deflect incoming projectiles with your Arc staff.\n\nDeflecting a projectile grants you a stack of Bolt Charge.\n\nHeavy attack combos and airborne heavy slams blind targets.\nGathering Storm: Hurl your Arc Staff forward, embedding it into surfaces or large targets and jolting nearby targets.\n\nAfter a short time, a devastating lightning bolt strikes the staff, overcharging it with Arc energy. While overcharged, your staff discharges lightning at nearby foes.\nStorm's Edge: Summon an electrified dagger and throw it in your aim direction.\n\nWhen the dagger hits a surface or a target, you blink to its location and perform a powerful whirling strike, damaging any nearby targets. Can be reactivated after the strike to perform additional throws.\n\nIf the dagger flies for long enough without impacting anything, it detonates and you blink to the detonation location.", icon: /common/destiny2_content/icons/949af7a61d60a8e6071282daafa9e6e9.png }
  - { hash: 2344320968, name: "Void Hegemony", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "While you have a Void or Prismatic subclass equipped, defeating weakened targets provides a small Void Overshield.", icon: /common/destiny2_content/icons/17d84346ffe49f92a4db97b2fa59ba21.png }
  - { hash: 2344320969, name: "Blade Stamina", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Rapidly defeating combatants with a Sword refunds some ammo.", icon: /common/destiny2_content/icons/943e21f0e02535c4ea107639fa45882e.png }
  - { hash: 2344320970, name: "Counter Energy", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "When you or a member of your fireteam stuns a champion, you gain energy for your least-charged ability.", icon: /common/destiny2_content/icons/f9cff3113b9be57572ed6697be195a1a.png }
  - { hash: 2344320972, name: "Targeting Autoloader", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "While you have an Auto Rifle equipped, defeating combatants reloads your equipped weapon and temporarily increases weapon damage. \n\nAwards bonus progress when dealing final blows while surrounded.", icon: /common/destiny2_content/icons/af01d655f6082ad2c9eb3ee81b77effa.png }
