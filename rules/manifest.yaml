  - { hash: 4087056174, name: "Recuperation", kind: armorMod, type: "Leg Armor Mod", tier: basic, slot: legs, description: "Replenishes health each time you pick up an Orb of Power.", icon: /common/destiny2_content/icons/db7f4f4f8c9ec48b5303cf5a2f8dc662.png }
