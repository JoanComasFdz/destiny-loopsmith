  - { hash: 243981275, name: "Attrition Orbs", kind: weaponPerk, type: "Trait", tier: basic, description: "Dealing sustained damage creates an Orb of Power.", icon: /common/destiny2_content/icons/c2092fae6ae58ca77a7f9b4434e688ef.png }
