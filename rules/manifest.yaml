  - { hash: 1399216, name: "Duskfield Grenade", kind: grenade, type: "Stasis Grenade", description: "A grenade that shatters on impact, leaving behind a field that slows targets and freezes those who do not leave the volume.", icon: /common/destiny2_content/icons/5ed90305d6131582eb76abd99c487826.png }
  - { hash: 1399217, name: "Glacier Grenade", kind: grenade, type: "Stasis Grenade", description: "A grenade that creates walls out of [Stasis] Stasis crystals to block damage and freeze targets; these walls can be shattered for damage.", icon: /common/destiny2_content/icons/08b4d8632636f78c57425b844d7b42e4.png }
  - { hash: 1399218, name: "Shatter Grenade", kind: grenade, type: "Stasis Grenade", description: "A grenade that sticks to combatants before exploding into razor-sharp [Stasis] Stasis shrapnel. The shrapnel ricochets off surfaces, dealing damage to all in its path. Hitting a frozen target shatters it instantly and deals bonus damage.", icon: /common/destiny2_content/icons/4017951cb20f7e81158b062f74af1cd2.png }
  - { hash: 1399219, name: "Coldsnap Grenade", kind: grenade, type: "Stasis Grenade", description: "A grenade that freezes on impact and sends another seeker to find and freeze targets.", icon: /common/destiny2_content/icons/ff53139f18628530891598936e7a8c13.png }
  - { hash: 11126525, name: "Powerful Attraction", kind: armorMod, type: "Class Item Armor Mod", tier: legendary, slot: classItem, description: "Automatically collects nearby Orbs of Power when you activate your class ability.", icon: /common/destiny2_content/icons/f66a443a73883ec0c196ac7be4551cfc.png }
  - { hash: 11612903, name: "Adrenaline Junkie", kind: weaponPerk, type: "Trait", tier: basic, description: "This weapon gains increased damage and handling from final blows with grenades or this weapon.", icon: /common/destiny2_content/icons/6f8bde03140b53e6dc583ada1aeaa51d.png }
