  - { hash: 83039192, name: "Hellion", kind: aspect, type: "Solar Aspect", description: "Activate your class ability to summon a [Solar] Solar mortar that lobs flaming projectiles at distant targets. Targets damaged by the mortar are scorched.\n\nHellion damage is scaled by the enhanced benefit of the Grenade stat.", icon: /common/destiny2_content/icons/3514bec04e2464b2f48e1bd025afc668.jpg }
  - { hash: 83039193, name: "Touch of Flame", kind: aspect, type: "Solar Aspect", description: "Your Healing, Solar, Firebolt, and Fusion Grenades have enhanced functionality.\n\nHealing Grenade: Improves the strength of cure and restoration effects applied. Consuming a Healing Grenade with Heat Rises also applies restoration to nearby allies.\n\nSolar Grenade: Increases linger duration. Periodically emits blobs of lava around its perimeter.\n\nFirebolt Grenade: Increases target search radius and maximum target count.\n\nFusion Grenade: Explodes twice.", icon: /common/destiny2_content/icons/d6b44fe69ff876449e732b52b7d9d334.jpg }
  - { hash: 83039194, name: "Heat Rises", kind: aspect, type: "Solar Aspect", description: "You can fire weapons, melee, and throw grenades while gliding.\n\n[Grenade] : Hold to consume your grenade, gaining Heat Rises and releasing a burst of healing energy that cures nearby allies. The strength of the burst is increased when a Healing Grenade is consumed.\n\nFinal blows while airborne increase the duration of Heat Rises and grant melee energy.", icon: /common/destiny2_content/icons/d647fd2019707f044ce97b52f802e465.jpg }
  - { hash: 83039195, name: "Icarus Dash", kind: aspect, type: "Solar Aspect", description: "[Air Dodge] : Dodge quickly while airborne.\n\nWhile Heat Rises is active, you have an additional dodge.\n\nWhile airborne, rapidly defeating targets with your Super or weapons cures you.", icon: /common/destiny2_content/icons/55a690bbd9cd53777df674a279422865.jpg }
  - { hash: 84503918, name: "Empowered Finish", kind: armorMod, type: "Class Item Armor Mod", tier: basic, slot: classItem, description: "Finisher final blows grant you 1 temporary Armor Charge when you have none.", icon: /common/destiny2_content/icons/cf4f0d4ecd15280a1b73518d1d4e534b.png }
  - { hash: 95544328, name: "Triple Jump", kind: movement, type: "Movement Ability", description: "While airborne, sustain your air control with a second or third jump.", icon: /common/destiny2_content/icons/fb5c90f3df4b9e1d4dede6d807f34ed6.jpg }
