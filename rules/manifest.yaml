  - { hash: 146194908, name: "Skip Grenade", kind: grenade, type: "Arc Grenade", description: "A grenade that splits upon impact, creating multiple projectiles that seek targets.", icon: /common/destiny2_content/icons/4beec209d1009f30116a9a10721864aa.jpg }
  - { hash: 177189259, name: "Reaper's Tithe", kind: weaponPerk, type: "Enhanced Trait", tier: common, description: "Multiple simultaneous final blows queue up a stacking damage buff. Improved timer starts on next weapon fire; final blows extend this timer.", icon: /common/destiny2_content/icons/47bf1334aab994af4ebe63cbc45b7d67.png }
  - { hash: 187655372, name: "Trapper's Ambush", kind: aspect, type: "Void Aspect", description: "Activate your air move to consume your class ability energy and dive to the ground, damaging targets on impact. Damage is greatly increased if striking while you have any Void status effect.\n\nDamaging opponents with this ability heals you. Defeating combatants with this ability grants Devour.\n\nThis ability's damage increases with your Class stat when your Class stat is 100 or higher.", icon: /common/destiny2_content/icons/e91760df2b81d191da9e2c62cb3fcda7.jpg }
  - { hash: 187655373, name: "Vanishing Step", kind: aspect, type: "Void Aspect", description: "Dodging makes you invisible.", icon: /common/destiny2_content/icons/f23323d11f0ad79781f91c70f4c644ac.jpg }
  - { hash: 187655374, name: "Stylish Executioner", kind: aspect, type: "Void Aspect", description: "Defeating a weakened, suppressed, or volatile target grants Invisibility and Truesight.\n\nAfter performing a Stylish Execution, your next melee attack while invisible weakens targets.", icon: /common/destiny2_content/icons/ed7f8c49b77fa46f4eec87a3c167c4b1.jpg }
  - { hash: 187655375, name: "On the Prowl", kind: aspect, type: "Void Aspect", description: "Periodically marks a nearby combatant as a priority target for you and your team. Entering invisibility immediately marks a target.\n\nDefeating priority targets creates a weakening cloud of smoke that makes you and allies invisible when passing through it. \n\nWhen priority targets are defeated, you and nearby allies gain increased weapon reload speed and stability for a short duration and are granted grenade, melee, and class ability energy.", icon: /common/destiny2_content/icons/9afb3b5fb819f4427122736712c5dab6.jpg }
  - { hash: 193878019, name: "Stasis Dexterity", kind: armorMod, type: "Arms Armor Mod", tier: basic, slot: arms, description: "Faster ready and stow speed for Stasis weapons.", icon: /common/destiny2_content/icons/7f9b32cd9d186059d88bb4d75532116c.png }
