  - { hash: 2240888816, name: "Gunslinger", kind: subclass, type: "Hunter Subclass", tier: basic, description: "Golden Gun: Deadshot: Summon a rapid-fire flaming pistol that scorches and disintegrates targets with Solar Light.\n\nFinal blows with this weapon refund a Golden Gun round and extend your super duration.\n\nBenefits from being radiant.\nGolden Gun: Marksman: Summon a precision flaming pistol that scorches and disintegrates targets with Solar Light.\n\nYour Golden Gun deals massively increased precision damage, overpenetrates targets, and creates Orbs of Power on precision hits.\n\nBenefits from being radiant.\nBlade Barrage: Vault into the air and unleash a volley of Solar-charged knives that explode and scorch targets.", icon: /common/destiny2_content/icons/fedcb91b7ab0584c12f0e9fec730702b.png }
  - { hash: 2328211300, name: "Arcstrider", kind: subclass, type: "Hunter Subclass", tier: basic, description: "Arc Staff: Form a staff of pure Arc energy and acrobatically take out your foes.\n\n[Block] : Hold to deflect incoming projectiles with your Arc staff.\n\nDeflecting a projectile grants you a stack of Bolt Charge.\n\nHeavy attack combos and airborne heavy slams blind targets.\nGathering Storm: Hurl your Arc Staff forward, embedding it into surfaces or large targets and jolting nearby targets.\n\nAfter a short time, a devastating lightning bolt strikes the staff, overcharging it with Arc energy. While overcharged, your staff discharges lightning at nearby foes.\nStorm's Edge: Summon an electrified dagger and throw it in your aim direction.\n\nWhen the dagger hits a surface or a target, you blink to its location and perform a powerful whirling strike, damaging any nearby targets. Can be reactivated after the strike to perform additional throws.\n\nIf the dagger flies for long enough without impacting anything, it detonates and you blink to the detonation location.", icon: /common/destiny2_content/icons/949af7a61d60a8e6071282daafa9e6e9.png }
  - { hash: 2453351420, name: "Nightstalker", kind: subclass, type: "Hunter Subclass", tier: basic, description: "Shadowshot: Deadfall: Tether foes to a Void Anchor, dramatically weakening and suppressing them for you and your allies.\n\nThe Void Anchors fired from Shadowshot pull targets toward the impact point, which then become traps and wait for prey. Void Anchors have increased range and last longer.\nSpectral Blades: Summon a pair of deadly Void blades and stalk the battlefield in a veil of shadows.\n\n[Light Attack] : Perform a quick melee attack.\n\n[Heavy Attack] : Perform a heavy attack that weakens your target, and once again vanish from sight.\nShadowshot: Moebius Quiver: Tether foes to a Void Anchor, dramatically weakening and suppressing them for you and your allies.\n\nFire two volleys of three Void Arrows that seek nearby targets. Shadowshot makes targets volatile and deals increased damage to tethered targets. Defeating tethered targets creates Orbs of Power.\n\nWhile the Super is active, dealing damage increases the damage of your Void Arrows and Bow weapons.", icon: /common/destiny2_content/icons/32b112a9460e6f0e2b9ee15dc53fe1c1.png }
  - { hash: 2550323932, name: "Sunbreaker", kind: subclass, type: "Titan Subclass", tier: basic, description: "Hammer of Sol: Summon a flaming hammer and wreak destruction down upon your enemies.\n\n[Light Attack] : Throw your hammer at foes.\n\nUpon impact, your hammers shatter into explosive molten shards.\nBurning Maul: Summon a flaming maul and crush targets with the force of an earthquake.\n\n[Light Attack] : Spin the maul in a circle around you, damaging nearby targets.\n\n[Heavy Attack] : Slam the maul to the ground and create a cyclone of flames that seeks targets, dealing damage and scorching them.", icon: /common/destiny2_content/icons/fedcb91b7ab0584c12f0e9fec730702b.png }
  - { hash: 2577472338, name: "Charged Up", kind: armorMod, type: "Chest Armor Mod", tier: basic, slot: chest, description: "Increases the maximum number of stacks of Armor Charge you can carry by 1.", icon: /common/destiny2_content/icons/0a2dc686c46b4d7d09c53274fadd49f9.png }
