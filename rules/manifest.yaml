  - { hash: 1885339915, name: "Needlestorm", kind: super, type: "Super Ability", description: "[Super] : Conjure a hail of deadly woven needles.\n\nAfter embedding themselves in the environment, the needles will re-weave into a host of Threadlings.\n\nThreadlings you create will return to you and perch if they can't find any nearby targets. Damaging targets with your weapons or melee will send out perched Threadlings to attack.", icon: /common/destiny2_content/icons/2e486aef07bd3551c35807f416ba0b6c.png }
