  - { hash: 4194622039, name: "Ascension", kind: aspect, type: "Arc Aspect", description: "[Air Move] While airborne, consume your class ability energy to summon your Arc Staff, propelling yourself upward and creating a burst of energy around you that amplifies allies and jolts targets.\n\nThis ability's damage increases with your Class stat when your Class stat is 100 or higher.", icon: /common/destiny2_content/icons/3bfe666002e12ec6ea3d0c3661f81f31.jpg }
  - { hash: 4198689901, name: "Flux Grenade", kind: grenade, type: "Arc Grenade", description: "An explosive grenade that attaches to targets.", icon: /common/destiny2_content/icons/1d7e8eb7c2c5884cb658a1877a084548.jpg }
  - { hash: 4204413574, name: "Broodweaver", kind: subclass, type: "Warlock Subclass", tier: basic, plugs: [383852320, 383852321, 2628485816, 2628485817, 2628485818, 1885339915, 2307689415, 1377143502, 2809342386, 4228170798, 2470512752, 262821317, 262821318, 262821319, 262821312, 4208512218, 4208512219, 4208512216, 4208512217, 4208512222, 4208512223, 4208512220, 4208512221, 4208512210, 4208512211, 3192552689, 3192552688, 3192552691, 3192552690], description: "Needlestorm: [Super] : Conjure a hail of deadly woven needles.\n\nAfter embedding themselves in the environment, the needles will re-weave into a host of Threadlings.\n\nThreadlings you create will return to you and perch if they can't find any nearby targets. Damaging targets with your weapons or melee will send out perched Threadlings to attack.", icon: /common/destiny2_content/icons/41c0024ce809085ac16f4e0777ea0ac4.png }
  - { hash: 4208512210, name: "Thread of Propagation", kind: fragment, type: "Strand Fragment", description: "Powered melee final blows grant your [Strand] Strand weapons Unraveling Rounds.\n+10 Melee \u25b2", icon: /common/destiny2_content/icons/d42d64ff749d858b6c72c5dc4b775797.jpg }
  - { hash: 4208512211, name: "Thread of Evolution", kind: fragment, type: "Strand Fragment", description: "Threadlings travel farther and deal additional damage.\n+10 Super \u25b2", icon: /common/destiny2_content/icons/c86847f148a9e86459dac50ba36da591.jpg }
  - { hash: 4208512216, name: "Thread of Ascent", kind: fragment, type: "Strand Fragment", description: "Activating your grenade ability reloads your equipped weapon and grants bonus airborne effectiveness and handling for a short duration.\n+10 Weapon \u25b2", icon: /common/destiny2_content/icons/25e7ef19cf989641771175e05bcfb3c2.jpg }
  - { hash: 4208512217, name: "Thread of Finality", kind: fragment, type: "Strand Fragment", description: "Finisher final blows create Threadlings.\n+10 Class \u25b2", icon: /common/destiny2_content/icons/1e61bee1b4607fea83a6d3d01dfb8bce.jpg }
  - { hash: 4208512218, name: "Thread of Mind", kind: fragment, type: "Strand Fragment", description: "Defeating suspended targets grants class ability energy.", icon: /common/destiny2_content/icons/a7a1b83217ee3fe2ee11c477705389b2.jpg }
  - { hash: 4208512219, name: "Thread of Fury", kind: fragment, type: "Strand Fragment", description: "Damaging targets with a Tangle grants melee energy.\n-10 Melee \u25bc", icon: /common/destiny2_content/icons/0e8b8974d2f17e25c085703bef8a3b53.jpg }
  - { hash: 4208512220, name: "Thread of Rebirth", kind: fragment, type: "Strand Fragment", description: "[Strand] Strand weapon final blows have a chance to create a Threadling.", icon: /common/destiny2_content/icons/6f8f98e361fb4265c885ae3447b498ef.jpg }
  - { hash: 4208512221, name: "Thread of Transmutation", kind: fragment, type: "Strand Fragment", description: "While you have Woven Mail, weapon final blows create a Tangle.\n+10 Melee \u25b2", icon: /common/destiny2_content/icons/d80a220ddab3e3be2641517ad3049915.jpg }
  - { hash: 4208512222, name: "Thread of Warding", kind: fragment, type: "Strand Fragment", description: "Picking up an Orb of Power grants Woven Mail.\n-10 Health \u25bc", icon: /common/destiny2_content/icons/9937046794352b7c7ce31340ac7832ba.jpg }
  - { hash: 4208512223, name: "Thread of Wisdom", kind: fragment, type: "Strand Fragment", description: "Defeating suspended targets creates an Orb of Power.", icon: /common/destiny2_content/icons/e78cbb486a636c94a46a6e6183978249.jpg }
  - { hash: 4220332374, name: "Shield Throw", kind: melee, type: "Void Melee", description: "Hurl your Void Shield toward a target. The shield can ricochet off targets and surfaces, granting Overshield for each target hit.", icon: /common/destiny2_content/icons/18ba97e43f603ca3cbc1507255992d39.jpg }
  - { hash: 4220332375, name: "Shield Bash", kind: melee, type: "Void Melee", description: "After sprinting for a short time, use this melee ability to unleash a devastating Shield Bash that suppresses the target. Final blows with Shield Bash grant an Overshield.", icon: /common/destiny2_content/icons/7a7f502312a1217de5b76e416fb85677.jpg }
  - { hash: 4225294165, name: "Veteran's Wisdom", kind: other, type: "Enhanced Origin Trait", tier: common, description: "Rapid or precision final blows release a larger Kinetic shockwave that exhausts targets.", icon: /common/destiny2_content/icons/ee4545a58b731bd60bce0e3edfd88829.png }
  - { hash: 4228170798, name: "Threadling Grenade", kind: grenade, type: "Strand Grenade", description: "A woven projectile that reweaves itself into Threadlings while in flight.", icon: /common/destiny2_content/icons/18a14aeac121b2a5c8699556b63e38fd.jpg }
  - { hash: 4232817857, name: "Strand Soldier", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Your Strand weapons gain Unraveling Rounds whenever you gain Woven Mail while your Strand or Prismatic subclass is equipped.", icon: /common/destiny2_content/icons/6c0a55f052695864d195376f21a0fc0c.png }
  - { hash: 4232817858, name: "Suppressing Glaive", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Damaging combatants with your Glaive suppresses them, preventing them from using abilities for a short time.", icon: /common/destiny2_content/icons/5f2ab7afbfd950990b263ab0020b5c14.png }
  - { hash: 4232817859, name: "Protective Breach", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Picking up a Void Breach gives you an overshield or refreshes your existing overshield.", icon: /common/destiny2_content/icons/0fd65c61c83cbaafaebeb0a03a0f9456.png }
  - { hash: 4232817860, name: "Counter Charge", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Gain a stack of Armor Charge when you stun a Champion.", icon: /common/destiny2_content/icons/e0c34da78b75368ee1c50926f895ab1a.png }
  - { hash: 4232817861, name: "Bricks from Beyond", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Defeating a powerful combatant with a Void weapon has a chance to generate Heavy ammo progress for you and your teammates.", icon: /common/destiny2_content/icons/d5eb9b63bbb4672a9adfec452c1c3d5d.png }
  - { hash: 4232817862, name: "Overload Grenades", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Void grenades disrupt combatants, stunning them, delaying ability energy regeneration and lowering combatant damage output. Strong against [Disruption] Overload Champions.", icon: /common/destiny2_content/icons/f9d64a247c90884cce173b29d28cff19.png }
  - { hash: 4232817863, name: "Targeting Autoloader", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "While you have an Auto Rifle equipped, defeating combatants reloads your equipped weapon and temporarily increases weapon damage. \n\nAwards bonus progress when dealing final blows while surrounded.", icon: /common/destiny2_content/icons/af01d655f6082ad2c9eb3ee81b77effa.png }
  - { hash: 4244246940, name: "Strand Loader", kind: armorMod, type: "Arms Armor Mod", tier: basic, slot: arms, description: "Increases reload speed of Strand weapons.", icon: /common/destiny2_content/icons/6bbcaf01caed921cbd98b83dee72e106.png }
  - { hash: 4249729124, name: "Whirling Maelstrom", kind: aspect, type: "Strand Aspect", description: "Destroying a Tangle will weave a violent, writhing mass of [Strand] Strand fibers. The Strand mass seeks out and damages targets, emitting Unraveling projectiles when it defeats them.", icon: /common/destiny2_content/icons/ab8095cdd657b0cd66452ddb44ef01e1.jpg }
  - { hash: 4249729125, name: "Threaded Specter", kind: aspect, type: "Strand Aspect", description: "Activating your class ability leaves behind a decoy woven from [Strand] Strand matter that draws the attention of nearby combatants.\n\nAfter taking significant damage or when combatants approach, the decoy detonates, dealing damage and releasing Threadlings that seek out and attack nearby foes.\n\nThis ability's damage increases with your Class stat when your Class stat is 100 or higher.", icon: /common/destiny2_content/icons/f0311771bc0f771779301102d62c0ae0.jpg }
  - { hash: 4249729126, name: "Ensnaring Slam", kind: aspect, type: "Strand Aspect", description: "Activate your air move to consume your class ability energy and dive to the ground, suspending all nearby targets on impact.\n\nSuspending combatants with this ability grants you Woven Mail.\n\nThis ability's damage increases with your Class stat when your Class stat is 100 or higher.", icon: /common/destiny2_content/icons/5e777fa7e6fe7c1ae0574c91639bee10.jpg }
  - { hash: 4249729127, name: "Widow's Silk", kind: aspect, type: "Strand Aspect", description: "You have an additional grenade charge.\n\nYour Grappling Hook creates a Grapple Tangle at the grapple point.", icon: /common/destiny2_content/icons/87de51bca878ac633a107e805426e95c.jpg }
  - { hash: 4255093903, name: "Solar Siphon", kind: armorMod, type: "Helmet Armor Mod", tier: basic, slot: helmet, description: "Rapid Solar weapon final blows create an Orb of Power.", icon: /common/destiny2_content/icons/616808818e1e2da9bdee335f93d2d92e.png }
  - { hash: 4260353952, name: "Sentinel Shield", kind: super, type: "Super Ability", description: "[Super] : Summon a shield of Void Light. \nWhile Sentinel Shield is active:\n[Light Attack] : Attack.\n[Block] : Block.\n[Grenade] : Perform a Shield Throw.\n\nGuard with Sentinel Shield to create a defensive wall that draws hostile fire. Allies behind the shield have increased survivability, weapon damage, and passive reload.\n\nGuarding allies and blocking damage makes the shield last longer and increases your Shield Throw damage.", icon: /common/destiny2_content/icons/a929ea604d638e5e99125e48f76989e2.png }
  - { hash: 4260353953, name: "Ward of Dawn", kind: super, type: "Super Ability", description: "Create a protective dome for you and your allies.\n\nWhile inside Ward of Dawn, allies gain Void overshield and increased weapon damage, while targets inside the Ward are weakened.\n\nThe Ward's owner also gains increased melee damage while inside and can pick up and throw the Ward's core to reposition the Ward up to two times.", icon: /common/destiny2_content/icons/1caf1eccf1072969ab93bd35fde62599.png }
  - { hash: 4260353955, name: "Twilight Arsenal", kind: super, type: "Super Ability", description: "[Super] : Summon three Void axes and throw them at your foes one after another. On impact, the axes pull in nearby targets and detonate in a weakening explosion. After exploding, the axes can be picked up by you or your allies and used as a weapon for a short time.\n\nWhile carrying a Void axe:\n[Light Attack] : Slash forward with your axe, dealing damage and weakening targets.\n[Heavy Attack] : Throw the axe, consuming all remaining ammo.", icon: /common/destiny2_content/icons/ad8fd9cd668f4d980b29e26ade9e4369.png }
  - { hash: 4267244538, name: "Distribution", kind: armorMod, type: "Class Item Armor Mod", tier: basic, slot: classItem, description: "Reduces all ability cooldowns when using your class ability near targets.", icon: /common/destiny2_content/icons/7feccda2bcb49a1667e206d53616931c.png }
  - { hash: 4268478333, name: "Flight", kind: weaponMod, type: "Enhanced Weapon Mod", tier: legendary, description: "Grants increased persistence and projectile speed.", icon: /common/destiny2_content/icons/31e489371b61a3acae2db75fe51c2470.png }
  - { hash: 4278960718, name: "Adept Handling", kind: weaponMod, type: "Weapon Mod", tier: legendary, description: "+10 Handling", icon: /common/destiny2_content/icons/d478f9294fa6aff0452d891faf726930.png }
  - { hash: 4283953067, name: "Arc Ammo Generation", kind: armorMod, type: "Chest Armor Mod", tier: basic, slot: chest, description: "Increases the ammo generation of Arc weapons.", icon: /common/destiny2_content/icons/72957f7e808d990528dac22b52416cd9.png }
  - { hash: 4284305243, name: "Mechaneer's Tricksleeves", kind: armor, type: "Gauntlets", tier: exotic, slot: arms, intrinsic: 481860151, class: hunter, watermark: /common/destiny2_content/icons/4f28dc0f39238fe25d298a894ea71389.png, icon: /common/destiny2_content/icons/cec0919e3c95d134d82f701f2f6b87dd.jpg }
  - { hash: 4285947411, name: "Enhanced Persistence", kind: weaponMod, type: "Enhanced Weapon Mod", tier: legendary, description: "+10 Persistence", icon: /common/destiny2_content/icons/a8c93704e41a30079210e8014e147356.png }
  - { hash: 4287822553, name: "Strand Ammo Generation", kind: armorMod, type: "Chest Armor Mod", tier: basic, slot: chest, description: "Increases the ammo generation of Strand weapons.", icon: /common/destiny2_content/icons/f295e85f892699f1d15139e39c8dc326.png }
  - { hash: 4294909663, name: "Arc Holster", kind: armorMod, type: "Leg Armor Mod", tier: basic, slot: legs, description: "Gradually reloads your stowed Arc weapons over time.", icon: /common/destiny2_content/icons/522c8c1e558031e87aec2ec3f53ce628.png }
