  - { hash: 3731491409, name: "Transcendent Moment", kind: weaponPerk, type: "Trait", tier: basic, description: "Final blows grant bonus stats based on the weapon's damage type alignment. Light elements grant stability and handling. Dark elements grant range and aim assist. While Transcendent, this weapon gets both bonuses.", icon: /common/destiny2_content/icons/1de4345604751861c03bee4ccd5efa6b.png }
  - { hash: 3769507632, name: "Gathering Storm", kind: super, type: "Super Ability", description: "Hurl your Arc Staff forward, embedding it into surfaces or large targets and jolting nearby targets.\n\nAfter a short time, a devastating lightning bolt strikes the staff, overcharging it with Arc energy. While overcharged, your staff discharges lightning at nearby foes.", icon: /common/destiny2_content/icons/edf23f2e6951efcab4c4b10630b6f7c4.png }
  - { hash: 3769507633, name: "Arc Staff", kind: super, type: "Super Ability", description: "Form a staff of pure Arc energy and acrobatically take out your foes.\n\n[Block] : Hold to deflect incoming projectiles with your Arc staff.\n\nDeflecting a projectile grants you a stack of Bolt Charge.\n\nHeavy attack combos and airborne heavy slams blind targets.", icon: /common/destiny2_content/icons/435489f514e2bf88d25c452a96f2dff9.png }
  - { hash: 3797647183, name: "Ambitious Assassin", kind: weaponPerk, type: "Enhanced Trait", tier: common, description: "Overflows the magazine based on the number of rapid final blows before reloading. Improves reload.", icon: /common/destiny2_content/icons/1f93b49c7f10b1be70083f913a3c5d63.png }
  - { hash: 3832366019, name: "Harmonic Siphon", kind: armorMod, type: "Helmet Armor Mod", tier: basic, slot: helmet, description: "Arc Siphon: Rapid Arc weapon final blows create an Orb of Power.\nSolar Siphon: Rapid Solar weapon final blows create an Orb of Power.\nStasis Siphon: Rapid Stasis weapon final blows create an Orb of Power.\nVoid Siphon: Rapid Void weapon final blows create an Orb of Power.\nStrand Siphon: Rapid Strand weapon final blows create Orbs of Power.", icon: /common/destiny2_content/icons/c917bbeedced45dcb28ad86dae47ca0f.png }
  - { hash: 3907299874, name: "New Tricks", kind: intrinsic, type: "Intrinsic", tier: exotic, description: "Gain an additional Skip Grenade charge. Skip Grenade damage grants Bolt Chargeand gaining Bolt Charge grants Skip Grenade energy. When Bolt Charge is ready, you heal nearby allies and enhance your next Skip Grenade.", icon: /common/destiny2_content/icons/5e71bde3f74560840a67842e5c46a8cc.png }
  - { hash: 3926119246, name: "Strand Siphon", kind: armorMod, type: "Helmet Armor Mod", tier: basic, slot: helmet, description: "Rapid Strand weapon final blows create Orbs of Power.", icon: /common/destiny2_content/icons/ce1edf40f2713ae8cacb4d08bf9cb1f1.png }
  - { hash: 3933525367, name: "Gambler's Dodge", kind: classAbility, type: "Class Ability", tier: basic, description: "Dodge to perform a deft tumble, avoiding combatant attacks and generating melee ability energy. Energy gain is scaled by your Melee stat. Dodging near enemies increases the energy gain.", icon: /common/destiny2_content/icons/5bb832a0d1719210c76442528d9ca1ac.png }
  - { hash: 3941205951, name: "Dawnblade", kind: subclass, type: "Warlock Subclass", tier: basic, description: "Daybreak: Fashion Solar Light into blades and smite your foes from the sky.\n\nYour Daybreak projectiles scorch targets on impact.\nWell of Radiance: Thrust your Sword into the ground, damaging and scorching nearby targets. The sword projects a continuous aura, granting radiant effects and restoration to nearby allies, protecting them from the effects of Stasis.\nSong of Flame: Unleash your inner fire, making your equipped weapons radiant and enhancing your abilities.\n\n[Melee] : Release a supercharged melee attack that launches additional projectiles.\n\n[Grenade] : Create a sentient flame wisp that seeks out targets and detonates in a scorching explosion, then seeks out other nearby targets.\n\nWhile Song of Flame is active, you and nearby allies regenerate abilities more quickly, are more resistant to incoming damage, and your [Solar] Solar and Kinetic weapons scorch targets.", icon: /common/destiny2_content/icons/fedcb91b7ab0584c12f0e9fec730702b.png }
