  - { hash: 2779035018, name: "Feeding Frenzy", kind: weaponPerk, type: "Trait", tier: basic, description: "Each rapid kill with this weapon progressively increases reload speed for a short time.", icon: /common/destiny2_content/icons/89d7e65f5ebe8d291ea96f128765921d.png }
  - { hash: 2816982785, name: "Gambler's Dodge", kind: classAbility, type: "Class Ability", tier: basic, description: "Dodge to perform a deft tumble, avoiding combatant attacks and generating melee ability energy. Energy gain is scaled by your Melee stat. Dodging near enemies increases the energy gain.", icon: /common/destiny2_content/icons/06f00a7fbe80686a21c95d53e1506ed1.jpg }
  - { hash: 2817499044, name: "Envious Arsenal", kind: weaponPerk, type: "Enhanced Trait", tier: common, description: "Dealing damage with both other weapons before readying this weapon refills it from reserves. Increases ammo generation.", icon: /common/destiny2_content/icons/234bcd9dc9f5e3ec850a8eac748afbde.png }
  - { hash: 2842471112, name: "Sentinel", kind: subclass, type: "Titan Subclass", tier: basic, description: "Ward of Dawn: Create a protective dome for you and your allies.\n\nWhile inside Ward of Dawn, allies gain Void overshield and increased weapon damage, while targets inside the Ward are weakened.\n\nThe Ward's owner also gains increased melee damage while inside and can pick up and throw the Ward's core to reposition the Ward up to two times.\nSentinel Shield: [Super] : Summon a shield of Void Light. \nWhile Sentinel Shield is active:\n[Light Attack] : Attack.\n[Block] : Block.\n[Grenade] : Perform a Shield Throw.\n\nGuard with Sentinel Shield to create a defensive wall that draws hostile fire. Allies behind the shield have increased survivability, weapon damage, and passive reload.\n\nGuarding allies and blocking damage makes the shield last longer and increases your Shield Throw damage.\nTwilight Arsenal: [Super] : Summon three Void axes and throw them at your foes one after another. On impact, the axes pull in nearby targets and detonate in a weakening explosion. After exploding, the axes can be picked up by you or your allies and used as a weapon for a short time.\n\nWhile carrying a Void axe:\n[Light Attack] : Slash forward with your axe, dealing damage and weakening targets.\n[Heavy Attack] : Throw the axe, consuming all remaining ammo.", icon: /common/destiny2_content/icons/32b112a9460e6f0e2b9ee15dc53fe1c1.png }
  - { hash: 2846385770, name: "Rangefinder", kind: weaponPerk, type: "Trait", tier: basic, description: "Aiming this weapon increases its effective range and zoom magnification. Increased projectile velocity while aiming Rocket Launchers, Grenade Launchers, and Bows.", icon: /common/destiny2_content/icons/74270d52bec24f1f5f4c987f5f37fce9.png }
  - { hash: 2849050827, name: "Voidwalker", kind: subclass, type: "Warlock Subclass", tier: basic, description: "Nova Warp: Step between dimensions to subvert the laws of physics.\n\n[Super Secondary] : Teleport a short distance and release weakening seekers.\n\n[Super Primary] : Unleash a deadly Void eruption. A fully charged attack makes targets volatile.\nNova Bomb: Vortex: Hurl an explosive bolt of Void Light at a target, disintegrating those caught within its blast.\n\nNova Bomb creates a singularity that pulls targets inward and continually damages those trapped inside.\nNova Bomb: Cataclysm: Hurl an explosive bolt of Void Light at a target, disintegrating those caught within its blast.\n\nNova Bomb travels slowly and seeks targets. Detonations shatter into smaller seeker projectiles.", icon: /common/destiny2_content/icons/32b112a9460e6f0e2b9ee15dc53fe1c1.png }
  - { hash: 2883433250, name: "Luminopotent Cuirass", kind: armor, type: "Chest Armor", tier: legendary, slot: chest, set: 499993704, icon: /common/destiny2_content/icons/f8684accf31f6180323fe833345eedbb.jpg }
  - { hash: 2888266564, name: "Crisis Inverted", kind: weapon, type: "Hand Cannon", tier: legendary, slot: energy, damageType: arc, traits: [[1168162263, 1583705720, 671806388, 509074078, 3700496672, 3523296417, 2621346526, 1570042021, 2946784966, 247725512, 588594999, 1645158859], [47981717, 3511092054, 2896038713, 2209918983, 1546637391, 438098033, 11612903, 1048183818, 2846385770, 957782887, 1015611457, 4049631843]], intrinsic: 1294026524, icon: /common/destiny2_content/icons/c1c24e84da1dd184662b3a16711ab7aa.jpg }
  - { hash: 2896038713, name: "Focused Fury", kind: weaponPerk, type: "Trait", tier: basic, description: "Dealing a portion of the magazine as precision damage grants this weapon bonus damage. The shot count is reset whenever the weapon is reloaded or stowed.", icon: /common/destiny2_content/icons/15fb47018719c99ae37d10f794bc957e.png }
  - { hash: 2903198438, name: "Dielectric", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Defeating [Arc]Arc debuffed targets grants Bolt Charge.\n\nRapidly defeating Arc debuffed targets spawns an Orb of Power and heals a small portion of health.", icon: /common/destiny2_content/icons/2ba8a6fb47d9a36d8e5651bad5a86752.png }
  - { hash: 2932390016, name: "Striker", kind: subclass, type: "Titan Subclass", tier: basic, description: "Fists of Havoc: Supercharge your fists and slam the ground with the force of a maelstrom. While active:\n\n[Light Attack] : Quickly dash forward, dealing damage to any impacted targets.\n\n[Heavy Attack] : Slam your fists to the ground, blinding targets and dealing damage in an area around you, leaving aftershocks in your wake. Performing a slam from the air or after a dash deals additional damage.\nThundercrash: Hurtle through the air like a missile and crash into targets to inflict meteoric damage.", icon: /common/destiny2_content/icons/949af7a61d60a8e6071282daafa9e6e9.png }
  - { hash: 2946784966, name: "Tunnel Vision", kind: weaponPerk, type: "Trait", tier: basic, description: "Reloading after defeating a target greatly increases target acquisition and aim down sight speed for a short duration.", icon: /common/destiny2_content/icons/ab0837be56c8d5cfc474acd4f3f9c7ac.png }
  - { hash: 2996369932, name: "Elemental Charge", kind: armorMod, type: "Leg Armor Mod", tier: legendary, slot: legs, description: "Collecting an Elemental pickup or destroying a Tangle has an escalating chance to give you Armor Charge.\n\nElemental pickups include [Solar]Firesprites, [Void]Void Breaches, [Arc]Ionic Traces, [Stasis]Stasis Shards, and [Strand]Strand Tangles.", icon: /common/destiny2_content/icons/437c1aed014547ef1553fdfec50a2310.png }
  - { hash: 3007133316, name: "Frenzy", kind: weaponPerk, type: "Enhanced Trait", tier: common, description: "Being in combat for an extended time increases damage, handling, and reload for this weapon for an improved duration until you are out of combat.", icon: /common/destiny2_content/icons/23e06f4ced1b3e6476f342978ff5bb37.png }
  - { hash: 3122197216, name: "Balanced Tuning", kind: armorMod, type: "General Armor Mod", tier: basic, description: "Slightly increases the three lowest stats on this armor at no cost.", icon: /common/destiny2_content/icons/32759b0ce261d185ac8a06b7dc9cafb4.png }
  - { hash: 3168997075, name: "Stormcaller", kind: subclass, type: "Warlock Subclass", tier: basic, description: "Stormtrance: Chain Arc Lightning from your hands to electrify targets with devastating streams of Arc Light that intensify over time. Casting Stormtrance creates a jolting shockwave underneath you.\n\n[Sprint] : Teleport forward, consuming a small amount of Super energy.\nChaos Reach: Unleash a long-range channeled beam of concentrated Arc energy. Sustained damage on a single target creates a jolting lightning strike at their position.\n\n [Super] while active to deactivate your Super early, saving Super energy.", icon: /common/destiny2_content/icons/949af7a61d60a8e6071282daafa9e6e9.png }
  - { hash: 3279257734, name: "Strand Siphon", kind: armorMod, type: "Helmet Armor Mod", tier: basic, slot: helmet, description: "Rapid Strand weapon final blows create Orbs of Power.", icon: /common/destiny2_content/icons/ce1edf40f2713ae8cacb4d08bf9cb1f1.png }
