  - { hash: 2344320975, name: "Radiant Orbs", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "While you have a Solar or Prismatic subclass equipped, picking up an Orb of Power makes you radiant.", icon: /common/destiny2_content/icons/504b0ee422c64b4baa8ba5c1bbbb8ada.png }
