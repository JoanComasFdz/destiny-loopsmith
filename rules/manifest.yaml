  - { hash: 1920417385, name: "Grim Harvest", kind: aspect, type: "Stasis Aspect", description: "Picking up [Stasis] Stasis shards grants stacks of Frost Armor.\n\nWhile you have Frost Armor, defeating combatants with Stasis or Kinetic weapons may cause them to shatter, damaging nearby foes. The shatter chance increases with your Frost Armor stacks.\n\nTaking damage while you have Frost Armor generates class ability energy.\nUNLOCKED BY QUEST: ASPECT OF INFLUENCE\nPurchase this Stasis Aspect from the Exo Stranger on Europa after completing the Beyond Light campaign.", icon: /common/destiny2_content/icons/aedf0a4a86c5dc63ab810879662b417a.png }
