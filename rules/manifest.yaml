  - { hash: 262821318, name: "Mindspun Invocation", kind: aspect, type: "Strand Aspect", description: "Your grapple, Shackle Grenade, Threadling Grenade, and Slicewire Grenade have enhanced functionality.\n\nYour grapple melee spawns three Threadlings.\n\n[Grenade] : Hold to consume your Shackle Grenade and activate Weaver's Trance. Final blows while Weaver's Trance is active create a suspending detonation.\n\n[Grenade] : Hold to charge your Threadling Grenade, causing it to weave a Threadling Nest at the impact location that repeatedly spawns Threadlings. \n\n[Grenade] : Hold to charge your Slicewire Grenade. The grenade's final detonation will launch submunitions and leave a Tangle in its wake.", icon: /common/destiny2_content/icons/277c475b9d3a3c1d167626b1bf9815ca.jpg }
  - { hash: 262821319, name: "The Wanderer", kind: aspect, type: "Strand Aspect", description: "Tangles you throw attach to targets and detonate into a suspending burst. Destroying a Tangle creates a suspending burst after a short delay.\n\nThreadling final blows create Tangles or reduce your current Tangle cooldown.", icon: /common/destiny2_content/icons/9d7be0c24d6dc7f041289e3b08ecff5e.jpg }
