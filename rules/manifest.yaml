  - { hash: 2742146822, name: "Kinetic Rupture", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Kinetic weapon damage against a powerful combatant has a chance to create a Kinetic Rupture. Targeting this Rupture causes a damaging explosion that staggers combatants. Strong against [Stagger] Unstoppable Champions.", icon: /common/destiny2_content/icons/01fddf1eba3b2cca594be0fec0af049e.png }
  - { hash: 2742146823, name: "Sniper's Meditation", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Sniper Rifle hits grant stacking Sniper Rifle damage, stability, and reload bonuses for a short time. Heavy ammo Sniper Rifle hits count as more than one hit.", icon: /common/destiny2_content/icons/e7a8b3b1eb71f1d70e31d5642c92c5fb.png }
  - { hash: 2747500760, name: "Burning Maul", kind: super, type: "Super Ability", description: "Summon a flaming maul and crush targets with the force of an earthquake.\n\n[Light Attack] : Spin the maul in a circle around you, damaging nearby targets.\n\n[Heavy Attack] : Slam the maul to the ground and create a cyclone of flames that seeks targets, dealing damage and scorching them.", icon: /common/destiny2_content/icons/a0391bd2a8cf73c58cec261961db0136.png }
  - { hash: 2747500761, name: "Hammer of Sol", kind: super, type: "Super Ability", description: "Summon a flaming hammer and wreak destruction down upon your enemies.\n\n[Light Attack] : Throw your hammer at foes.\n\nUpon impact, your hammers shatter into explosive molten shards.", icon: /common/destiny2_content/icons/9d1fd669f61cce4abd35dbefd22ba90c.png }
  - { hash: 2769443638, name: "Shock and Clear", kind: perk, description: "Final blows with Jolt or against jolted combatants create Ionic Traces.", icon: /common/destiny2_content/icons/bdd6424d0b5dbee52505d969653c69e0.png }
  - { hash: 2769443639, name: "Ionic Overclock", kind: perk, description: "While amplified, your Fusion Rifles, Linear Fusion Rifles, and Heat weapons gain increased handling, reload, and vent speeds.", icon: /common/destiny2_content/icons/6999410ff04b4144a07c39fbca5ea831.png }
  - { hash: 2771425787, name: "Melee Font", kind: armorMod, type: "Arms Armor Mod", tier: basic, slot: arms, description: "You gain a bonus to your melee stat while you have any Armor Charge. Your Armor Charge decays over time.", icon: /common/destiny2_content/icons/fe487c4b4ad9a64f597df822d9f098b2.png }
  - { hash: 2773358872, name: "Void Siphon", kind: armorMod, type: "Helmet Armor Mod", tier: basic, slot: helmet, description: "Rapid Void weapon final blows create an Orb of Power.", icon: /common/destiny2_content/icons/378478ca52ffb14acfb6ae82b8a73cac.png }
  - { hash: 2779035018, name: "Feeding Frenzy", kind: weaponPerk, type: "Trait", tier: basic, description: "Each rapid kill with this weapon progressively increases reload speed for a short time.", icon: /common/destiny2_content/icons/89d7e65f5ebe8d291ea96f128765921d.png }
  - { hash: 2788997987, name: "Void Resistance", kind: armorMod, type: "Chest Armor Mod", tier: basic, slot: chest, description: "Void Damage Resistance: Reduces incoming Void damage from combatants.", icon: /common/destiny2_content/icons/8853c3d7173e560ba83042c7f7530f62.png }
