  - { hash: 122204356, name: "Adhesive Ordnance", kind: weaponPerk, type: "Enhanced Trait", tier: common, description: "Collecting ammo loads an explosive round that adheres to surfaces, has an improved detonation shortly after impact, and applies exhaust.", icon: /common/destiny2_content/icons/0f07b685b342c7354c29eb8cc06dec52.png }
