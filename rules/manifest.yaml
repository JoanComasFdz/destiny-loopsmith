  - { hash: 262821312, name: "Weavewalk", kind: aspect, type: "Strand Aspect", description: "[Air Dodge] : Dodge while airborne to consume your melee energy and enter the weave, gaining damage resistance from combatants and players. Reactivate your air dodge or cast your Rift to exit the weave, generating Woven Mail for you and nearby allies.\n\nWhile in the weave, your melee energy is drained and you generate perched Threadlings over time. Threadling hits generate ability energy.", icon: /common/destiny2_content/icons/b736858e50cbf0ffcdfe9a2d3d70e839.jpg }
