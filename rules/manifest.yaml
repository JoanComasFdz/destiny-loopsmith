  - { hash: 1504442987, name: "NPA Repulsion Regulator", kind: artifact, type: "Artifact", tier: legendary, tiers: [[255237660, 255237663, 255237662, 255237657, 255237656, 255237659, 255237658], [4232817857, 4232817858, 4232817859, 4232817860, 4232817861, 4232817862, 4232817863], [2311625538, 2311625537, 2311625536, 2311625543, 2311625542, 2311625541, 2311625540]], slots: [1, 1, 2, 2, 2, 3, 3], flavor: "A relic from a past journey to reunite with Commander Sloane and Ahsa.", description: "Works best with:\nElements: [Arc] [Void] [Strand]\nWeapons: [Glaive] [Auto Rifle]", icon: /common/destiny2_content/icons/d710c0340c78b1eecd6821bd5dd104ce.jpg }
  - { hash: 1514173218, name: "Scatter Grenade", kind: grenade, type: "Void Grenade", description: "A grenade that splits into many submunitions and covers a large area with multiple explosions.", icon: /common/destiny2_content/icons/562f1b6ca7ecda82248f4b02e833d211.jpg }
  - { hash: 1523545668, name: "Backup Mag", kind: weaponMod, type: "Enhanced Weapon Mod", tier: legendary, description: "Greatly increases magazine.", icon: /common/destiny2_content/icons/4c3c1b5313ca76fc3064fd47f1694c92.png }
  - { hash: 1525622117, name: "Adept Counterbalance", kind: weaponMod, type: "Weapon Mod", tier: legendary, description: "Greatly improves recoil direction.", icon: /common/destiny2_content/icons/ad8fcad174d434208af7b02646fb43a8.png }
  - { hash: 1533272841, name: "Prismatic Transfer", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "When you cast your Super, each member of your fireteam with a Super type different than yours gains a bonus to weapon damage.", icon: /common/destiny2_content/icons/e2d5f4807e70f1f3ff310415cc44b67c.png }
  - { hash: 1533272842, name: "Argent Blade", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "While you have Armor Charge, dealing damage with a Sword consumes an Armor Charge and empowers your Sword for a short time, granting it bonus damage and energy charge rate.", icon: /common/destiny2_content/icons/8c8ec47b96429cb02c2c7640defc79b8.png }
  - { hash: 1533272843, name: "Expanding Abyss", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Void sources deal increased damage to weakened targets.", icon: /common/destiny2_content/icons/f2a75f5858c1e49244972e97362d5c80.png }
  - { hash: 1533272844, name: "Shieldcrush", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "While you have Woven Mail, Frost Armor, or a Void Overshield, your melee recharges faster and deals increased damage.\n\nWhile you are amplified or radiant, your grenade recharges faster and deals increased damage.", icon: /common/destiny2_content/icons/d22083ccc81ece6444fa2c022df89705.png }
  - { hash: 1533272845, name: "Transference", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Gain increased grenade and melee damage while transcendent.\n\nWeapon final blows while transcendent refund Light and Dark energy after Transcendence ends.", icon: /common/destiny2_content/icons/ae11028a5a83ed41cb86d88a97161de2.png }
  - { hash: 1533272846, name: "Sniper's Meditation", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "Sniper Rifle hits grant stacking Sniper Rifle damage, stability, and reload bonuses for a short time. Heavy ammo Sniper Rifle hits count as more than one.", icon: /common/destiny2_content/icons/e7a8b3b1eb71f1d70e31d5642c92c5fb.png }
  - { hash: 1533272847, name: "Shock and Awe", kind: artifactPerk, type: "Artifact Perk", tier: legendary, description: "When you have an Arc or Prismatic subclass equipped, Arc final blows while you are amplified summon a burst of lightning that damages and jolts targets.", icon: /common/destiny2_content/icons/0a18b425797c5f38a69665d5c3a6333f.png }
  - { hash: 1546142478, name: "Binary Orbit", kind: weaponPerk, type: "Trait", tier: basic, description: "Elemental final blows opposite this weapon increase damage for a short duration. Darkness final blows boost Arc, Solar, and Void weapons. Light final blows boost Stasis, Strand, and Kinetic weapons.", icon: /common/destiny2_content/icons/1efa3bc1f9622f08f7d2461f2fb080f9.png }
  - { hash: 1546637391, name: "Vorpal Weapon", kind: weaponPerk, type: "Trait", tier: basic, description: "Increased damage against bosses, vehicles, and Guardians with their Super active.", icon: /common/destiny2_content/icons/bc5130b227ee577f2678ec2d2c97bf4a.png }
  - { hash: 1547656727, name: "Magnetic Grenade", kind: grenade, type: "Void Grenade", description: "A grenade that attaches to targets and explodes twice.", icon: /common/destiny2_content/icons/72966b5c97e45d8668483f2263138613.jpg }
  - { hash: 1550063955, name: "Thunderlord Catalyst", kind: catalyst, tier: exotic, perks: [818260022], description: "Upgrades this weapon to a Masterwork. Once upgraded, the weapon will obtain enhanced capabilities, such as increased stats and/or additional perks.\n\nDefeat targets using this weapon to unlock this upgrade.", icon: /common/destiny2_content/icons/e18f1c00497de70e2a53d5dcd5c79cab.jpg }
  - { hash: 1553790504, name: "Unflinching Solar Aim", kind: armorMod, type: "Chest Armor Mod", tier: basic, slot: chest, description: "Reduces flinching from incoming fire while aiming a Solar weapon.", icon: /common/destiny2_content/icons/a4c4c21ff07b3f308371ee80acb9b204.png }
  - { hash: 1556840489, name: "Lead from Gold", kind: weaponPerk, type: "Trait", tier: basic, description: "Picking up Heavy ammo also grants ammo to this weapon.", icon: /common/destiny2_content/icons/87f6cac4799cbae4e11ba74d3dc77504.png }
  - { hash: 1561736585, name: "Kinetic Dexterity", kind: armorMod, type: "Arms Armor Mod", tier: basic, slot: arms, description: "Faster ready and stow speed for Kinetic weapons.", icon: /common/destiny2_content/icons/f26dd22ff54d884dcb7dd47988249645.png }
  - { hash: 1563930741, name: "Howl of the Storm", kind: aspect, type: "Stasis Aspect", description: "While sliding, activate your charged melee ability to launch a wave of [Stasis] Stasis energy forward that freezes enemy combatants, slows enemy players, and creates [Stasis] Stasis crystals.\n\nGrants an additional melee charge.\nUNLOCKED BY QUEST: ASPECT OF INFLUENCE\nPurchase this Stasis Aspect from the Exo Stranger on Europa after completing the Beyond Light campaign.", icon: /common/destiny2_content/icons/cc2ac1ffdba3d5dc32afdaef4b002505.png }
  - { hash: 1570042021, name: "Heating Up", kind: weaponPerk, type: "Trait", tier: basic, description: "Final blows with this weapon increase accuracy and stability while improving vertical recoil.", icon: /common/destiny2_content/icons/39d2032b3c5bc7a5b2fe391c64ccb7db.png }
  - { hash: 1582574009, name: "Arcbolt Grenade", kind: grenade, type: "Arc Grenade", description: "A grenade that chains bolts of lightning to nearby targets.", icon: /common/destiny2_content/icons/04c36b4cfebda156a8eca2b257e3ce4f.jpg }
  - { hash: 1583705720, name: "Stats for All", kind: weaponPerk, type: "Trait", tier: basic, description: "Hitting three separate targets increases weapon handling, stability, reload, and range for a moderate duration.", icon: /common/destiny2_content/icons/8aadd7fd25c2b1e9f3fc7f4411a97ea4.png }
  - { hash: 1588595445, name: "Counterbalance Stock", kind: weaponMod, type: "Weapon Mod", tier: legendary, description: "Reduces recoil deviation for the weapon.", icon: /common/destiny2_content/icons/4fe8955049eee3e89c4de69dbceb5ab2.png }
  - { hash: 1589556860, name: "Void Targeting", kind: armorMod, type: "Helmet Armor Mod", tier: basic, slot: helmet, description: "Improved target acquisition, accuracy, and aim-down-sights speed for Void weapons.", icon: /common/destiny2_content/icons/70ceb6ff273dc3364cece9a06e9dad1f.png }
  - { hash: 1592913511, name: "Tension", kind: weaponMod, type: "Enhanced Weapon Mod", tier: legendary, description: "Greatly increases draw time and accuracy.", icon: /common/destiny2_content/icons/3a90b0a263a5805b7415599447e89359.png }
  - { hash: 1596513538, name: "Tactical", kind: weaponMod, type: "Weapon Mod", tier: legendary, description: "Grants slightly increased vent speed and handling.", icon: /common/destiny2_content/icons/faa8e06f2943031a948f0bb55971ce6d.png }
  - { hash: 1602994568, name: "Controlled Demolition", kind: aspect, type: "Void Aspect", description: "Hitting a target with a Void ability or Volatile explosion makes them volatile. Further damage to a volatile target causes them to explode. Grants you and nearby allies health when volatile targets explode near you.", icon: /common/destiny2_content/icons/ab2545998f350de7b29549d2b19996e2.jpg }
  - { hash: 1602994569, name: "Bastion", kind: aspect, type: "Void Aspect", description: "Cast your Super to grant Overshield to nearby allies. \n\nCasting your Barricade grants Overshield to yourself and nearby allies and empowers it, enabling it to slowly regenerate the Overshield of allies bunkering behind it and extend their Overshield duration.", icon: /common/destiny2_content/icons/5428b311ff07d2bacb073e551ed2bea1.jpg }
  - { hash: 1602994570, name: "Offensive Bulwark", kind: aspect, type: "Void Aspect", description: "While you have an Overshield or are inside Ward of Dawn, final blows grant grenade and melee energy, you have increased melee range and damage, and melee final blows restore a small portion of your Overshield and extend its duration.\n\nYou gain an additional Shield Throw while in Sentinel Shield.", icon: /common/destiny2_content/icons/68683d4544848844a1fe0acdf7417019.jpg }
  - { hash: 1602994571, name: "Unbreakable", kind: aspect, type: "Void Aspect", description: "[Grenade] : Hold to summon a [Void] Void shield that draws hostile fire and blocks a portion of incoming damage, gradually draining your grenade energy and granting an Overshield over time.\n\nReleasing the grenade input or running out of energy releases a frontal blast from your shield that disorients combatants and deals increased damage based on how much damage was blocked. Final blows with the frontal blast grant you Devour.\n\nCombatants that come in contact with your shield are temporarily disoriented.", icon: /common/destiny2_content/icons/717e2702d16fb2175f81b54c2d62b7be.jpg }
  - { hash: 1604394872, name: "Dynamo", kind: armorMod, type: "Helmet Armor Mod", tier: basic, slot: helmet, description: "Reduces Super cooldown when using your class ability near targets.", icon: /common/destiny2_content/icons/5abbb67240545dc76f646d603da90020.png }
  - { hash: 1611241895, name: "Shinobu's Vow", kind: armor, type: "Gauntlets", tier: exotic, slot: arms, class: hunter, watermark: /common/destiny2_content/icons/7ba9d804508dd083ec20fcdb8ba0869d.png, icon: /common/destiny2_content/icons/8ea4e6ce75fcf446b699029aab9d6060.jpg }
  - { hash: 1627901452, name: "Stacks on Stacks", kind: armorMod, type: "Leg Armor Mod", tier: basic, slot: legs, description: "Picking up an Orb of Power grants you 1 additional stack of Armor Charge.", icon: /common/destiny2_content/icons/780fe3859af46613015a5d2670907612.png }
  - { hash: 1645158859, name: "Under Pressure", kind: weaponPerk, type: "Trait", tier: basic, description: "Improved stability and accuracy as the magazine gets lower.", icon: /common/destiny2_content/icons/ac8ec81cd8139434a4b19e459bd9b8ff.png }
  - { hash: 1653281839, name: "Enhanced Projectile Speed", kind: weaponMod, type: "Enhanced Weapon Mod", tier: legendary, description: "+10 Projectile Speed", icon: /common/destiny2_content/icons/011e9fb011d9017902e135929a0504cb.png }
  - { hash: 1656118680, name: "Nova Warp", kind: super, type: "Super Ability", description: "Step between dimensions to subvert the laws of physics.\n\n[Super Secondary] : Teleport a short distance and release weakening seekers.\n\n[Super Primary] : Unleash a deadly Void eruption. A fully charged attack makes targets volatile.", icon: /common/destiny2_content/icons/feb001db8e9776bc822007c74564c1b6.png }
  - { hash: 1656118681, name: "Nova Bomb: Vortex", kind: super, type: "Super Ability", description: "Hurl an explosive bolt of Void Light at a target, disintegrating those caught within its blast.\n\nNova Bomb creates a singularity that pulls targets inward and continually damages those trapped inside.", icon: /common/destiny2_content/icons/e9dc1cc0179cda4d2445845cf8992a7e.png }
  - { hash: 1656118682, name: "Nova Bomb: Cataclysm", kind: super, type: "Super Ability", description: "Hurl an explosive bolt of Void Light at a target, disintegrating those caught within its blast.\n\nNova Bomb travels slowly and seeks targets. Detonations shatter into smaller seeker projectiles.", icon: /common/destiny2_content/icons/b1efa0eaa710653d85e2fcf5321047fb.png }
  - { hash: 1656549672, name: "Touch of Thunder", kind: aspect, type: "Arc Aspect", description: "Your Flashbang, Pulse, Lightning, and Storm Grenades have enhanced functionality.\n\nFlashbang Grenade: Emits an additional blinding detonation on bounce.\n\nPulse Grenade: Creates Ionic Traces periodically as it damages targets and increases in damage over time.\n\nLightning Grenade: Grants an additional grenade charge, jolts targets hit by the initial blast, and grants Bolt Charge when it causes damage.\n\nStorm Grenade: After detonating, creates a roaming thundercloud that tracks nearby targets and fires bolts of lightning at foes beneath it.", icon: /common/destiny2_content/icons/2e639c65526c331f1d97623d51ca3a09.jpg }
  - { hash: 1656549673, name: "Juggernaut", kind: aspect, type: "Arc Aspect", description: "With full class ability energy and after sprinting for a short time, you gain a frontal shield that blocks incoming damage. When the frontal shield breaks, your class ability energy is depleted. When the frontal shield takes damage, you gain a stack of Bolt Charge.\n\nWhile amplified, the shield blocks significantly more damage before breaking.", icon: /common/destiny2_content/icons/046dc9f5d7a897b38d12a05ab837f5c7.jpg }
  - { hash: 1656549674, name: "Knockout", kind: aspect, type: "Arc Aspect", description: "Critically wounding a target or breaking their shield infuses your melee attacks with Arc energy and increases your melee range against combatants and melee damage against combatants and Guardians for a short time.\n\nDefeating targets with melee attacks makes you amplified and restores a portion of your health. Defeating more powerful combatants increases the amount of health restored.", icon: /common/destiny2_content/icons/e0fdf5c4c4dc10d6ee63365bf7d70821.jpg }
  - { hash: 1656549675, name: "Storm's Keep", kind: aspect, type: "Arc Aspect", description: "Cast your class ability to grant a moderate amount of Bolt Charge stacks to you and nearby allies.\n\nWhile behind your Barricade, you and allies gain stacks of Bolt Charge over time and your weapons can discharge max stacks of Bolt Charge.", icon: /common/destiny2_content/icons/58cee87c4df6399921797be06a7aa608.jpg }
  - { hash: 1669792723, name: "Void Ammo Generation", kind: armorMod, type: "Chest Armor Mod", tier: basic, slot: chest, description: "Increases the ammo generation of Void weapons.", icon: /common/destiny2_content/icons/45d2b3e6e2171de7d10c429c79203101.png }
  - { hash: 1672155562, name: "Class Font", kind: armorMod, type: "Class Item Armor Mod", tier: basic, slot: classItem, description: "You gain a bonus to your class stat while you have any Armor Charge. Your Armor Charge decays over time.", icon: /common/destiny2_content/icons/859a93ee38aa9cf96d96c8a4b55d59a4.png }
  - { hash: 1677180919, name: "Harmonic Dexterity", kind: armorMod, type: "Arms Armor Mod", tier: basic, slot: arms, description: "Arc Dexterity: Faster ready and stow speed for Arc weapons.\nSolar Dexterity: Faster ready and stow speed for Solar weapons.\nStasis Dexterity: Faster ready and stow speed for Stasis weapons.\nStrand Dexterity: Faster ready and stow speed for Strand weapons.\nVoid Dexterity: Faster ready and stow speed for Void weapons.", icon: /common/destiny2_content/icons/dbd9f5aa248d9168ce4896679e05d620.png }
  - { hash: 1680616210, name: "Threaded Spike", kind: melee, type: "Strand Melee", description: "Throw a rope dart that bounces between targets, damaging and severing them. The dart will return to you once it's done, returning melee energy to you for each target hit. Press [Melee] just as the dart gets back to you to catch it and increase the amount of energy returned.", icon: /common/destiny2_content/icons/46620e1f142778a0d429be7a12c39f21.png }
  - { hash: 1698387812, name: "Catapult Lift", kind: movement, type: "Movement Ability", description: "Jump while airborne to activate Lift and launch into the air with a strong initial burst of momentum.", icon: /common/destiny2_content/icons/32bfe820d982e00fac25c9aab277ebc3.jpg }
  - { hash: 1698387814, name: "High Lift", kind: movement, type: "Movement Ability", description: "Jump while airborne to activate Lift and launch into the air to greater heights.", icon: /common/destiny2_content/icons/07116cfce5a59222d658729cffb0f29c.jpg }
  - { hash: 1698387815, name: "Strafe Lift", kind: movement, type: "Movement Ability", description: "Jump while airborne to activate Lift and launch into the air with strong directional control.", icon: /common/destiny2_content/icons/78e14c7fa1b842f2ffc9bdaa24aecc70.jpg }
  - { hash: 1702273159, name: "Harmonic Loader", kind: armorMod, type: "Arms Armor Mod", tier: basic, slot: arms, description: "Arc Loader: Increases reload speed of Arc weapons.\nSolar Loader: Increases reload speed of Solar weapons.\nStasis Loader: Increases reload speed of Stasis weapons.\nStrand Loader: Increases reload speed of Strand weapons.\nVoid Loader: Increases reload speed of Void weapons.", icon: /common/destiny2_content/icons/825e3aef7827d66f56f244b0873ded59.png }
  - { hash: 1709236482, name: "Heavy Handed", kind: armorMod, type: "Arms Armor Mod", tier: basic, slot: arms, description: "Your powered melee final blows create Orbs of Power.", icon: /common/destiny2_content/icons/b4f287bb2bea2ae61431cfc3a35f6fa5.png }
  - { hash: 1710791394, name: "Adept Targeting", kind: weaponMod, type: "Weapon Mod", tier: legendary, description: "Greatly increases target acquisition.", icon: /common/destiny2_content/icons/a9b660fc5d62ea59791dc98d5b8fe140.png }
  - { hash: 1713935764, name: "Pulse Grenade", kind: grenade, type: "Arc Grenade", description: "A grenade that periodically damages targets within its explosion radius.", icon: /common/destiny2_content/icons/11837de6306d28df467178af097d748b.jpg }
  - { hash: 1727069360, name: "Spark of Focus", kind: fragment, type: "Arc Fragment", description: "After sprinting for a short time, your class ability regeneration is increased.\n-10 Class \u25bc\n-10 Weapon \u25bc\n-10 Health \u25bc", icon: /common/destiny2_content/icons/cfcdcc8f7d07111f6079ad8f869273c6.jpg }
  - { hash: 1727069361, name: "Spark of Frequency", kind: fragment, type: "Arc Fragment", description: "Melee hits increase your equipped weapon's reload speed and stability for a short duration.\n\nWhile amplified, the effects are increased and you gain increased stacks of Bolt Charge from all sources.", icon: /common/destiny2_content/icons/4979f2f84c3da353c19815106267beb9.jpg }
  - { hash: 1727069362, name: "Spark of Discharge", kind: fragment, type: "Arc Fragment", description: "Arc weapon final blows have a chance to create an Ionic Trace.\n\nCollecting an Ionic Trace grants you a stack of Bolt Charge.\n-10 Melee \u25bc", icon: /common/destiny2_content/icons/c883bf91f42e9c4b9c9ddce1ba2d2de5.jpg }
  - { hash: 1727069363, name: "Spark of Ions", kind: fragment, type: "Arc Fragment", description: "Defeating a jolted target or defeating a target with Bolt Charge creates an Ionic Trace.", icon: /common/destiny2_content/icons/2a7f5d325fc745877be70c443427d15b.jpg }
  - { hash: 1727069364, name: "Spark of Shock", kind: fragment, type: "Arc Fragment", description: "Your Arc grenades jolt targets.\n-10 Grenade \u25bc", icon: /common/destiny2_content/icons/2f49889b1fe7bcf01ef12b2cdc0fb511.jpg }
  - { hash: 1727069365, name: "Spark of Momentum", kind: fragment, type: "Arc Fragment", description: "Sliding over ammo bricks reloads your equipped weapon and grants you a small amount of Bolt Charge.", icon: /common/destiny2_content/icons/b8cfaccdc40ccdd6a3fb4f544dcb7700.jpg }
  - { hash: 1727069366, name: "Spark of Resistance", kind: fragment, type: "Arc Fragment", description: "While surrounded by combatants, you are more resistant to incoming damage.\n+10 Melee \u25b2", icon: /common/destiny2_content/icons/d92e1a6770ebbb509ceda1c6ab545e43.jpg }
  - { hash: 1727069367, name: "Spark of Beacons", kind: fragment, type: "Arc Fragment", description: "While you are amplified, your Arc Special or Heavy ammo weapon final blows create a blinding explosion.", icon: /common/destiny2_content/icons/8924af183dc3e6200536171a72c9fd77.jpg }
  - { hash: 1727069374, name: "Spark of Magnitude", kind: fragment, type: "Arc Fragment", description: "Your lingering Arc grenades (Lightning Grenade, Pulse Grenade, and Storm Grenade) have extended duration.", icon: /common/destiny2_content/icons/0b39167c8fc628482dea26cf43d78ec9.jpg }
  - { hash: 1727069375, name: "Spark of Recharge", kind: fragment, type: "Arc Fragment", description: "While critically wounded, your melee and grenade energy regenerates more quickly.", icon: /common/destiny2_content/icons/10b793e347263d81cc0404acf91aadc7.jpg }
  - { hash: 1734144409, name: "Mechaneer's Tricksleeves", kind: armor, type: "Gauntlets", tier: exotic, slot: arms, class: hunter, watermark: /common/destiny2_content/icons/4f28dc0f39238fe25d298a894ea71389.png, icon: /common/destiny2_content/icons/cec0919e3c95d134d82f701f2f6b87dd.jpg }
  - { hash: 1750845415, name: "Innervation", kind: armorMod, type: "Leg Armor Mod", tier: basic, slot: legs, description: "Reduces grenade cooldown each time you pick up an Orb of Power.", icon: /common/destiny2_content/icons/57db346edee222d0866ed0fe14aadde6.png }
  - { hash: 1755737153, name: "Time Dilation", kind: armorMod, type: "Class Item Armor Mod", tier: basic, slot: classItem, description: "Your decaying Armor Charge has a longer duration.", icon: /common/destiny2_content/icons/7b1acb2fa35c4eb1e752ba46538f0175.png }
  - { hash: 1763668984, name: "Melee Damage Resistance", kind: armorMod, type: "Chest Armor Mod", tier: basic, slot: chest, description: "Reduces incoming damage from combatants that are at point-blank range.", icon: /common/destiny2_content/icons/46520f0b4fefc0270823d0b968270142.png }
  - { hash: 1763780622, name: "Melee Kickstart", kind: armorMod, type: "Arms Armor Mod", tier: basic, slot: arms, description: "Collecting an Orb of Power causes you to gain 1 temporary Armor Charge.", icon: /common/destiny2_content/icons/574425b9621b95a0720f6f664828d414.png }
  - { hash: 1770364095, name: "Slayer Baron Apothecary Satchel", kind: artifact, type: "Artifact", tier: legendary, tiers: [[4037132128, 4037132131, 4037132130, 4037132133, 4037132132, 4037132135, 4037132134], [611645149, 611645150, 611645151, 611645144, 611645145, 611645146, 611645147], [3117519998, 3117519997, 3117519996, 3117519995, 3117519994, 3117519993, 3117519992]], slots: [1, 1, 2, 2, 2, 3, 3], flavor: "A relic from a past journey to serve the Eliksni people as Slayer Baron.", description: "Works best with:\nElements: [Stasis] [Void] [Arc]\nWeapons: [Grenade Launcher] [Special Grenade Launcher] [Shotgun]", icon: /common/destiny2_content/icons/fe806a8c8e4ef23813ec195d74bb74f7.jpg }
