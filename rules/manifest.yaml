  - { hash: 2550323932, name: "Sunbreaker", kind: subclass, type: "Titan Subclass", tier: basic, plugs: [2495523340, 2495523341, 2225231092, 2225231093, 2225231094, 2747500761, 2747500760, 852252788, 852252789, 2946990961, 3969294337, 2581086849, 2216698406, 3199702642, 1013086087, 2202441959, 1841016428, 2984351204, 2984351205, 2984351206, 2984351207, 4180586737, 4180586736, 362132293, 362132292, 362132295, 362132294, 362132289, 362132288, 362132291, 362132290, 362132301, 362132300, 1051276348, 1051276349, 1051276350, 1051276351], description: "Hammer of Sol: Summon a flaming hammer and wreak destruction down upon your enemies.\n\n[Light Attack] : Throw your hammer at foes.\n\nUpon impact, your hammers shatter into explosive molten shards.\nBurning Maul: Summon a flaming maul and crush targets with the force of an earthquake.\n\n[Light Attack] : Spin the maul in a circle around you, damaging nearby targets.\n\n[Heavy Attack] : Slam the maul to the ground and create a cyclone of flames that seeks targets, dealing damage and scorching them.", icon: /common/destiny2_content/icons/fedcb91b7ab0584c12f0e9fec730702b.png }
