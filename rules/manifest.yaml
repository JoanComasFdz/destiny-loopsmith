  - { hash: 2495523340, name: "Towering Barricade", kind: classAbility, type: "Class Ability", tier: basic, description: "Creates a large barrier that can be used to reinforce a position with cover, and draws hostile fire when you stand behind it.", icon: /common/destiny2_content/icons/b727baee6fe4228fbe35743a3bb199a9.jpg }
  - { hash: 2495523341, name: "Rally Barricade", kind: classAbility, type: "Class Ability", tier: basic, description: "Creates a small barrier that you can peek over while aiming down sights; increases weapon reload speed, stability, and range. Draws hostile fire when you stand behind it.", icon: /common/destiny2_content/icons/278392023803641890167602fef8bb4f.jpg }
