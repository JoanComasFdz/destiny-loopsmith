# Arc Hunter: abilities, aspects, fragments.
#
# Numbers from the Destiny Data Compendium snapshot of 2026-10-09 (source: compendium/2026-10-09/
# <Tab>#<row>); hashes are Clarity 2.0625's unless a comment says they are the manifest's (Clarity
# has no grenade, melee or super entries). Ability energy amounts are base values: chunk energy
# scalars and stats are not applied, and chunkScalar / baseCooldown are facts recorded from the
# Compendium that change nothing (ADRs D5).
# Format gaps that shape these rules (see builds/skip-grenade-hunter/discrepancies.md):
#  - an ability damage source cannot name a specific ability or its damage type ("Arc grenades",
#    "Skip Grenade drones" -> `grenade`);
#  - movement qualifiers are the abilities' secondary uses only (ADRs D9): the melee while sliding
#    (`melee:slide`, Tempest Strike's uppercut) and the class ability's air move (`class:air`,
#    Ascension). A rule on the plain ability fires for its secondary uses too.
elements:
  # ================================================================ abilities

  - id: arc-staff
    name: Arc Staff
    kind: super
    affinity: arc
    class: hunter
    # The manifest's hash (244213.26.06.29.2000-1-bnet.65864: the one super of that name).
    hash: 3769507633
    # Tier 2 super, 556 s. Supers have no chunk energy scalar (Game Mechanics#12), so chunkScalar
    # stays "?" rather than a made-up 1.
    ability: { kind: super, charges: 1, chunkScalar: "?", baseCooldown: 556 }
    description: "Roaming Arc super: a staff of Arc Light with 90% [PvP 53%] damage resistance for 20 s base. Kills grant x1 Bolt Charge; guarding reflects attacks, each for x1 Bolt Charge."
    source: compendium/2026-10-09/Arc#44
    rules:
      - on: { kill: { via: super } }
        then:
          - { applyBuff: { status: bolt-charge, stacks: 1 } }
        reason: "Every Arc Staff kill gives you a stack of Bolt Charge."
      # Not expressible: x1 Bolt Charge per attack reflected while guarding (no block/reflect trigger),
      # and the Blind from the airborne heavy attack and Palm Strike (a rule can't name one of the
      # super's attacks; "super damage -> Blind" would blind on every light attack too).
    # Not expressible: the super's damage resistance (no "while in your super" condition).
    passives: []

  - id: gathering-storm
    name: Gathering Storm
    kind: super
    affinity: arc
    class: hunter
    # The manifest's hash (light.gg, 2026-10-10): what a DIM loadout names (the owner's Skip Grenade
    # loadout plugs it).
    hash: 3769507632
    # Tier 3 super, 500 s. Supers have no chunk energy scalar (Game Mechanics#12), so chunkScalar
    # stays "?" rather than a made-up 1.
    ability: { kind: super, charges: 1, chunkScalar: "?", baseCooldown: 500 }
    description: "Thrown Arc super with 90% [PvP 49%] damage resistance. The staff blows up and sticks in whatever it hits: 544 [300] impact damage that jolts, and an explosion of up to 608 [?] within 10 m. 2 s later lightning strikes it for up to 1350 [500] within 10 m; 1.2 s after that it pulses 446 [60] damage within 10 m every 0.7 s for 8 s."
    source: compendium/2026-10-09/Arc#45
    rules:
      # The Jolt is the impact's. A rule can't name one part of the super, but every throw begins
      # with that impact, so any super damage jolts the pack in front of you (ADRs D7) - unlike
      # Arc Staff's Blind, which only some of its attacks apply. The explosion, the lightning strike
      # and the field are the same super action (`super:hit` / `super:kill`): their damage and
      # timing are facts in the description. The Compendium states no Bolt Charge on its kills.
      - on: { damage: { via: super } }
        then:
          - { debuffTarget: jolt }
        reason: "The thrown staff jolts what it hits on impact."
    # Not expressible: the super's damage resistance (no "while in your super" condition).
    passives: []

  - id: skip-grenade
    name: Skip Grenade
    kind: grenade
    affinity: arc
    class: hunter
    # The manifest's hash (light.gg, 2026-10-10): what a DIM loadout names.
    hash: 146194908
    ability: { kind: grenade, charges: 1, chunkScalar: 0.75, baseCooldown: 151.5 }
    description: "Arc grenade that splits on impact into 4 seekers that chase enemies within 6 m; each seeker hits twice on impact, then explodes. Its interactions in this build come from Shinobu's Vow."
    source: compendium/2026-10-09/Arc#36
    inert: "Damage only: its hits and kills are the grenade step itself, and what reacts to them (Shinobu's Vow) has the rules."
    rules: []
    passives: []

  - id: combination-blow
    name: Combination Blow
    kind: melee
    affinity: arc
    class: hunter
    # The manifest's hash (light.gg, 2026-10-10): what a DIM loadout names (the owner's Arc
    # loadout plugs it).
    hash: 2716335211
    ability: { kind: melee, charges: 1, chunkScalar: 1, baseCooldown: 58.1 }
    description: "Arc punch. A melee kill grants 100% class ability energy, heals you and adds a Combination Blow stack (20 s, up to x3). Melee damage +133% / +266% / +400% [PvP 23% / 51.3% / 86%] at x1 / x2 / x3; the kill heal drops from 100 HP to 80 / 60 / 40 HP as stacks build."
    source: compendium/2026-10-09/Arc#41
    rules:
      # 100% is a base chunk gain: the Compendium adds that 70 Class is needed for it to refill
      # Gambler's Dodge completely (the build has 104). The heal is in HP and depends on the stacks
      # (100, then 80 / 60 / 40 HP): restoreHealth amounts are percentages and an amount can't vary
      # with the stack level, so it stays "?".
      - on: { kill: { via: melee } }
        then:
          - { applyBuff: combination-blow }
          - { grantEnergy: { to: classAbility, amount: "100%" } }
          - { restoreHealth: { amount: "?" } }
        reason: "A Combination Blow kill gives your class ability back in full, heals you and stacks its melee damage buff (up to x3)."
    passives:
      # +133% / +266% / +400% [PvP 23% / 51.3% / 86%] at x1 / x2 / x3: the bonus varies with the
      # stack level and a passive's value can't, so it stays "?".
      - effect: { modifyDamage: { against: melee, change: "?" } }
        when: [ { has: combination-blow } ]
        reason: "Each Combination Blow stack makes your melee hits much harder."
    statChecks:
      # Arc#41: 70 Class for the kill to refill Gambler's Dodge completely. Chunk gains scale with their
      # stat: 100% of the stated value at 70, more above, less below (TWID 2025-06-05; patch 9.0.0.4).
      # How much less below 70 isn't published.
      - stat: class
        below: 70
        severity: warning
        says: "With {value} Class, a Combination Blow kill gives back less than a full class ability: its 100% needs 70 Class, and below that it gives less (how much less isn't published)."

  - id: gamblers-dodge
    name: Gambler's Dodge
    kind: classAbility
    affinity: arc
    class: hunter
    # Clarity has 6 Gambler's Dodge hashes with identical text (one per subclass) and does not say
    # which is Arc; 426473317 is the most recently uploaded, so it comes first. All six are this
    # class ability, so a DIM loadout's Gambler's Dodge is recognised whichever copy it names.
    hash: [426473317, 1282157890, 2711519340, 2816982785, 3636300855, 3933525367]
    ability: { kind: classAbility, charges: 1, chunkScalar: 0.8, baseCooldown: 56 }
    description: "Ground dodge. Grants 1% [PvP 0.35%] melee energy per Melee stat point (max 100% at 100 Melee), doubled within 15 m of an enemy. No chunk or stat scalar applies to that energy."
    source: "compendium/2026-10-09/Class Abilities#5"
    rules:
      # The refund scales with the Melee stat (79 Melee near an enemy = 158%, a full charge), but a
      # rule amount cannot depend on a stat, so it is "?" rather than a build-specific number.
      - on: { abilityCast: classAbility }
        then:
          - { grantEnergy: { to: melee, amount: "?" } }
        reason: "Dodging near enemies refunds melee energy - 1% per Melee stat point, doubled within 15 m - so with enough Melee your punch comes straight back."
    passives: []
    statChecks:
      # Class Abilities#5: 1% of a melee charge per Melee point, doubled within 15 m of an enemy, so a
      # full charge needs 50 Melee near an enemy and 100 anywhere.
      - stat: melee
        below: 50
        severity: warning
        says: "With {value} Melee, a Gambler's Dodge gives back less than a full melee charge, even near an enemy: it gives 1% per Melee point, twice that within 15 m of one, so a full charge needs 50 Melee near enemies (100 anywhere)."
      - stat: melee
        from: 50
        below: 100
        severity: info
        says: "With {value} Melee, a Gambler's Dodge gives back a full melee charge only within 15 m of an enemy ({value}% of one farther away; 100 Melee for a full charge anywhere)."

  # ================================================================ aspects
  # fragmentSlots: Bungie's manifest (244213.26.06.29.2000-1-bnet.65864), each aspect plug's energy
  # capacity — the fragment slots it opens (the Compendium's column for them is empty in the snapshot).

  - id: tempest-strike
    name: Tempest Strike
    kind: aspect
    affinity: arc
    class: hunter
    hash: 4194622037
    fragmentSlots: 2
    description: "Killing Jolted enemies grants x1 Bolt Charge (does not stack with Dielectric's). Charged melee while sliding sends a 22 m Arc wave along the ground that Jolts enemies hit and grants 75% damage resistance against combatants for about 4 s. Can trigger and benefits from Combination Blow."
    source: compendium/2026-10-09/Arc#51
    rules:
      # The Compendium says this x1 does not stack with Dielectric's x1 on the same kill: with
      # Dielectric equipped, this rule gives nothing (and the build check flags it as wasted).
      - on: { kill: { via: any, targetHas: [jolt] } }
        then:
          - { applyBuff: { status: bolt-charge, stacks: 1 } }
        doesNotStackWith: [dielectric]
        reason: "Killing a jolted enemy gives you a stack of Bolt Charge."
      # The uppercut is the melee ability used while sliding (`melee:slide`, a secondary ability): only
      # its hits Jolt; a plain melee doesn't. It is still a melee, so every melee rule fires for it too
      # (Combination Blow's, as the Compendium says: it triggers its effects and gets its damage). The
      # Compendium also says it doesn't interact with Disorienting Blow — not in the rules, nothing to
      # keep apart. The damage resistance after it (75%, about 4 s) is a fact in the description; no
      # rule reacts to it.
      - on: { damage: { via: melee:slide } }
        then:
          - { debuffTarget: jolt }
        reason: "Slide into your charged melee and the Arc uppercut jolts every enemy it hits."
    passives: []

  - id: flow-state
    name: Flow State
    kind: aspect
    affinity: arc
    class: hunter
    hash: 4194622036
    fragmentSlots: 2
    description: "Killing a Jolted enemy grants Amplified. While Amplified: 200% faster base class ability regeneration, 66% [PvP 32%] damage resistance during the dodge animation, +50 Reload Speed and a 0.8x reload duration."
    source: compendium/2026-10-09/Arc#49
    rules:
      - on: { kill: { via: any, targetHas: [jolt] } }
        then:
          - { applyBuff: amplified }
        reason: "Killing a jolted enemy makes you Amplified."
    # Not expressible: the Amplified benefits. There is no passive for ability regeneration rate
    # (energy outcomes are facts, ADRs D5), resistance can't be scoped to "during the dodge
    # animation", and modifyWeaponStats has no "all weapons" archetype.
    passives: []

  - id: ascension
    name: Ascension
    kind: aspect
    affinity: arc
    class: hunter
    hash: 4194622039
    fragmentSlots: 3
    description: "While airborne with a class ability charge, [Air Move] spends the charge on an upward Arc Staff twirl: up to 181 damage and Jolt to enemies within 10 m, Amplified for you and allies within 10 m, and your dodge's effects trigger. Damage scales with Class above 100, up to +65% at 200."
    source: compendium/2026-10-09/Arc#48
    rules:
      # The air move (`class:air`, a secondary ability) spends the class ability charge, so it is a
      # class ability cast: the dodge's own effects (and every other class ability rule) fire too, as
      # the Compendium says. This rule fires only on that airborne use, never on a ground dodge. Used
      # by the skip-grenade-hunter-ascension build (the creator's alternative to Flow State).
      - on: { abilityCast: { ability: classAbility, input: air } }
        then:
          - { debuffTarget: jolt }
          - { applyBuff: amplified }
        reason: "Air-casting your class ability launches you up, jolting enemies within 10 m and making you Amplified."
    passives: []

  # ================================================================ fragments

  - id: spark-of-resistance
    name: Spark of Resistance
    kind: fragment
    affinity: arc
    class: hunter
    hash: 1727069366
    description: "Grants 25% [PvP 10%] damage resistance while within 15 m of 3+ enemies; lingers 2 s."
    source: compendium/2026-10-09/Arc#23
    rules: []
    passives:
      # Not expressible: the "3+ enemies within 15 m" condition. The target is the pack in front of
      # you (ADRs D7), so you are treated as always surrounded.
      - effect: { resistDamage: "25% [10%]" }
        reason: "When you're surrounded by three or more enemies you take 25% less damage."

  - id: spark-of-frequency
    name: Spark of Frequency
    kind: fragment
    affinity: arc
    class: hunter
    hash: 1727069361
    # The melee-hit reload buff (15 Stability, 50 Reload, 0.8x reload duration for 5.25 s) is not
    # encoded: it is not part of any loop, and it would need its own glossary buff plus an "all
    # weapons" archetype, which modifyWeaponStats doesn't have (the same gap as Flow State's).
    description: "Melee hits grant 15 Stability, 50 Reload Speed and a 0.8x reload duration for 5.25 s. While Amplified, (almost) all Bolt Charge sources grant an additional stack."
    source: compendium/2026-10-09/Arc#16
    rules: []
    passives:
      - effect: { extraStacks: { status: bolt-charge, extra: 1 } }
        when: [ { has: amplified } ]
        reason: "While you're Amplified, almost every Bolt Charge source gives you one extra stack."

  - id: spark-of-shock
    name: Spark of Shock
    kind: fragment
    affinity: arc
    class: hunter
    hash: 1727069364
    description: "Arc grenades apply Jolt on hit."
    source: compendium/2026-10-09/Arc#24
    rules:
      # "Arc grenades": an ability source can't be typed; on the Arc subclass every grenade is Arc.
      - on: { damage: { via: grenade } }
        then:
          - { debuffTarget: jolt }
        reason: "Your Arc grenades jolt everything they hit."
    passives: []

  - id: spark-of-discharge
    name: Spark of Discharge
    kind: fragment
    affinity: arc
    class: hunter
    hash: 1727069362
    description: "Collecting Ionic Traces grants a stack of Bolt Charge. Multiple Arc weapon kills spawn an Ionic Trace (progress per kill: minors 34%, elites and Guardians 67%, minibosses and bosses 100%)."
    source: compendium/2026-10-09/Arc#13
    rules:
      - on: { pickUp: ionic-trace }
        then:
          - { applyBuff: { status: bolt-charge, stacks: 1 } }
        reason: "Every Ionic Trace you collect gives you a Bolt Charge stack."
      # Progress the game doesn't show as a stacking status (about 3 minor kills per trace), so it
      # is a chance rule (ADRs D8).
      - on: { kill: { via: weapon:arc } }
        then:
          - { spawn: ionic-trace }
        chance: true
        reason: "Rack up Arc weapon kills and every few of them drop an Ionic Trace (one per boss kill)."
    passives: []

  # ================================================================ jumps
  # The Compendium has no rows for jumps; names and descriptions are Bungie's manifest's
  # (rules/manifest.yaml), and these are the Arcstrider copies' hashes.

  - id: high-jump
    name: High Jump
    kind: jump
    affinity: arc
    class: hunter
    hash: 95544330
    description: "Jump a second time in the air to climb higher."
    inert: "A jump: movement has no part in a loop."
    rules: []
    passives: []

  - id: strafe-jump
    name: Strafe Jump
    kind: jump
    affinity: arc
    class: hunter
    hash: 95544331
    description: "Jump a second time in the air with strong control over where you go."
    inert: "A jump: movement has no part in a loop."
    rules: []
    passives: []

  - id: triple-jump
    name: Triple Jump
    kind: jump
    affinity: arc
    class: hunter
    hash: 95544328
    description: "Jump a second and a third time in the air to keep control of your movement."
    inert: "A jump: movement has no part in a loop."
    rules: []
    passives: []

  - id: hunter-blink
    name: Blink
    kind: jump
    affinity: arc
    class: hunter
    hash: 95544329
    description: "Jump in the air to teleport a short distance."
    inert: "A jump: movement has no part in a loop."
    rules: []
    passives: []
