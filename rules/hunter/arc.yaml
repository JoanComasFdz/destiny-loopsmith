      - on: { kill: { via: any, targetHas: [jolt] } }
        then:
          - { spawn: ionic-trace }
        reason: "Killing a jolted enemy creates an Ionic Trace (at most one every 10 s)."
      - on: { kill: { via: keyword:bolt-charge } }
        then:
          - { spawn: ionic-trace }
        reason: "A kill with Bolt Charge's lightning strike creates an Ionic Trace (at most one every 10 s)."
