# Arc Hunter: abilities, aspects, fragments.
#
# Numbers from the Destiny Data Compendium snapshots of 2026-10-09 and 2026-10-13 (source:
# compendium/<date>/<Tab>#<row>; the elements added with the 2026-10-13 snapshot cite it). Hashes are
# Clarity 2.0625's for the elements of the 2026-10-09 snapshot unless a comment says they are the
# manifest's (Clarity has no grenade, melee or super entries); the elements of the 2026-10-13
# snapshot take the manifest's (244213.26.06.29.2000-1-bnet.65864: the Arcstrider's plugs). Ability energy amounts are base values: chunk energy
# scalars and stats are not applied, and chunkScalar / baseCooldown are facts recorded from the
# Compendium that change nothing (ADRs D5).
# Format gaps that shape these rules (see builds/skip-grenade-hunter/discrepancies.md):
#  - an ability damage source cannot name a specific ability or its damage type ("Arc grenades",
#    "Skip Grenade drones" -> `grenade`);
#  - movement qualifiers are the abilities' secondary uses only (ADRs D9): the melee while sliding
#    (`melee:slide`, Tempest Strike's uppercut) and the class ability's air move (`class:air`,
#    Ascension). A rule on the plain ability fires for its secondary uses too.
elements:
  # ================================================================ abilities

  - id: arc-staff
    name: Arc Staff
    kind: super
    affinity: arc
    class: hunter
    # The manifest's hash (244213.26.06.29.2000-1-bnet.65864: the one super of that name).
    hash: 3769507633
    # Tier 2 super, 556 s. Supers have no chunk energy scalar (Game Mechanics#12), so chunkScalar
    # stays "?" rather than a made-up 1.
    ability: { kind: super, charges: 1, chunkScalar: "?", baseCooldown: 556 }
    description: "Roaming Arc super: a staff of Arc Light with 90% [PvP 53%] damage resistance for 20 s base. Kills grant x1 Bolt Charge; guarding reflects attacks, each for x1 Bolt Charge."
    source: compendium/2026-10-09/Arc#44
    rules:
      - on: { kill: { via: super } }
        then:
          - { applyBuff: { status: bolt-charge, stacks: 1 } }
        reason: "Every Arc Staff kill gives you a stack of Bolt Charge."
      # Not expressible: x1 Bolt Charge per attack reflected while guarding (no block/reflect trigger),
      # and the Blind from the airborne heavy attack and Palm Strike (a rule can't name one of the
      # super's attacks; "super damage -> Blind" would blind on every light attack too).
    passives:
      - effect: { resistDamage: "90% [53%]" }
        when: [ { has: super } ]
        reason: "While you're in Arc Staff you take 90% less damage."

  - id: gathering-storm
    name: Gathering Storm
    kind: super
    affinity: arc
    class: hunter
    # The manifest's hash (light.gg, 2026-10-10): what a DIM loadout names (the owner's Skip Grenade
    # loadout plugs it).
    hash: 3769507632
    # Tier 3 super, 500 s. Supers have no chunk energy scalar (Game Mechanics#12), so chunkScalar
    # stays "?" rather than a made-up 1.
    ability: { kind: super, charges: 1, chunkScalar: "?", baseCooldown: 500 }
    description: "Thrown Arc super with 90% [PvP 49%] damage resistance. The staff blows up and sticks in whatever it hits: 544 [300] impact damage that jolts, and an explosion of up to 608 [?] within 10 m. 2 s later lightning strikes it for up to 1350 [500] within 10 m; 1.2 s after that it pulses 446 [60] damage within 10 m every 0.7 s for 8 s."
    source: compendium/2026-10-09/Arc#45
    rules:
      # The Jolt is the impact's. A rule can't name one part of the super, but every throw begins
      # with that impact, so any super damage jolts the pack in front of you (ADRs D7) - unlike
      # Arc Staff's Blind, which only some of its attacks apply. The explosion, the lightning strike
      # and the field are the same super action (`super:hit` / `super:kill`): their damage and
      # timing are facts in the description. The Compendium states no Bolt Charge on its kills.
      - on: { damage: { via: super } }
        then:
          - { debuffTarget: jolt }
        reason: "The thrown staff jolts what it hits on impact."
    passives:
      - effect: { resistDamage: "90% [49%]" }
        when: [ { has: super } ]
        reason: "While you're in Gathering Storm you take 90% less damage."

  - id: storms-edge
    name: Storm's Edge
    kind: super
    affinity: arc
    class: hunter
    hash: 3769507635
    # Tier 1 super, 625 s. Supers have no chunk energy scalar (Game Mechanics#12), so chunkScalar
    # stays "?". Its duration and drain per knife are "?" in the Compendium too.
    ability: { kind: super, charges: 1, chunkScalar: "?", baseCooldown: 625 }
    description: "Thrown Arc super with 90% [PvP 45%] damage resistance: up to 3 homing knives per cast. Each one hits for 90 impact and up to 171 damage within 3 m, then you teleport to it and spin, hitting twice for 1440 within 6 m."
    source: compendium/2026-10-13/Arc#46
    # Not expressible: the teleport (movement has no part in a loop). The Compendium states no Bolt
    # Charge, Jolt or Blind for it. Its damage resistance holds while you're in it (ADRs D29).
    rules: []
    passives:
      - effect: { resistDamage: "90% [45%]" }
        when: [ { has: super } ]
        reason: "While you're in Storm's Edge you take 90% less damage."

  - id: skip-grenade
    name: Skip Grenade
    kind: grenade
    affinity: arc
    class: hunter
    # The manifest's hash (light.gg, 2026-10-10): what a DIM loadout names.
    hash: 146194908
    ability: { kind: grenade, charges: 1, chunkScalar: 0.75, baseCooldown: 151.5 }
    description: "Arc grenade that splits on impact into 4 seekers that chase enemies within 6 m; each seeker hits twice on impact, then explodes. Its interactions in this build come from Shinobu's Vow."
    source: compendium/2026-10-09/Arc#36
    inert: "Damage only: its hits and kills are the grenade step itself, and what reacts to them (Shinobu's Vow) has the rules."
    rules: []
    passives: []

  - id: arcbolt-grenade
    name: Arcbolt Grenade
    kind: grenade
    affinity: arc
    class: hunter
    hash: 1582574009
    ability: { kind: grenade, charges: 1, chunkScalar: 0.75, baseCooldown: 151.5 }
    description: "Arc grenade that, 1 s after impact, sends lightning at the nearest enemy in sight within 12 m; it chains to the next enemy within 10 m, up to 4 enemies, 521 [PvP 85] damage each."
    source: compendium/2026-10-13/Arc#28
    inert: "Damage only: its hits and kills are the grenade step itself, and what reacts to grenade hits (Spark of Shock) has the rules."
    rules: []
    passives: []

  - id: flashbang-grenade
    name: Flashbang Grenade
    kind: grenade
    affinity: arc
    class: hunter
    hash: 2909720723
    ability: { kind: grenade, charges: 1, chunkScalar: 0.875, baseCooldown: 131.7 }
    description: "Arc grenade that explodes once it slows down: up to 684 [PvP 120] damage within 7.5 m, and Blind for up to 5 [3] s on enemies within 10 m. You can't blind yourself."
    source: compendium/2026-10-13/Arc#29
    rules:
      # The blind is shorter than the glossary's 10 s (Arc#7, every Blind against combatants): this
      # grenade's is "up to 5 s".
      - on: { damage: { via: grenade } }
        then:
          - { debuffTarget: { status: blind, duration: 5s } }
        reason: "Your Flashbang blinds the enemies around its explosion."
    passives: []

  - id: flux-grenade
    name: Flux Grenade
    kind: grenade
    affinity: arc
    class: hunter
    hash: 4198689901
    ability: { kind: grenade, charges: 1, chunkScalar: 0.875, baseCooldown: 105.4 }
    description: "Arc grenade that sticks to enemies or surfaces and explodes 1.7 s later: up to 901 [PvP 150] damage within 6 m, or 1500 [250] when it sticks to an enemy."
    source: compendium/2026-10-13/Arc#31
    inert: "Damage only: its hits and kills are the grenade step itself, and what reacts to grenade hits (Spark of Shock) has the rules."
    rules: []
    passives: []

  - id: lightning-grenade
    name: Lightning Grenade
    kind: grenade
    affinity: arc
    class: hunter
    hash: 2994412667
    # One charge: the Compendium gives a second only with Touch of Thunder (a Titan aspect, Arc#33).
    ability: { kind: grenade, charges: 1, chunkScalar: 0.5, baseCooldown: 219.5 }
    description: "Arc grenade that sticks to surfaces and enemies and, after 1 s, strikes a lightning bolt every 1.67 s, 4 times (5 with Spark of Magnitude): 373 [PvP 120] damage each, 1492 in all (1865 with Spark of Magnitude)."
    source: compendium/2026-10-13/Arc#32
    inert: "Damage only: its hits and kills are the grenade step itself, and what reacts to grenade hits (Spark of Shock) has the rules."
    rules: []
    passives: []

  - id: pulse-grenade
    name: Pulse Grenade
    kind: grenade
    affinity: arc
    class: hunter
    hash: 1713935764
    ability: { kind: grenade, charges: 1, chunkScalar: 0.625, baseCooldown: 175.6 }
    description: "Arc grenade that bursts on impact for up to 156 [PvP 50] damage within 6 m, then pulses every 0.7 s, 5 more times (7 with Spark of Magnitude), for up to 249 [80] each: 1245 in all (1743 with Spark of Magnitude)."
    source: compendium/2026-10-13/Arc#34
    inert: "Damage only: its hits and kills are the grenade step itself, and what reacts to grenade hits (Spark of Shock) has the rules."
    rules: []
    passives: []

  - id: storm-grenade
    name: Storm Grenade
    kind: grenade
    affinity: arc
    class: hunter
    hash: 2481624867
    ability: { kind: grenade, charges: 1, chunkScalar: 0.625, baseCooldown: 175.6 }
    description: "Arc grenade that calls a lightning strike 0.85 s after impact (up to 440 [PvP 70] damage within 7 m), then a barrage of bolts in an X over 7 m 0.6 s later (up to 311 [50]); Spark of Magnitude adds a second barrage in a +. A combatant takes each barrage once: up to 751 in all (1062 with Spark of Magnitude)."
    source: compendium/2026-10-13/Arc#37
    inert: "Damage only: its hits and kills are the grenade step itself, and what reacts to grenade hits (Spark of Shock) has the rules."
    rules: []
    passives: []

  - id: combination-blow
    name: Combination Blow
    kind: melee
    affinity: arc
    class: hunter
    # The manifest's hash (light.gg, 2026-10-10): what a DIM loadout names (the owner's Arc
    # loadout plugs it).
    hash: 2716335211
    ability: { kind: melee, charges: 1, chunkScalar: 1, baseCooldown: 58.1 }
    description: "Arc punch. A melee kill grants 100% class ability energy, heals you and adds a Combination Blow stack (20 s, up to x3). Melee damage +133% / +266% / +400% [PvP 23% / 51.3% / 86%] at x1 / x2 / x3; the kill heal drops from 100 HP to 80 / 60 / 40 HP as stacks build."
    source: compendium/2026-10-09/Arc#41
    rules:
      # 100% is a base chunk gain: the Compendium adds that 70 Class is needed for it to refill
      # Gambler's Dodge completely (the build has 104). The heal is in HP and depends on the stacks
      # (100, then 80 / 60 / 40 HP): restoreHealth amounts are percentages and an amount can't vary
      # with the stack level, so it stays "?".
      - on: { kill: { via: melee } }
        then:
          - { applyBuff: combination-blow }
          - { grantEnergy: { to: classAbility, amount: "100%" } }
          - { restoreHealth: { amount: "?" } }
        reason: "A Combination Blow kill gives your class ability back in full, heals you and stacks its melee damage buff (up to x3)."
    passives:
      # +133% / +266% / +400% [PvP 23% / 51.3% / 86%] at x1 / x2 / x3: the bonus varies with the
      # stack level and a passive's value can't, so it stays "?".
      - effect: { modifyDamage: { against: melee, change: "?" } }
        when: [ { has: combination-blow } ]
        reason: "Each Combination Blow stack makes your melee hits much harder."
    statChecks:
      # Arc#41: 70 Class for the kill to refill Gambler's Dodge completely. Chunk gains scale with their
      # stat: 100% of the stated value at 70, more above, less below (TWID 2025-06-05; patch 9.0.0.4).
      # How much less below 70 isn't published.
      - stat: class
        below: 70
        severity: warning
        says: "With {value} Class, a Combination Blow kill gives back less than a full class ability: its 100% needs 70 Class, and below that it gives less (how much less isn't published)."

  - id: disorienting-blow
    name: Disorienting Blow
    kind: melee
    affinity: arc
    class: hunter
    hash: 2716335210
    ability: { kind: melee, charges: 1, chunkScalar: 0.9, baseCooldown: 118.8 }
    description: "Arc palm strike: 162 impact and up to 976 damage within 7 m. A hit blinds enemies within 9.6 m for 8.5 s and gives you Amplified and x2 Bolt Charge."
    source: compendium/2026-10-13/Arc#42
    rules:
      # The plain press only (`melee:press`): Tempest Strike's sliding uppercut is the melee too, but
      # the Compendium says it doesn't interact with Disorienting Blow (Arc#51).
      - on: { damage: { via: melee:press } }
        then:
          - { debuffTarget: { status: blind, duration: 8.5s } }
          - { applyBuff: amplified }
          - { applyBuff: { status: bolt-charge, stacks: 2 } }
        reason: "Every Disorienting Blow hit blinds the enemies around it, makes you Amplified and gives you two Bolt Charge stacks."
    passives: []

  - id: gamblers-dodge
    name: Gambler's Dodge
    kind: classAbility
    affinity: arc
    class: hunter
    # Clarity has 6 Gambler's Dodge hashes with identical text (one per subclass) and does not say
    # which is Arc; 426473317 is the most recently uploaded, so it comes first. All six are this
    # class ability, so a DIM loadout's Gambler's Dodge is recognised whichever copy it names.
    hash: [426473317, 1282157890, 2711519340, 2816982785, 3636300855, 3933525367]
    ability: { kind: classAbility, charges: 1, chunkScalar: 0.8, baseCooldown: 56 }
    description: "Ground dodge. Grants 1% [PvP 0.35%] melee energy per Melee stat point (max 100% at 100 Melee), doubled within 15 m of an enemy. No chunk or stat scalar applies to that energy."
    source: "compendium/2026-10-09/Class Abilities#5"
    rules:
      # The refund scales with the Melee stat (79 Melee near an enemy = 158%, a full charge), but a
      # rule amount cannot depend on a stat, so it is "?" rather than a build-specific number.
      - on: { abilityCast: classAbility }
        then:
          - { grantEnergy: { to: melee, amount: "?" } }
        reason: "Dodging near enemies refunds melee energy - 1% per Melee stat point, doubled within 15 m - so with enough Melee your punch comes straight back."
    passives: []
    statChecks:
      # Class Abilities#5: 1% of a melee charge per Melee point, doubled within 15 m of an enemy, so a
      # full charge needs 50 Melee near an enemy and 100 anywhere.
      - stat: melee
        below: 50
        severity: warning
        says: "With {value} Melee, a Gambler's Dodge gives back less than a full melee charge, even near an enemy: it gives 1% per Melee point, twice that within 15 m of one, so a full charge needs 50 Melee near enemies (100 anywhere)."
      - stat: melee
        from: 50
        below: 100
        severity: info
        says: "With {value} Melee, a Gambler's Dodge gives back a full melee charge only within 15 m of an enemy ({value}% of one farther away; 100 Melee for a full charge anywhere)."

  - id: marksmans-dodge
    name: Marksman's Dodge
    kind: classAbility
    affinity: arc
    class: hunter
    # One copy per Hunter subclass, all with this text (Bungie's manifest: hunter.<subclass>.
    # class_abilities); 426473316 is the Arcstrider's. As with Gambler's Dodge, a DIM loadout's
    # Marksman's Dodge is recognised whichever copy it names.
    hash: [426473316, 1282157891, 2711519341, 2816982784, 3636300854, 3933525366]
    ability: { kind: classAbility, charges: 1, chunkScalar: 1, baseCooldown: 42 }
    description: "Evasive dodge that reloads all your weapons and picks up ammo bricks within 15 m. While dodging, combatants' projectiles stop tracking you."
    source: "compendium/2026-10-13/Class Abilities#6"
    inert: "Reloads and ammo only: Loopsmith counts neither, and the dodge itself is the class ability step, which every rule on a class ability use reacts to."
    rules: []
    passives: []

  # ================================================================ aspects
  # fragmentSlots: Bungie's manifest (244213.26.06.29.2000-1-bnet.65864), each aspect plug's energy
  # capacity — the fragment slots it opens (the Compendium's column for them is empty in the snapshot).

  - id: tempest-strike
    name: Tempest Strike
    kind: aspect
    affinity: arc
    class: hunter
    hash: 4194622037
    fragmentSlots: 2
    description: "Killing Jolted enemies grants x1 Bolt Charge (does not stack with Dielectric's). Charged melee while sliding sends a 22 m Arc wave along the ground that Jolts enemies hit and grants 75% damage resistance against combatants for about 4 s. Can trigger and benefits from Combination Blow."
    source: compendium/2026-10-09/Arc#51
    rules:
      # The Compendium says this x1 does not stack with Dielectric's x1 on the same kill: with
      # Dielectric equipped, this rule gives nothing (and the build check flags it as wasted).
      - on: { kill: { via: any, targetHas: [jolt] } }
        then:
          - { applyBuff: { status: bolt-charge, stacks: 1 } }
        doesNotStackWith: [dielectric]
        reason: "Killing a jolted enemy gives you a stack of Bolt Charge."
      # The uppercut is the melee ability used while sliding (`melee:slide`, a secondary ability): only
      # its hits Jolt; a plain melee doesn't. It is still a melee, so every melee rule fires for it too
      # (Combination Blow's, as the Compendium says: it triggers its effects and gets its damage). The
      # Compendium also says it doesn't interact with Disorienting Blow — not in the rules, nothing to
      # keep apart. The damage resistance after it (75%, about 4 s) is a fact in the description; no
      # rule reacts to it.
      - on: { damage: { via: melee:slide } }
        then:
          - { debuffTarget: jolt }
        reason: "Slide into your charged melee and the Arc uppercut jolts every enemy it hits."
    passives: []

  - id: flow-state
    name: Flow State
    kind: aspect
    affinity: arc
    class: hunter
    hash: 4194622036
    fragmentSlots: 2
    description: "Killing a Jolted enemy grants Amplified. While Amplified: 200% faster base class ability regeneration, 66% [PvP 32%] damage resistance during the dodge animation, +50 Reload Speed and a 0.8x reload duration."
    source: compendium/2026-10-09/Arc#49
    rules:
      - on: { kill: { via: any, targetHas: [jolt] } }
        then:
          - { applyBuff: amplified }
        reason: "Killing a jolted enemy makes you Amplified."
    # The dodge's resistance holds at the end of a class ability step (`class`, and Ascension's
    # `class:air`, which sets off the dodge's effects: Arc#48) while you're Amplified. Not
    # expressible: the other Amplified benefits. There is no passive for ability regeneration rate
    # (energy outcomes are facts, ADRs D5), and modifyWeaponStats has no "all weapons" archetype.
    passives:
      - effect: { resistDamage: "66% [32%]" }
        when: [ { has: amplified }, { during: classAbility } ]
        reason: "While you're Amplified you take 66% less damage during your dodge."

  - id: ascension
    name: Ascension
    kind: aspect
    affinity: arc
    class: hunter
    hash: 4194622039
    fragmentSlots: 3
    description: "While airborne with a class ability charge, [Air Move] spends the charge on an upward Arc Staff twirl: up to 181 damage and Jolt to enemies within 10 m, Amplified for you and allies within 10 m, and your dodge's effects trigger. Damage scales with Class above 100, up to +65% at 200."
    source: compendium/2026-10-09/Arc#48
    rules:
      # The air move (`class:air`, a secondary ability) spends the class ability charge, so it is a
      # class ability cast: the dodge's own effects (and every other class ability rule) fire too, as
      # the Compendium says. This rule fires only on that airborne use, never on a ground dodge. Used
      # by the skip-grenade-hunter-ascension build (the creator's alternative to Flow State).
      - on: { abilityCast: { ability: classAbility, input: air } }
        then:
          - { debuffTarget: jolt }
          - { applyBuff: amplified }
        reason: "Air-casting your class ability launches you up, jolting enemies within 10 m and making you Amplified."
    passives: []

  - id: lethal-current
    name: Lethal Current
    kind: aspect
    affinity: arc
    class: hunter
    hash: 4194622038
    fragmentSlots: 2
    description: "Your direct melee hits blind jolted enemies. Using your class ability extends your melee lunge to 7 m, and your next melee or Tempest Strike hit within 10 s jolts the enemy and sets off an aftershock (195 damage within 6 m)."
    source: compendium/2026-10-13/Arc#50
    rules:
      # "Direct" melee hits: the plain press (`melee:press`), not Tempest Strike's ground wave.
      - on: { damage: { via: melee:press, targetHas: [jolt] } }
        then:
          - { debuffTarget: blind }
        reason: "Punching a jolted enemy blinds it."
      # Every class ability use arms it (Ascension's air move is one too); the longer lunge is a fact
      # in the description.
      - on: { abilityCast: classAbility }
        then:
          - { applyBuff: lethal-current }
        reason: "Using your class ability arms your next melee hit."
      # "The next Melee/Tempest Strike hit": any melee use, the sliding uppercut too. The aftershock is
      # its own strike (Arc damage from the aspect), so it is a keyword strike, not a second melee hit.
      - on: { damage: { via: melee } }
        when: [ { has: lethal-current } ]
        then:
          - { removeBuff: lethal-current }
          - { debuffTarget: jolt }
          - { strikeTarget: { via: lethal-current, hit: damage } }
        reason: "Your armed melee hit jolts the enemy and sets off a damaging aftershock around it."
    passives: []

  # ================================================================ fragments

  - id: spark-of-amplitude
    name: Spark of Amplitude
    kind: fragment
    affinity: arc
    class: hunter
    hash: 3277705906
    description: "While Amplified, 2 kills within 4 s of each other create an Orb of Power (2.5% Super energy), then 10 s of cooldown during which kills don't count. The kill that makes you Amplified counts."
    source: compendium/2026-10-13/Arc#10
    rules:
      # Two kills within 4 s: progress the game doesn't show as a stacking status, so a chance rule
      # (ADRs D8), like Spark of Discharge's counter.
      - on: { kill: { via: any } }
        when: [ { has: amplified } ]
        then:
          - { spawn: orb-of-power }
        chance: true
        reason: "While you're Amplified, two quick kills drop an Orb of Power (then 10 s before the next)."
    passives: []

  - id: spark-of-beacons
    name: Spark of Beacons
    kind: fragment
    affinity: arc
    class: hunter
    hash: 1727069367
    description: "While Amplified, kills with Special or Heavy ammo Arc weapons set off a blinding blast: Blind on enemies within 7.5 m."
    source: compendium/2026-10-13/Arc#11
    rules:
      # A damage source can't name a weapon's ammo type, so this fires on every Arc weapon kill and
      # is marked chance: a Primary weapon's kill doesn't set it off in the game.
      - on: { kill: { via: weapon:arc } }
        when: [ { has: amplified } ]
        then:
          - { debuffTarget: blind }
        chance: true
        reason: "While you're Amplified, a Special or Heavy Arc weapon kill blinds the enemies around it."
    passives: []

  - id: spark-of-brilliance
    name: Spark of Brilliance
    kind: fragment
    affinity: arc
    class: hunter
    hash: 3277705905
    description: "Precision kills on blinded enemies set off a blinding blast: Blind on enemies within 7.5 m."
    source: compendium/2026-10-13/Arc#12
    rules:
      # Loopsmith doesn't tell precision kills from body kills, so the rule is marked chance.
      - on: { kill: { via: any, targetHas: [blind] } }
        then:
          - { debuffTarget: blind }
        chance: true
        reason: "A precision kill on a blinded enemy blinds the enemies around it."
    passives: []

  - id: spark-of-feedback
    name: Spark of Feedback
    kind: fragment
    affinity: arc
    class: hunter
    hash: 3277705907
    description: "Being hit by a melee attack gives your next melee hit within 5 s +100% damage [PvP 50%, 15% with Knockout]; not refreshed while active."
    source: compendium/2026-10-13/Arc#14
    inert: "Being hit by a melee attack is no step in Loopsmith (it doesn't model the damage you take), so no loop sets it off."
    rules: []
    passives: []

  - id: spark-of-focus
    name: Spark of Focus
    kind: fragment
    affinity: arc
    class: hunter
    hash: 1727069360
    description: "After 1.25 s of sprinting at 5 m/s or more, your class ability regenerates 150% [PvP 75%] faster, until it has a charge ready."
    source: compendium/2026-10-13/Arc#15
    inert: "Sprinting is no step in Loopsmith, and a faster regeneration is a rate, which a loop doesn't count."
    rules: []
    passives: []

  - id: spark-of-haste
    name: Spark of Haste
    kind: fragment
    affinity: arc
    class: hunter
    hash: 3478354817
    description: "After 1.25 s of sprinting at 5 m/s or more, +50 Health stat while you keep sprinting."
    source: compendium/2026-10-13/Arc#17
    inert: "Sprinting is no step in Loopsmith, and the Health it raises only changes the damage you can take, which Loopsmith doesn't model."
    rules: []
    passives: []

  - id: spark-of-instinct
    name: Spark of Instinct
    kind: fragment
    affinity: arc
    class: hunter
    hash: 3478354816
