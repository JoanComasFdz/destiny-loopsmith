# Hunter: exotic armor.
#
# Where a rule file sits, and each rule's id: docs/rule-format.md, "Files" (ADRs D40).
elements:
  - id: shinobus-vow
    name: Shinobu's Vow
    kind: exoticArmor
    affinity: arc
    class: hunter
    # The armor item's manifest hashes: light.gg (2026-10-10) lists three versions of Shinobu's Vow.
    # 1053737370 is the Armor 2.0 one, which light.gg flags as a duplicate in the Bungie API (it is
    # also the item Clarity's "New Tricks" entry, 3907299874, names); the owner's DIM loadout equips
    # 1611241895. A DIM loadout's Shinobu's Vow is recognised whichever copy it names.
    hash: [1053737370, 1611241895, 1786557270]
    description: "New Tricks: an extra Skip Grenade charge; seekers chase enemies much more aggressively. Every Skip Grenade hit (each impact and explosion counts) grants 4.2% [PvP 1.4%] grenade energy and x1 Bolt Charge. Gaining Bolt Charge gives ?% Skip Grenade energy per stack. Upon reaching x10 Bolt Charge: ~40% grenade energy, ? HP to you and allies within ? m, and the next Skip Grenade is enhanced (one extra bounce, 5 extra seekers on the 1st and 2nd bounce). Per Clarity the energy ignores chunk energy scalars."
    source: "compendium/2026-10-09/Exotic Armors#78"
    rules:
      # Not expressible: "Skip Grenade hits" (a rule can't name one ability), so any grenade damage
      # counts. A seeker hits up to 3 times (2 impacts + 1 explosion, Arc#36), a fact in the
      # description: a grenade action hits each enemy once, and that hit sets off the same rules.
      - id: shinobus-vow-1
        on: { damage: { via: grenade } }
        then:
          - { applyBuff: { status: bolt-charge, stacks: 1 } }
          - { grantEnergy: { to: grenade, amount: "4.2% [1.4%]" } }
        reason: "Every Skip Grenade hit gives you a Bolt Charge stack and a little grenade energy back."
      # The source gives it per stack gained ("?%" in both Compendium and Clarity): a fact shown on
      # every Bolt Charge gain.
      - id: shinobus-vow-2
        on: { buffGained: bolt-charge }
        then:
          - { grantEnergy: { to: grenade, amount: "?" } }
        reason: "Gaining Bolt Charge from any source feeds energy back into your Skip Grenade."
      # The Compendium writes "~40%" (Clarity "40?%"): approximate either way.
      - id: shinobus-vow-3
        on: { stacksMaxed: bolt-charge }
        then:
          - { applyBuff: new-tricks }
          - { grantEnergy: { to: grenade, amount: "~40%" } }
          - { restoreHealth: { amount: "?", allies: true } }
        reason: "Hitting 10 Bolt Charge refunds a big chunk of grenade energy, heals you and nearby allies, and readies an enhanced Skip Grenade (New Tricks)."
      - id: shinobus-vow-4
        on: { abilityCast: grenade }
        when: [ { has: new-tricks } ]
        then:
          - { removeBuff: new-tricks }
        reason: "Throwing the enhanced Skip Grenade spends New Tricks."
    passives:
      - id: shinobus-vow-5
        effect: { extraCharges: { ability: grenade, extra: 1 } }
        reason: "Shinobu's Vow gives Skip Grenade a second charge."

  - id: mechaneers-tricksleeves
    name: Mechaneer's Tricksleeves
    kind: exoticArmor
    affinity: neutral
    class: hunter
    # The gauntlets' manifest hashes: 2574019120 is the collectible one; the manifest has three more
    # copies of the item under the same name, so a DIM loadout's Tricksleeves is recognised whichever
    # it names. Bungie calls the exotic perk Spring-Loaded Mounting (481860151).
    hash: [2574019120, 1734144409, 3969198262, 4284305243]
    description: "Spring-Loaded Mounting: Sidearms get +50 Airborne Effectiveness, +100 Handling and +100 Reload Speed. Readying a Sidearm while at critical health refills its ammo and gives a damage buff: 100% [PvP 10%] more Sidearm damage, and Sidearm kills refill the magazine. The buff has no timer while you are at critical health and lasts 5 s once your shields recover; each Sidearm kill refreshes it by 3 s."
    source: "compendium/2026-10-19/Exotic Armors#52"
    rules:
      # The ammo refill on readying and the magazine refill on a kill are facts in the description:
      # a refill is no reload, and sets off no on-reload perk (compendium/2026-10-19/Weapon Perks#250,
      # "Reload Perk Notes"; ADRs D42), and `refillWeapon` names this weapon or a slot, not "the
      # sidearm readied". Bungie's perk text says the swap "reloads" the Sidearm.
      # The buff outlasts critical health by 5 s and no time is counted (ADRs D1): it doesn't end
      # with critical health, the player declares its end (`end:spring-loaded-mounting`).
      - id: mechaneers-tricksleeves-2
        on: { ready: { via: weapon:sidearm } }
        when: [ { has: critical-health } ]
        then:
          - { applyBuff: spring-loaded-mounting }
        reason: "Swapping to a sidearm while critically wounded refills it and powers up your sidearm damage."
    passives:
      - id: mechaneers-tricksleeves-1
        effect:
          modifyWeaponStats:
            archetypes: [sidearm]
            changes:
              - { stat: airborne-effectiveness, change: "+50" }
              - { stat: handling, change: "+100" }
              - { stat: reload-speed, change: "+100" }
        reason: "Your sidearms are steadier in the air, ready faster and reload faster."
      - id: mechaneers-tricksleeves-3
        effect: { modifyDamage: { against: weapon:sidearm, change: "+100% [10%]" } }
        when: [ { has: spring-loaded-mounting } ]
        reason: "While Spring-Loaded Mounting is up, your sidearms hit twice as hard."
