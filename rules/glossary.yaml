# Keyword vocabulary and subclass items (docs/rule-format.md § Glossary).
#
# Semantics: maxStacks (>= 2) means the status stacks, up to that cap (a fact shown with the buff,
# "up to x10"), and can be declared at max (`max:<status>`, ADRs D3). A status without it doesn't
# stack: applying it while it is active changes nothing. The stacking statuses are bolt-charge,
# armor-charge, combination-blow and slice. A duration is a fact shown on the outcome, given only
# where a source states it. A status ends when a rule removes or consumes it, or when the player
# declares it ended (`end:<status>`).
# Sources: the Destiny Data Compendium snapshot of 2026-10-09 ("compendium/2026-10-09/<Tab>#<row>"
# below; it has glossary rows for the Arc and Strand keywords) and Clarity 2.0625, which has no
# status entries and only mentions them inside other entries.

statuses:
  # ---------------------------------------------------------------- buffs (on the player)

  # maxStacks 10: compendium/2026-10-09/Arc#5 (10 stacks are needed to discharge). Agrees with the
  # creator ("those 10 stacks of bolt charge") and with Clarity's New Tricks trigger ("x10").
  # No duration is stated.
  - { id: bolt-charge, name: Bolt Charge, kind: buff, affinity: arc, maxStacks: 10 }

  # 15 s: compendium/2026-10-09/Arc#4 (the intrinsic Arc buff; Flashover's Artifact Perks#43 also
  # says 15 s). The artifact perk Amped Up (Artifact Perks#109, not in the skip-grenade build) raises
  # it to 20 s. Amplified's own effects (Arc#4) have no keyword element: the intrinsic Arc-kill counter
  # that grants it (25% minor, 50% elite or Guardian, 100% miniboss and up, kills within 6 s of each
  # other) is progress the game doesn't show as a stacking status, so it could only be a chance rule
  # (ADRs D8), and a keyword applies to every build, not just Arc; +50 Mobility, longer slides and
  # Speed Booster need movement; +40 Handling needs an "all weapons" archetype; the 15% damage
  # resistance against combatants is expressible but changes no loop. In this build Flow State
  # grants Amplified on every jolted kill anyway.
  - { id: amplified, name: Amplified, kind: buff, affinity: arc, duration: 15s }

  # Base maximum 3: compendium/2026-10-09/Game Mechanics#94 (Charged Up raises it to 4|5|6; Clarity
  # 2577472338 agrees). Its decay (1 stack every 10 s while a passive mod is equipped, same row) is
  # a fact of the game: Armor Charge ends when a rule consumes it (Grenade Kickstart) or the player
  # declares it ended.
  - { id: armor-charge, name: Armor Charge, kind: buff, affinity: neutral, maxStacks: 3 }

  # Duration 10 s: compendium/2026-10-09/Strand#7 (generic Woven Mail; To Shreds' Artifact Perks#51
  # also says 10 s). Clarity mentions other durations for other sources (5 s, 2-20 s); a rule can
  # override it. Its 45% [25%] damage resistance and its removal on a Super cast are the woven-mail
  # keyword element (keywords/strand.yaml).
  - { id: woven-mail, name: Woven Mail, kind: buff, affinity: strand, duration: 10s }

  # Duration depends on the source (Clarity: 11 s Facet of Bravery, 8 s Thread of Propagation;
  # Compendium Artifact Perks#45: 14 s from Unraveling Orbs, set in that rule). No generic duration.
  - { id: unraveling-rounds, name: Unraveling Rounds, kind: buff, affinity: strand }

  # Combination Blow melee damage stacks: up to 3, each lasting 20 s (compendium/2026-10-09/Arc#41;
  # the creator also says "times three stacks"). Clarity has no melee-ability entries.
  - { id: combination-blow, name: Combination Blow, kind: buff, affinity: arc, maxStacks: 3, duration: 20s }

  # Shinobu's Vow: the next thrown Skip Grenade is enhanced. Lasts until that grenade is thrown.
  - { id: new-tricks, name: New Tricks, kind: buff, affinity: arc }

  # Slice weapon perk window: 8 s (9 s enhanced), ends after 5 severs. compendium/2026-10-09/
  # Weapon Perks#198 (5 severing hits, each within 8 s of the last); Clarity 923806249 agrees (the
  # buff ends at 5 stacks). In weapons/perks.yaml the player declares the 5 hits done (`max:slice`).
  - { id: slice, name: Slice, kind: buff, affinity: strand, maxStacks: 5, duration: 8s }

  # Reaper armed: the next weapon kill within 10 s of a class ability use (compendium/2026-10-09/
  # Armor Mods#14; Clarity 40751621 agrees).
  - { id: reaper, name: Reaper, kind: buff, affinity: neutral, duration: 10s }

  # ---------------------------------------------------------------- debuffs (on the target)
  # Durations against combatants (PvE) from the Compendium 2026-10-09:
  #  - jolt 10 s [PvP 5 s]: Arc#8 (refreshed by re-jolting);
  #  - sever 10 s [5 s] (+5 s with Thread of Continuity): Strand#8. The note's "5s sever" is not
  #    encoded: 5 s is only the PvP figure, and the note may mean the Slice window (8 s);
  #  - unravel: no generic duration (Strand#10: it depends on the source);
  #  - blind 10 s against combatants (3 s on Guardians): Arc#7.
  # Not encoded: what these debuffs do to the enemy (Sever cuts its damage by 40% [15%], Strand#8;
  # Blind stops it attacking, Arc#7), since the rules describe no enemy behaviour; and Unravel's
  # threads (Strand#10: after taking 40 damage an unraveled enemy sends out 3 threads of 26 [4]
  # damage that spread Unravel, 1.2 s cooldown): no rule reacts to thread damage and the pack they
  # would spread to is the one already unraveled (ADRs D7), so they would only add trace lines.
  - { id: jolt, name: Jolt, kind: debuff, affinity: arc, duration: 10s }
  - { id: sever, name: Sever, kind: debuff, affinity: strand, duration: 10s }
  - { id: unravel, name: Unravel, kind: debuff, affinity: strand }
  - { id: blind, name: Blind, kind: debuff, affinity: arc, duration: 10s }

pickups:
  # Ionic Traces home in on you at 6 m/s (compendium/2026-10-09/Arc#6); the creator agrees:
  # "you don't need to go pick them up ... They literally come to you."
  - { id: ionic-trace, name: Ionic Trace, affinity: arc, collectsAutomatically: true }
  - { id: orb-of-power, name: Orb of Power, affinity: neutral, collectsAutomatically: false }

summons:
  - { id: threadling, name: Threadling, damageType: strand }

# ---------------------------------------------------------------- subclass items
# The manifest hash of each subclass item, so a DIM loadout's subclass is recognised (ADRs D27,
# docs/loop-format.md "Starting from a DIM link"). The nine Light subclasses, as DIM's own source
# lists them (src/app/loadout-drawer/loadout-utils.ts, `oldToNewItems`, DIM commit d7c02e5); the
# owner's DIM loadout names Arcstrider as 2328211300. Stasis, Strand and Prismatic wait on the
# manifest join (requirements FR-13).
subclasses:
  - { class: hunter,  subclass: arc,   name: Arcstrider,   hash: 2328211300 }
  - { class: titan,   subclass: arc,   name: Striker,      hash: 2932390016 }
  - { class: warlock, subclass: arc,   name: Stormcaller,  hash: 3168997075 }
  - { class: hunter,  subclass: solar, name: Gunslinger,   hash: 2240888816 }
  - { class: titan,   subclass: solar, name: Sunbreaker,   hash: 2550323932 }
  - { class: warlock, subclass: solar, name: Dawnblade,    hash: 3941205951 }
  - { class: hunter,  subclass: void,  name: Nightstalker, hash: 2453351420 }
  - { class: titan,   subclass: void,  name: Sentinel,     hash: 2842471112 }
  - { class: warlock, subclass: void,  name: Voidwalker,   hash: 2849050827 }
