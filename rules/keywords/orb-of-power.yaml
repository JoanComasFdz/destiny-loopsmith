# Orb of Power: base pickup behaviour, active in every build (kind: keyword).
elements:
  - id: orb-of-power
    name: Orb of Power
    kind: keyword
    affinity: neutral
    # Super energy per orb depends on what spawned it (Compendium Game Mechanics#229-238: Reaper
    # 0.8%|1.1%|1.25%|1.5% with 1|2|3|4 mods, Siphons 2.5%|3.75%|4.4% with 1|2|3 mods; Weapon
    # Perks#22: Attrition Orbs 0.87%); a pickup carries no per-source value, so the amount is "?".
    # Armor Charge on pickup: Game Mechanics#94 - any Orb of Power gives x1 Armor Charge while any
    # Armor Charge mod is equipped (this build has Grenade Kickstart and Elemental Charge). A rule
    # can't check which mods are equipped, so it is unconditional.
    # Not encoded: the health an orb restores (0.7 HP per Health stat point, Game Mechanics#119):
    # it depends on a stat and is in HP.
    description: "Picking up an Orb of Power grants Super energy (amount depends on what spawned it) and, with any Armor Charge mod equipped, 1 stack of Armor Charge."
    source: "compendium/2026-10-09/Game Mechanics#94"
    rules:
      - on: { pickUp: orb-of-power }
        then:
          - { applyBuff: { status: armor-charge, stacks: 1 } }
          - { grantEnergy: { to: super, amount: "?" } }
        reason: "Grabbing an Orb of Power charges your Super a little and gives you an Armor Charge."
    passives: []
