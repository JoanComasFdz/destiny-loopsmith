# Weapon perks (traits). A perk's rules say "this weapon" (`weapon:this`): the build check binds it to the weapon that
# rolls the perk (docs/rule-format.md, "This weapon").
elements:
  - id: slice
    name: Slice
    kind: weaponPerk
    affinity: strand
    hash: 923806249
    description: "Using your class ability (even with the weapon stowed) arms Slice: your next 5 hits on enemies that aren't Severed yet Sever them, as long as each comes within 8 s (9 s enhanced) of the previous one. A severing hit that kills doesn't count."
    source: "compendium/2026-10-09/Weapon Perks#198"
    rules:
      # Every class ability use arms Slice for the next 5 hits; the player declares max:slice when
      # they are done (ADRs D3).
      - on: { abilityCast: classAbility }
        then:
          - { applyBuff: { status: slice, stacks: 1, duration: 8s } }
        reason: "Dodging arms Slice, even while the weapon is stowed."
      # Not expressible: "non-Severed targets only" (no target-lacks guard).
      - on: { damage: { via: "weapon:this" } }
        when: [ { has: slice } ]
        then:
          - { debuffTarget: sever }
          - { applyBuff: { status: slice, stacks: 1, duration: 8s } }
        reason: "While Slice is up, every enemy you hit with this weapon gets severed."
      - on: { stacksMaxed: slice }
        then:
          - { removeBuff: slice }
        reason: "Once its 5 hits are done (Slice at max), Slice ends."
    passives: []
    # The enhanced trait (a weapon's enhanced or crafted copy rolls it): its own plug, Slice with the window the
    # Compendium row gives as its ↑ figure, 9 s instead of 8 s. Same rules otherwise.
    enhanced:
      hash: 3422796781
      values: { 8s: 9s }
      description: "The enhanced Slice: as Slice, with a 9 s window between hits instead of 8 s."

  # Clarity: a WEAPON TRAIT (base + enhanced), not an armor mod. The note credits it on strand
  # weapon kills; the build puts it on Festival Flight.
  - id: attrition-orbs
    name: Attrition Orbs
    kind: weaponPerk
    affinity: neutral
    hash: 243981275
    description: "Scoring a magazine-based number of hits, each within 5 s of the last, makes the next hit spawn an Orb of Power (0.87% super energy, 1.1% enhanced; 0.5 s cooldown). Hits needed: 55.55% of the magazine + 1, rounded down (Grenade Launchers 3, Rocket Launchers 2, Bows 4, Swords 5). Counter persists through stow."
    # Clarity 243981275 gives its own hit table (heavy GLs 3, wave-frame GLs 4); the Compendium's
    # is used.
    source: "compendium/2026-10-09/Weapon Perks#22"
    rules:
      # Hit-count based, not kill based: hits kept up on one enemy, which a hit step stands for, so
      # it drops the orb for sure there and never on a kill step's killing blow (ADRs D34).
      - on: { damage: { via: "weapon:this", sustained: true } }
        then:
          - { spawn: orb-of-power }
        reason: "Keep landing hits with this weapon and every few hits it drops an Orb of Power."
    passives: []
    # The enhanced trait: the same hits make the orb, which gives 1.1% Super energy (the row's ↑ figure) instead of
    # 0.87%. The orb's energy isn't a rule here, so the rules are Attrition Orbs'.
    enhanced:
      hash: 984655331
      description: "The enhanced Attrition Orbs: as Attrition Orbs, and the Orb of Power it makes gives 1.1% Super energy instead of 0.87%."

  # A generic trait: Thunderlord's second (fixed) column in the manifest excerpt, and No Time to
  # Explain also lists it (compendium/2026-10-09/Exotic Weapons#36).
  - id: feeding-frenzy
    name: Feeding Frenzy
    kind: weaponPerk
    affinity: neutral
    hash: 2779035018
    description: "Each kill with the weapon adds a reload buff stack (up to x5, 3.5 s, kept through stow): +8 / +50 / +60 / +75 / +100 Reload Speed and a 0.975x / 0.9x / 0.87x / 0.84x / 0.8x reload duration at x1 to x5."
    source: "compendium/2026-10-09/Weapon Perks#92"
    # Not expressible: the reload buff needs a glossary buff for Feeding Frenzy (stacks, up to x5,
    # 3.5 s; not in the glossary), and its bonus changes with the stack level, so a modifyWeaponStats
    # value could only be "?". modifyWeaponStats also can't say "this weapon", and as a generic
    # trait a `slot:` rule would be wrong for the other weapons that roll it.
    # Nothing in a loop reacts to reload speed (see Spark of Frequency's reload buff,
    # hunter/arc.yaml).
    inert: "Reload speed isn't part of a loop: Loopsmith counts no ammo and no reloads."
    rules: []
    passives: []
    # The enhanced trait: the row's ↑ figures, in the description only (the perk has no rules).
    enhanced:
      hash: 1171147302
      description: "The enhanced Feeding Frenzy: as Feeding Frenzy, with +13 / +55 / +65 / +85 / +100 Reload Speed at x1 to x5."

  # ── the perks that need several enemies in one action (ADRs D4: the player says how many one step hits or kills) ──
  # A count the game keeps over several seconds ("3 separate enemies within 3 seconds of each") fires for sure when one
  # step reaches it, and as a chance on fewer, since earlier steps' hits or kills may have counted (ADRs D31, as the
  # Siphons). `within` is the source's window, which the designer's enemy-count selector shows ("3 in 3 s · One for All").

  - id: one-for-all
    name: One for All
    kind: weaponPerk
    affinity: neutral
    hash: 4049631843
    description: "Damaging 3 separate enemies, each within 3 s of the last, gives 35% more damage for 10 s (11 s enhanced). The buff can't be refreshed until it ends, and stays through stow."
    source: "compendium/2026-10-14/Weapon Perks#153"
    # The damage is a fact of the step that gives the buff, as Reaper's Tithe's (a buff's own effect is in its details).
    rules:
      - on: { damage: { via: "weapon:this", atLeast: 3, within: 3s } }
        then:
          - { applyBuff: { status: one-for-all, duration: 10s } }
          - { modifyDamage: { against: "weapon:this", change: "+35%" } }
        reason: "Hitting three separate enemies with this weapon powers up its damage."
      - on: { damage: { via: "weapon:this", fewerThan: 3 } }
        then:
          - { applyBuff: { status: one-for-all, duration: 10s } }
          - { modifyDamage: { against: "weapon:this", change: "+35%" } }
        chance: true
        reason: "Fewer than three enemies in this step: the hits of the steps before may make up the three."
    passives: []
    enhanced:
      hash: 859780267
      values: { 10s: 11s }
      description: "The enhanced One for All: as One for All, with the buff lasting 11 s instead of 10 s."

  # The stats are points on this weapon's stats; the row's 5% damage falloff distance and 0.95x reload duration are in
  # the description only.
  - id: stats-for-all
    name: Stats for All
    kind: weaponPerk
    affinity: neutral
    hash: 1583705720
    description: "Damaging 3 separate enemies, each within 3 s of the last, gives +10 Range, 5% more damage falloff distance, +10 Stability, +35 Handling, +35 Reload Speed and a 0.95x reload duration for 10 s (11 s enhanced). The buff can't be refreshed until it ends, and stays through stow."
    source: "compendium/2026-10-14/Weapon Perks#206"
    rules:
      - on: { damage: { via: "weapon:this", atLeast: 3, within: 3s } }
        then:
          - { applyBuff: { status: stats-for-all, duration: 10s } }
        reason: "Hitting three separate enemies with this weapon makes it handle, reload and hold steady better."
      - on: { damage: { via: "weapon:this", fewerThan: 3 } }
        then:
          - { applyBuff: { status: stats-for-all, duration: 10s } }
        chance: true
        reason: "Fewer than three enemies in this step: the hits of the steps before may make up the three."
    passives:
      - effect:
          modifyWeaponStats:
            weapon: this
            changes:
              - { stat: range, change: "+10" }
              - { stat: stability, change: "+10" }
              - { stat: handling, change: "+35" }
              - { stat: reload-speed, change: "+35" }
        when: [ { has: stats-for-all } ]
        reason: "While Stats for All is up, this weapon's range, stability, handling and reload speed go up."
    enhanced:
      hash: 1409206216
      values: { 10s: 11s }
      description: "The enhanced Stats for All: as Stats for All, with the buff lasting 11 s instead of 10 s."

  # Kills "at once" (a 1 s grace past the 2nd), so only one step's kills count: no chance on fewer. Each count is its
  # own rule, from atLeast to fewerThan, so a step of 3 kills gives x3 and nothing else.
  - id: reapers-tithe
    name: Reaper's Tithe
    kind: weaponPerk
    affinity: neutral
    hash: 113508675
    description: "Killing several enemies at once gives Reaper's Tithe by how many: 2 → x2 (+20% weapon damage), 3 → x3 (+30%), 4 → x4 (+40%), with a 1 s grace between kills past the 2nd. It lasts 15 s (17 s enhanced), its timer starting at the next shot; more weapon kills add 6 s, up to 15 s (17 s). A larger multikill doesn't upgrade an active Reaper's Tithe."
    source: "compendium/2026-10-14/Weapon Perks#175"
    rules:
      - on: { kill: { via: "weapon:this", atLeast: 2, fewerThan: 3 } }
        then:
          - { applyBuff: { status: reapers-tithe, stacks: 2, duration: 15s } }
          - { modifyDamage: { against: "weapon:this", change: "+20%" } }
        reason: "Two enemies killed at once with this weapon: a smaller stacking damage buff."
      - on: { kill: { via: "weapon:this", atLeast: 3, fewerThan: 4 } }
        then:
          - { applyBuff: { status: reapers-tithe, stacks: 3, duration: 15s } }
          - { modifyDamage: { against: "weapon:this", change: "+30%" } }
        reason: "Three enemies killed at once with this weapon: a bigger damage buff."
      - on: { kill: { via: "weapon:this", atLeast: 4 } }
        then:
          - { applyBuff: { status: reapers-tithe, stacks: 4, duration: 15s } }
          - { modifyDamage: { against: "weapon:this", change: "+40%" } }
        reason: "Four or more enemies killed at once with this weapon: the biggest damage buff."
    passives: []
    enhanced:
      hash: 177189259
      values: { 15s: 17s }
      description: "The enhanced Reaper's Tithe: as Reaper's Tithe, lasting up to 17 s instead of 15 s."

  # "A Precision Kill OR 3 kills within 3 seconds of each": Loopsmith has no precision hits, so a step with fewer than
  # 3 kills spawns the Threadling as a chance (one of them may be a precision kill, or earlier kills count).
  - id: hatchling
    name: Hatchling
    kind: weaponPerk
    affinity: strand
    hash: 831391274
    description: "A precision kill, or 3 kills each within 3 s of the last, spawns a Threadling where the enemy died; the enhanced trait spawns a second one at a ?% chance (the Compendium's 10?%)."
    source: "compendium/2026-10-14/Weapon Perks#111"
    rules:
      - on: { kill: { via: "weapon:this", atLeast: 3, within: 3s } }
        then:
          - { summon: threadling }
        reason: "Three quick kills with this weapon hatch a Threadling."
      - on: { kill: { via: "weapon:this", fewerThan: 3 } }
        then:
          - { summon: threadling }
        chance: true
        reason: "Fewer than three kills in this step: a precision kill, or the kills of the steps before, may hatch it."
    passives: []
    # The enhanced trait's second Threadling comes at a chance the Compendium marks uncertain (10?%): one more Threadling
    # as a chance, on the same kills as the first.
    enhanced:
      hash: 102912326
      rules:
        - on: { kill: { via: "weapon:this", atLeast: 3, within: 3s } }
          then:
            - { summon: threadling }
          chance: true
          reason: "When it hatches one, the enhanced trait may hatch a second."
        - on: { kill: { via: "weapon:this", fewerThan: 3 } }
          then:
            - { summon: threadling }
          chance: true
          reason: "When it hatches one, the enhanced trait may hatch a second."
      description: "The enhanced Hatchling: as Hatchling, and a second Threadling may hatch with the first (a ?% chance)."

  # An origin trait (EDZ weapons). "A Precision Kill OR 3 Weapon Kills within 3 seconds of each", as Hatchling. The
  # Kinetic shockwave is this weapon's damage (a strike by this weapon, of Kinetic damage); its size (8 m, 9 m enhanced)
  # and damage (20 for Auto and Pulse Rifles, 23 for Snipers) are in the description.
  - id: veterans-wisdom
    name: Veteran's Wisdom
    kind: weaponPerk
    affinity: kinetic
    hash: 2897898513
    description: "A precision kill, or 3 weapon kills each within 3 s of the last, sets off a Kinetic shockwave where the enemy died: damage over 8 m (9 m enhanced) without falloff, and Exhaust for 10 s, cutting the enemies' damage by 25%."
    source: "compendium/2026-10-14/Weapon Perks#416"
    rules:
      - on: { kill: { via: "weapon:this", atLeast: 3, within: 3s } }
        then:
          - { strikeTarget: { via: "weapon:this", type: kinetic, hit: damage } }
          - { debuffTarget: { status: exhaust, duration: 10s } }
        reason: "Three quick kills with this weapon set off a shockwave that exhausts the enemies around."
      - on: { kill: { via: "weapon:this", fewerThan: 3 } }
        then:
          - { strikeTarget: { via: "weapon:this", type: kinetic, hit: damage } }
          - { debuffTarget: { status: exhaust, duration: 10s } }
        chance: true
        reason: "Fewer than three kills in this step: a precision kill, or the kills of the steps before, may set it off."
    passives: []
    enhanced:
      hash: 4225294165
      description: "The enhanced Veteran's Wisdom: as Veteran's Wisdom, with a 9 m shockwave instead of 8 m."

  # A counter of weapon kills, each within 5 s of the last: 34% per rank-and-file enemy (the pack, ADRs D7), so 3 kills
  # fill it. Its heal is 65 HP (70 enhanced).
  - id: unrelenting
    name: Unrelenting
    kind: weaponPerk
    affinity: neutral
    hash: 3108830275
    description: "Weapon kills, each within 5 s of the last, fill a counter (34% per rank-and-file enemy, 100% per elite, miniboss or boss, 67% per Guardian); at 100% it starts health regeneration and restores 65 HP (70 HP enhanced)."
    source: "compendium/2026-10-14/Weapon Perks#240"
    rules:
      - on: { kill: { via: "weapon:this", atLeast: 3, within: 5s } }
        then:
          - { restoreHealth: { hp: 65 } }
        reason: "Three quick kills with this weapon fill its counter: you start healing."
      - on: { kill: { via: "weapon:this", fewerThan: 3 } }
        then:
          - { restoreHealth: { hp: 65 } }
        chance: true
        reason: "Fewer than three kills in this step: the kills of the steps before may fill the counter."
    passives: []
    enhanced:
      hash: 855168139
      values: { 65: 70 }
      description: "The enhanced Unrelenting: as Unrelenting, restoring 70 HP instead of 65."

  # An origin trait (Episode: Echoes). A counter of weapon kills, each within 8 s of the last: 34% per rank-and-file
  # enemy, so 3 kills fill it. The explosion and the Radiolaria Pool count as this weapon's damage: two strikes by this
  # weapon, both of Arc damage (the Compendium names Arc for the pool and no type for the explosion, which the owner set to
  # Arc like the pool, PR #79). Their damage (67.5, 15 every 0.65 s) is in the description.
  - id: radiolaria-transposer
    name: Radiolaria Transposer
    kind: weaponPerk
    affinity: arc
    hash: 253121539
    description: "Weapon kills, each within 8 s of the last, fill a counter (34% per rank-and-file enemy, 100% per elite or stronger); at 100% the enemy explodes for up to 67.5 damage over 3? m and leaves a Radiolaria Pool that deals 15 Arc damage every 0.65 s, up to 3? times. Counts as weapon damage. Stowing the weapon resets the counter."
    source: "compendium/2026-10-14/Weapon Perks#393"
    rules:
      - on: { kill: { via: "weapon:this", atLeast: 3, within: 8s } }
        then:
          - { strikeTarget: { via: "weapon:this", type: arc, hit: damage } }
          - { strikeTarget: { via: "weapon:this", type: arc, hit: damage } }
        reason: "Three quick kills with this weapon make the enemy explode and leave a pool that keeps hurting the pack."
      - on: { kill: { via: "weapon:this", fewerThan: 3 } }
        then:
          - { strikeTarget: { via: "weapon:this", type: arc, hit: damage } }
          - { strikeTarget: { via: "weapon:this", type: arc, hit: damage } }
        chance: true
        reason: "Fewer than three kills in this step: the kills of the steps before may fill the counter."
    passives: []
    enhanced:
      hash: 734193227
      description: "The enhanced Radiolaria Transposer: as Radiolaria Transposer, with figures the Compendium doesn't give."
