# Luminopotent armor set (Solo/Fireteam Ops). Clarity has no armor-set entries; both bonuses are in
# the Compendium snapshot of 2026-10-09 (Armor Perks tab).
elements:
  # The Compendium names it Ionic Overclock and lists only Handling and Reload Speed, both "+?"; the
  # note's vent is not encoded (see discrepancies.md).
  - id: luminopotent-2pc
    name: Ionic Overclock
    kind: armorSetBonus
    affinity: arc
    description: "Luminopotent 2-piece bonus: while Amplified, Fusion Rifles, Linear Fusion Rifles and Heat weapons get +? Handling and +? Reload Speed."
    source: "compendium/2026-10-09/Armor Perks#57"
    rules: []
    passives:
      - effect:
          modifyWeaponStats:
            archetypes: [linear-fusion-rifle, fusion-rifle, heat-weapon]
            changes:
              - { stat: handling, change: "?" }
              - { stat: reload, change: "?" }
        when: [ { has: amplified } ]
        reason: "While you're Amplified, linear fusions, fusions and heat weapons handle and reload faster."

  # The note files this under "Amplified ->"; the bonus itself has no Amplified condition and no
  # cooldown (Compendium, and the creator found none in testing) -> encoded unconditional.
  - id: luminopotent-4pc
    name: Shock and Clear
    kind: armorSetBonus
    affinity: arc
    description: "Luminopotent 4-piece bonus: a Jolt kill or a kill of a Jolted enemy creates an Ionic Trace (no cooldown stated; none in the creator's testing)."
    source: "compendium/2026-10-09/Armor Perks#58"
    rules:
      # "with Jolt" kills are covered too: Jolt only chains off a jolted pack, and the target is
      # that pack (ADRs D7).
      - on: { kill: { via: any, targetHas: [jolt] } }
        then:
          - { spawn: ionic-trace }
        reason: "Anything that dies while jolted, or to Jolt itself, drops an Ionic Trace, with no cooldown."
    passives: []
