# Luminopotent armor set (Core portal playlist). Clarity has no armor-set entries at all.
elements:
  # User's note only ("Luminopotent Mask 2 piece bonus"); the video covers only the 4-piece and
  # gives neither the name nor the numbers of this bonus, so it is authored with "?" values.
  # The note lists it under "Amplified ->", hence the guard.
  - id: luminopotent-2pc
    name: Luminopotent 2-Piece Bonus
    kind: armorSetBonus
    affinity: arc
    description: "Per the build note: while Amplified, Linear Fusion Rifles, Fusion Rifles and Heat weapons get increased handling, reload and vent speed."
    rules: []
    passives:
      - effect:
          modifyWeaponStats:
            archetypes: [linear-fusion-rifle, fusion-rifle, heat-weapon]
            changes:
              - { stat: handling, change: "?" }
              - { stat: reload, change: "?" }
              - { stat: vent, change: "?" }
        when: [ { has: amplified } ]
        reason: "While you're Amplified, linear fusions, fusions and heat weapons handle, reload and vent faster."

  # The note files this under "Amplified ->"; the creator reads the bonus text, which has no
  # Amplified condition, and found no cooldown in testing -> encoded unconditional.
  - id: luminopotent-4pc
    name: Shock and Clear
    kind: armorSetBonus
    affinity: arc
    description: "Luminopotent 4-piece bonus: final blows with Jolt or against Jolted combatants create Ionic Traces (no cooldown in the creator's testing)."
    source:
      creator: "https://www.youtube.com/watch?v=zvd6sNS463E"
      quote: "Final blows with Jolt or against Jolted combatants create ionic traces."
    rules:
      # "with Jolt" kills are covered too: Jolt only chains off a jolted pack, and v1's target is that pack.
      - on: { kill: { via: any, targetHas: [jolt] } }
        then:
          - { spawn: ionic-trace }
        reason: "Anything that dies while jolted, or to Jolt itself, drops an Ionic Trace, with no cooldown."
    passives: []
