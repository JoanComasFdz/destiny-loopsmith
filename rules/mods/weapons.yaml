  - id: synergy
    name: Synergy
    kind: weaponMod
    affinity: neutral
    hash: 3820243349
    description: "Weapon kills fill a counter (kept through stow): 8.34% per rank-and-file kill, 16.7% elite, 34% miniboss, 50% boss, 16.7% Guardian. At 100% it spawns a pickup of the weapon's element (Arc: Ionic Trace, Solar: Firesprite, Void: Void Breach, Stasis: Stasis Shard, Strand: Tangle); a Kinetic weapon spawns an Orb of Power that grants 7.15% Super energy. It ignores the pickups' shared cooldown but starts it when it spawns one, and has its own cooldown by pickup (Ionic Trace 0 s; Firesprite, Void Breach and Stasis Shard 5 s; Tangle 12 s), during which kills don't count. Kills beyond a full counter at once don't carry over."
    source: "compendium/2026-10-13/Weapon Perks#285"
    rules:
      # Kinetic: Orb of Power.
      - on: { kill: { via: "weapon:this:kinetic", atLeast: 12 } }
        then:
          - { spawn: orb-of-power }
        reason: "Twelve rank-and-file kills with this Kinetic weapon in one go fill Synergy's counter: it spawns an Orb of Power."
      - on: { kill: { via: "weapon:this:kinetic", fewerThan: 12 } }
        then:
          - { spawn: orb-of-power }
        chance: true
        reason: "Kills with this Kinetic weapon fill Synergy's counter, which persists through stow; when it fills, it spawns an Orb of Power."
      # Arc: Ionic Trace.
      - on: { kill: { via: "weapon:this:arc", atLeast: 12 } }
        then:
          - { spawn: ionic-trace }
        reason: "Twelve rank-and-file kills with this Arc weapon in one go fill Synergy's counter: it spawns an Ionic Trace."
      - on: { kill: { via: "weapon:this:arc", fewerThan: 12 } }
        then:
          - { spawn: ionic-trace }
        chance: true
        reason: "Kills with this Arc weapon fill Synergy's counter, which persists through stow; when it fills, it spawns an Ionic Trace."
      # Solar: Firesprite.
      - on: { kill: { via: "weapon:this:solar", atLeast: 12 } }
        then:
          - { spawn: firesprite }
        reason: "Twelve rank-and-file kills with this Solar weapon in one go fill Synergy's counter: it spawns a Firesprite."
      - on: { kill: { via: "weapon:this:solar", fewerThan: 12 } }
        then:
          - { spawn: firesprite }
        chance: true
        reason: "Kills with this Solar weapon fill Synergy's counter, which persists through stow; when it fills, it spawns a Firesprite."
      # Void: Void Breach.
      - on: { kill: { via: "weapon:this:void", atLeast: 12 } }
        then:
          - { spawn: void-breach }
        reason: "Twelve rank-and-file kills with this Void weapon in one go fill Synergy's counter: it spawns a Void Breach."
      - on: { kill: { via: "weapon:this:void", fewerThan: 12 } }
        then:
