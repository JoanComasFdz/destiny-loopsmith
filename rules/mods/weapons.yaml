# Weapon mods: what a weapon's mod socket holds, one per weapon (docs/rule-format.md; the build file's `mod:`).
# Every mod of the Compendium snapshot of 2026-10-13 (Weapon Perks tab, its "Weapon Mods" rows 251-288; a row is the
# CSV record), each with the Bungie manifest's hash (`hash: [a, b]` where the manifest has copies with the same text).
#
# An enhanced weapon mod is its own plug in the manifest ("Enhanced Weapon Mod") and only a Tier 4 or 5 weapon takes it
# (the tab's row 252). It is its own element here, `<id>-enhanced`, with the row's figures after the ↑; a figure the
# row gives as "?" stays "?". The "Enhanced Accuracy"-like mods are enhanced mods with no base version.
#
# Almost every weapon mod changes a weapon's stats, its handling, its ammo or its radar, none of which a loop has: they
# are `inert`, their figures facts in the description (ADRs D1). Synergy is the one with rules: its counter fills with
# weapon kills and spawns a pickup of the weapon's element. "This weapon" (`weapon:this:<type>`) is the weapon holding
# the mod, so each rule applies to the weapon of that element only (the build check binds it). The counter is progress
# the game doesn't show as a stacking status (ADRs D8): kills in one action that fill it for sure (12 rank-and-file,
# 8.34% each; the enhanced mod 8, 12.5% each — the pack in front of you is rank-and-file, ADRs D7) spawn the pickup;
# fewer kills may fill it, with what earlier steps counted, so they spawn it as a chance (`fewerThan`).
#
# Not authored: the manifest's other weapon mods, which the tab doesn't list (the old Adept mods, Enhanced Heat
# Generated and Vent Speed, Full Auto Retrofit, the bow and Taken mods such as Jumpshot or Fikrul's Friends). A weapon
# can still hold one; it sets nothing off (docs/backlog.md).
