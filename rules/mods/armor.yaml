# Armor mods. Values are PvE values from the Compendium snapshot of 2026-10-09 (Armor Mods tab),
# which agrees with Clarity 2.0625 except where noted here or in
# builds/skip-grenade-hunter/discrepancies.md; "a|b|c" per-copy values are PerModCount.
# Hashes are Clarity's. Several mods have two Clarity hashes with identical text (original + newer
# plug copy); the most recently updated one is used and the other is noted. Resolve against the
# manifest later.
#
# "Activation progress" and similar repeat-to-proc conditions are progress the game doesn't show as a
# stacking status, so they are chance rules (`chance: true`, ADRs D8): they fire, marked *(chance)*.
# "2 kills within 3 s" (the Siphons) fires for sure on two or more kills in one step (`atLeast: 2,
# within: 3s`, kills within one action, ADRs D4) and as a chance on one (`fewerThan: 2`).
elements:
  - id: elemental-charge
    name: Elemental Charge
    kind: armorMod
    affinity: neutral
    hash: [3712696020, 2996369932]   # the second: a copy with identical text
    description: "Collecting Elemental Pickups or destroying Tangles grants 1 Armor Charge at 100% activation progress. Progress per Ionic Trace with 1|2|3 mods: 34%|50%|50% (Firesprites, Void Breaches, Tangles 50%|50%|100%; Stasis Shards 25%|34%|50%)."
    source: "compendium/2026-10-09/Armor Mods#4"
    rules:
      # Progress the game doesn't show as a stacking status (with 2 copies: every 2nd Ionic Trace),
      # so it is a chance rule (ADRs D8).
      - on: { pickUp: ionic-trace }
        then:
          - { applyBuff: { status: armor-charge, stacks: 1 } }
        chance: true
        reason: "Collecting Ionic Traces builds toward an Armor Charge - with two copies, every second trace gives you one."
    passives: []

  - id: grenade-kickstart
    name: Grenade Kickstart
    kind: armorMod
    affinity: neutral
    hash: [4182064480, 1924584408]   # the second: a copy with identical text
    description: "When your grenade energy is fully expended (its last charge used) while you have Armor Charge: consumes all Armor Charge and grants grenade energy. Each mod and each Armor Charge stack counts as one 'charge'; energy with 2|3|...|9 charges: 16.2% | 21.7% | 28.4% | 34.4% | 38.4% | 41.3% | 43.4% | 45% (PvE). Affected by chunk energy scalars."
    source: "compendium/2026-10-09/Armor Mods#8"
    rules:
      # The refund is indexed by charges (mods + stacks spent), the Compendium's table (ADRs D33).
      # With 2 mods: 1|2|3 Armor Charge -> 21.7%|28.4%|34.4% of a charge. It fires when the grenade
      # energy is fully expended, as Bungie's text says (the Compendium: on grenade use): with one
      # grenade charge every throw, with more (Shinobu's Vow) the throw the player marks as the last
      # one (`grenade:last`, ADRs D36).
      - on: { energyExpended: grenade }
        when: [ { has: armor-charge } ]
        then:
          - { convertStacksToEnergy: { consumed: armor-charge, to: grenade, byCharges: { from: 2, values: "16.2% | 21.7% | 28.4% | 34.4% | 38.4% | 41.3% | 43.4% | 45%" } } }
        reason: "Throwing your last grenade charge while you hold Armor Charges burns them all for grenade energy - the more charges and copies, the bigger the refund."
    passives: []

  - id: bomber
    name: Bomber
    kind: armorMod
    affinity: neutral
    hash: 4188291233
    description: "Class ability use grants grenade energy: 12% | 17% | 20% with 1|2|3 mods (PvP 6% | 8.5% | 10%). Affected by chunk energy scalars."
    source: "compendium/2026-10-09/Armor Mods#3"
    rules:
      - on: { abilityCast: classAbility }
        then:
          - { grantEnergy: { to: grenade, amount: "12% | 17% | 20%" } }
        reason: "Every dodge gives you some grenade energy."
    passives: []

  - id: reaper
    name: Reaper
    kind: armorMod
    affinity: neutral
    hash: [40751621, 4149682173]   # the second: a copy with identical text
    description: "The next weapon kill within 10 s of using your class ability spawns an Orb of Power (0.8%|1.1%|1.25%|1.5% super energy with 1|2|3|4 mods). 10|5|1 s cooldown between orbs with 1|2|3 mods."
    source: "compendium/2026-10-09/Armor Mods#14"
    rules:
      - on: { abilityCast: classAbility }
        then:
          - { applyBuff: { status: reaper, duration: 10s } }
        reason: "Dodging arms Reaper for 10 seconds."
      # The 10 s cooldown between orbs (1 copy) is a fact in the description.
      - on: { kill: { via: weapon } }
        when: [ { has: reaper } ]
        then:
          - { removeBuff: reaper }
          - { spawn: orb-of-power }
        reason: "Your next weapon kill after a dodge drops an Orb of Power."
    passives: []

  - id: harmonic-siphon
    name: Harmonic Siphon
    kind: armorMod
    affinity: neutral
    hash: 3832366019
    description: "Spawns an Orb of Power after 2 kills within 3 s of each other with a weapon matching your Super's element (kills within 1 s of an orb don't count). Orbs grant 2.5%|3.75%|4.4% super energy with 1|2|3 mods."
    # The Compendium's generic Siphon row (mod-element matching weapon kills).
    source: "compendium/2026-10-09/Armor Mods#11"
    rules:
      # weapon:harmonic: a weapon of the build's Super's element (an Arc weapon with Arc Staff); with
      # no Super known it matches nothing. Two kills in one step are within 3 s: the orb for sure; one
      # kill is a chance (ADRs D8).
      - on: { kill: { via: weapon:harmonic, atLeast: 2, within: 3s } }
        then:
          - { spawn: orb-of-power }
        reason: "Two kills at once with a weapon of your Super's element and an Orb of Power drops."
      - on: { kill: { via: weapon:harmonic, fewerThan: 2 } }
        then:
          - { spawn: orb-of-power }
        chance: true
        reason: "Chain a couple of kills with a weapon of your Super's element and an Orb of Power drops."
    passives: []

  - id: strand-siphon
    name: Strand Siphon
    kind: armorMod
    affinity: strand
    hash: [3926119246, 3279257734]   # the second: a copy with identical text
    description: "Spawns an Orb of Power after 2 kills within 3 s of each other with a Strand weapon (kills within 1 s of an orb don't count). Orbs grant 2.5%|3.75%|4.4% super energy with 1|2|3 mods."
    # The Compendium's generic Siphon row. Clarity 3926119246 says 3.25% with 2 mods; the
    # Compendium's 3.75% is used.
    source: "compendium/2026-10-09/Armor Mods#11"
    rules:
      - on: { kill: { via: weapon:strand, atLeast: 2, within: 3s } }
        then:
          - { spawn: orb-of-power }
        reason: "Two kills at once with a Strand weapon and an Orb of Power drops."
      - on: { kill: { via: weapon:strand, fewerThan: 2 } }
        then:
          - { spawn: orb-of-power }
        chance: true
        reason: "Chain a couple of kills with a Strand weapon and an Orb of Power drops."
    passives: []

  - id: impact-induction
    name: Impact Induction
    kind: armorMod
    affinity: neutral
    hash: [377010989, 1153260021]   # the second: a copy with identical text
    description: "Dealing powered melee damage grants grenade energy: 12% | 17% | 20% with 1|2|3 mods (PvP 6% | 8.5% | 10%). 7 s cooldown. Affected by chunk energy scalars."
    source: "compendium/2026-10-09/Armor Mods#10"
    rules:
      # The 7 s cooldown is a fact in the description.
      - on: { damage: { via: melee } }
        then:
          - { grantEnergy: { to: grenade, amount: "12% | 17% | 20%" } }
        reason: "Landing your Arc melee gives you some grenade energy back."
    passives: []

  - id: ashes-to-assets
    name: Ashes to Assets
    kind: armorMod
    affinity: neutral
    hash: [856936828, 2136310244]   # the second: a copy with identical text
    description: "Each grenade kill gives extra Super energy, more for tougher enemies (the Compendium lists the amounts as mostly unknown). It doesn't add to Hands-On's, and Grapple melee kills give half."
    source: "compendium/2026-10-09/Armor Mods#4"
    rules:
      # The amount per enemy tier is unknown ("?"); the Compendium's tier-1 1% is itself marked uncertain.
      - on: { kill: { via: grenade } }
        then:
          - { grantEnergy: { to: super, amount: "?" } }
        reason: "Every grenade kill tops up your Super."
    passives: []

  - id: recuperation
    name: Recuperation
    kind: armorMod
    affinity: neutral
    hash: 4087056174
    description: "Picking up an Orb of Power restores health: 16 | 21 | 21 HP with 1|2|3 mods."
    source: "compendium/2026-10-09/Armor Mods#11"
    rules:
      # The HP amounts are a fact in the description: restoreHealth amounts are percentages.
      - on: { pickUp: orb-of-power }
        then:
          - { restoreHealth: { amount: "?" } }
        reason: "Every Orb of Power you pick up heals you a little."
    passives: []

  - id: powerful-attraction
    name: Powerful Attraction
    kind: armorMod
    affinity: neutral
    hash: 11126525
    description: "Using your class ability pulls in the Orbs of Power around you (within 12.5 m, 18.5 m with 2 mods) and picks them up."
    source: "compendium/2026-10-09/Armor Mods#12"
    rules:
      # The range is a fact: the orbs on the ground are the pack's in front of you (ADRs D7), so in reach.
      - on: { abilityCast: classAbility }
        then:
          - { collect: orb-of-power }
        reason: "Dodging pulls the Orbs of Power on the ground to you."
    passives: []

  # Resistance mods: no rule reads the damage you take (a loop has no incoming damage), but the step's
  # state shows your damage resistance (ADRs D29): against combatants only (Armor Mods#7), so a line of
  # their own in PvE, nothing in PvP. Different resistance sources multiply (same row).
  - id: harmonic-resistance
    name: Harmonic Resistance
    kind: armorMod
    affinity: neutral
    hash: 1293710444
    description: "Less damage from combatants of the element it matches: 15% | 25% | 30% with 1|2|3 resistance mods."
    source: "compendium/2026-10-09/Armor Mods#7"
    rules: []
    passives:
      - effect: { resistCombatantDamage: { against: harmonic, amount: "15% | 25% | 30%" } }
        reason: "You take less damage from combatants of your Super's element."

  - id: concussive-dampener
    name: Concussive Dampener
    kind: armorMod
    affinity: neutral
    hash: [3719981603, 930759851]   # the second: a copy with identical text
    description: "Less area, blast and explosive damage from combatants: 15% | 25% | 30% with 1|2|3 resistance mods (PvE only)."
    source: "compendium/2026-10-09/Armor Mods#7"
    rules: []
    passives:
      - effect: { resistCombatantDamage: { against: blast, amount: "15% | 25% | 30%" } }
        reason: "You take less area, blast and explosive damage from combatants."

  - id: charged-up
    name: Charged Up
    kind: armorMod
    affinity: neutral
    hash: [2577472338, 3181984586]   # the second: a copy with identical text
    description: "Raises the most Armor Charge you can hold from x3 to x4 | x5 | x6 with 1|2|3 mods."
    source: "compendium/2026-10-09/Armor Mods#3"
    rules: []
    passives:
      # Also Game Mechanics#94. The cap is a fact by copies equipped, and the player still declares
      # when Armor Charge is at max (ADRs D3).
      - effect: { raiseMaxStacks: { status: armor-charge, max: "4 | 5 | 6" } }
        reason: "You can hold more Armor Charge before it is at max: four with one copy, up to six with three."
