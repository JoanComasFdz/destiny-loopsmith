  - id: emergency-reinforcement
    name: Emergency Reinforcement
    kind: armorMod
    affinity: neutral
    hash: [1024379611, 422994787]   # the second: a copy with identical text
    description: "Reaching critical health while you hold x3 or more Armor Charge consumes them for 10% damage resistance, lasting longer for more charges spent: 6 | 9 | 12 | 15 s (four values, though the Compendium labels only x3, x4 and x5). Bungie's text: when your shields break."
    source: "compendium/2026-10-13/Armor Mods#4"
    # Critical health is a step the player declares (`health:critical`, ADRs D3): no damage is modelled.
    # "x3 or more" reads the Armor Charge the loop holds (ADRs D33): for sure with x3 sure stacks, a
    # chance when only chance stacks make it x3, not at all below. It spends all of it. The buff's
    # duration grows with the charges spent: 6 | 9 | 12 s at x3 | x4 | x5, the three the Compendium
    # labels (its fourth value, 15 s, has no label, so x6 is "?"); the player declares it ended. The
    # Compendium gives no PvP value: "?".
    rules:
      - on: { criticalHealth: {} }
        when: [ { holds: { status: armor-charge, atLeast: 3 } } ]
        then:
          - { removeBuff: armor-charge }
          - { applyBuff: { status: emergency-reinforcement, durationBySpent: { from: 3, values: "6 | 9 | 12" } } }
        reason: "Reaching critical health with three or more Armor Charges burns them all for 10% damage resistance."
    passives:
      - effect: { resistDamage: "10%" }
        when: [ { has: emergency-reinforcement } ]
        reason: "While Emergency Reinforcement is on you, you take 10% less damage."

  - id: health-font
    name: Health Font
    kind: armorMod
    affinity: neutral
    hash: [686455429, 3075302157]   # the second: a copy with identical text
    description: "While you have any Armor Charge: +20 | +40 | +50 Health with 1|2|3 mods."
    source: "compendium/2026-10-09/Armor Mods#5"
    rules: []
    passives:
      # A fact shown while Armor Charge is on you; never added to the build's stats (ADRs D1).
      - effect: { modifyStat: { stat: health, change: "+20 | +40 | +50" } }
        when: [ { has: armor-charge } ]
        reason: "While you hold any Armor Charge, your Health stat is higher."

