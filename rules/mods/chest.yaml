# Chest armor mods. Values are PvE values from the Compendium snapshot of 2026-10-09 (Armor Mods tab,
# Chest column: "Armor Mods#7" is the Chest column's row 7, its CSV record number); "a | b | c"
# per-copy values are PerModCount. Names and hashes are Bungie's manifest, every copy of a mod
# listed (hash: [a, b]); the second copy has the same perk text.
#
# The Compendium's generic rows (Ammo Generation, Resistance, Unflinching Aim) are one row for every
# element variant: each variant is its own element, citing the generic row, with the element its
# manifest text names. A Harmonic variant matches your Super's element.
#
# Charged Up, Harmonic Resistance and Concussive Dampener are in mods/armor.yaml.
#
# An Armor Charge mod's "Collecting an Orb of Power gives 1 temporary Armor Charge" (Bungie's text on
# Emergency Reinforcement and Health Font) is the orb-of-power keyword's rule (keywords/orb-of-power.yaml,
# Game Mechanics#94), so these mods don't repeat it: a second grant would show two stacks per orb.
