  # ---------------------------------------------------------------- Super energy
  - id: dynamo
    name: Dynamo
    kind: armorMod
    affinity: neutral
    hash: [2414626352, 1604394872]
    description: "Using your class ability within 15 m of an enemy grants Super energy: 2.5% | 4% with 1|2 mods (PvP 1.25% | 2.4%), times the class's multiplier: Hunter x1, Titan x1.2, Warlock x2."
    source: "compendium/2026-10-09/Armor Mods#5"
    rules:
      # The amount depends on the build's class (2.5% | 4% times x1 Hunter, x1.2 Titan, x2 Warlock),
      # which a rule can't read, so it is "?". The 15 m range is a fact: the pack is in front of you
      # (ADRs D7), so in reach.
      - on: { abilityCast: classAbility }
        then:
          - { grantEnergy: { to: super, amount: "?" } }
        reason: "Using your class ability near enemies gives you some Super energy."
    passives: []

  - id: hands-on
    name: Hands-On
    kind: armorMod
    affinity: neutral
    hash: [3938489430, 1036557198]
    description: "Each powered melee kill gives extra Super energy, more for tougher enemies (the Compendium lists the amounts as mostly unknown). It doesn't add to Ashes to Assets'."
    source: "compendium/2026-10-09/Armor Mods#6"
    rules:
      # The amount per enemy tier is unknown ("?"); the Compendium's tier-2 1.33% and tier-4 5% are
      # themselves marked uncertain. Not benefiting together with Ashes to Assets is a fact in the
      # description: a melee kill and a grenade kill are different events, and doesNotStackWith
      # (ADRs D6) pairs rules on one event.
      - on: { kill: { via: melee } }
        then:
          - { grantEnergy: { to: super, amount: "?" } }
        reason: "Every powered melee kill tops up your Super."
    passives: []

  - id: power-preservation
    name: Power Preservation
    kind: armorMod
    affinity: neutral
    hash: [3149307605, 2982306509]
    description: "Super kills spawn Orbs of Power for your allies (2.5% | 3.75% | 4.4% super energy with 1|2|3 mods), at most one every 2 s."
    source: "compendium/2026-10-09/Armor Mods#8"
    inert: "It helps your allies only: a loop is yours, so nothing in it changes."
    rules: []
    passives: []

  # ---------------------------------------------------------------- Armor Charge
  - id: powerful-friends
    name: Powerful Friends
    kind: armorMod
    affinity: neutral
    hash: 2175577211
    description: "Picking up an Orb of Power gives allies within 18 m x1 Armor Charge (Bungie's text: allies who already hold one)."
    source: "compendium/2026-10-09/Armor Mods#9"
    inert: "It helps your allies only: a loop is yours, so nothing in it changes."
    rules: []
    passives: []

  - id: radiant-light
    name: Radiant Light
    kind: armorMod
    affinity: neutral
    hash: 2199590568
    description: "Casting your Super gives allies within 21 m x1 Armor Charge (x2 to allies on another subclass), and you x1 if you already hold Armor Charge."
    source: "compendium/2026-10-09/Armor Mods#10"
    rules:
      # The allies' Armor Charge is no part of your loop. Bungie's text names only the allies (those
      # who hold one, and an extra one for a different Super element); the Compendium adds the
      # caster's x1 when already charged, which is what this rule encodes.
      - on: { abilityCast: super }
        when: [ { has: armor-charge } ]
        then:
          - { applyBuff: { status: armor-charge, stacks: 1 } }
        reason: "Casting your Super while you hold Armor Charge gives you one more."
    passives: []

  - id: super-font
    name: Super Font
    kind: armorMod
    affinity: neutral
    hash: [1130820873, 3461249873]
    description: "While you hold Armor Charge: +20 | +40 | +50 Super with 1|2|3 mods. As a passive Armor Charge mod it makes Armor Charge decay, one stack every 10 s (Game Mechanics#94)."
    source: "compendium/2026-10-09/Armor Mods#12"
    rules: []
    passives:
      # A fact shown while Armor Charge is on you, never added to the build's stats (ADRs D1). The
      # decay is a fact too: the player declares Armor Charge ended.
      - effect: { modifyStat: { stat: super, change: "+20 | +40 | +50" } }
        when: [ { has: armor-charge } ]
        reason: "While you hold Armor Charge, your Super stat is higher: +20 with one copy, up to +50 with three."

