# Helmet armor mods. Values are PvE values from the Compendium snapshot of 2026-10-09 (Armor Mods tab,
# Helmet column; a row is the CSV line); "a | b | c" per-copy values are PerModCount. Names and hashes
# are the Bungie manifest's, every copy of a plug listed (`hash: [a, b]`). Ashes to Assets, Harmonic
# Siphon and Strand Siphon are in armor.yaml.
#
# The Compendium's generic Siphon (#11) and Targeting (#13) rows are one row for every element
# variant: each variant is its own element citing that row, and Bungie's text says which weapon
# elements it covers (a dual siphon lists two Siphon perks).
#
# "2 kills within 3 s" (the Siphons) is progress the game doesn't show as a stacking status, so it is
# a chance rule (`chance: true`, ADRs D8), as the siphons in armor.yaml are. Cooldowns are facts in
# the description.
elements:
  # ---------------------------------------------------------------- Siphons (one element)
  - id: arc-siphon
    name: Arc Siphon
    kind: armorMod
    affinity: arc
    hash: [2724068510, 3847471926]
    description: "Two kills within 3 s of each other with Arc weapons spawn an Orb of Power (kills within 1 s of an orb don't count). Orbs grant 2.5% | 3.75% | 4.4% super energy with 1|2|3 mods."
    source: "compendium/2026-10-09/Armor Mods#11"
    rules:
      - on: { kill: { via: weapon:arc } }
        then:
          - { spawn: orb-of-power }
        chance: true
        reason: "Chain a couple of kills with an Arc weapon and an Orb of Power drops."
    passives: []

