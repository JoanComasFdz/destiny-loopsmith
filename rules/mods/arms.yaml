# Arms armor mods. Values are PvE values from the Compendium snapshot of 2026-10-09 (Armor Mods tab,
# Arms column; a row is the CSV line); "a | b | c" per-copy values are PerModCount. Names and hashes
# are the Bungie manifest's, every copy of a plug listed (`hash: [a, b]`). Grenade Kickstart and
# Impact Induction are in armor.yaml.
#
# The Compendium's generic Dexterity (#3) and Loader (#11) rows are one row for every element
# variant: each variant is its own element citing that row, and Bungie's text says which weapon
# elements it covers.
#
# Cooldowns (7 s on the energy mods, 10 | 5 | 1 s between orbs) are facts in the description, as
# they are on Impact Induction and Reaper in armor.yaml. Energy grants are facts (ADRs D5); the
# Compendium (Game Mechanics#12) says chunk energy scalars apply to them unless a source says not.
elements:
  # ---------------------------------------------------------------- Ability energy
  - id: bolstering-detonation
    name: Bolstering Detonation
    kind: armorMod
    affinity: neutral
    hash: [3726719281, 3245543337]
    description: "Dealing grenade damage grants class ability energy: 12% | 17% | 20% with 1|2|3 mods (PvP 6% | 8.5% | 10%). 7 s cooldown. Affected by chunk energy scalars."
    source: "compendium/2026-10-09/Armor Mods#2"
    rules:
      # The 7 s cooldown is a fact in the description.
      - id: bolstering-detonation-1
        on: { damage: { via: grenade } }
        then:
          - { grantEnergy: { to: classAbility, amount: "12% | 17% | 20%" } }
        reason: "Hitting enemies with your grenade gives you some class ability energy."
    passives: []

  - id: focusing-strike
    name: Focusing Strike
    kind: armorMod
    affinity: neutral
    hash: [3685945823, 3657186535]
    description: "Dealing powered melee damage grants class ability energy: 12% | 17% | 20% with 1|2|3 mods (PvP 6% | 8.5% | 10%). 7 s cooldown. Affected by chunk energy scalars."
    source: "compendium/2026-10-09/Armor Mods#6"
    rules:
      # The 7 s cooldown is a fact in the description.
      - id: focusing-strike-1
        on: { damage: { via: melee } }
        then:
          - { grantEnergy: { to: classAbility, amount: "12% | 17% | 20%" } }
        reason: "Landing your powered melee gives you some class ability energy."
    passives: []

  - id: momentum-transfer
    name: Momentum Transfer
    kind: armorMod
    affinity: neutral
    hash: [3599522901, 2031584061]
    description: "Dealing grenade damage grants melee energy: 12% | 17% | 20% with 1|2|3 mods (PvP 6% | 8.5% | 10%). 7 s cooldown. Doesn't work with Grapple. Affected by chunk energy scalars."
    source: "compendium/2026-10-09/Armor Mods#14"
    rules:
      # The 7 s cooldown is a fact in the description. Not expressible: "doesn't work with Grapple" -
      # a damage source names the grenade ability, not which grenade it is, so with Grapple equipped
      # this rule still fires; the exception is a fact in the description.
      - id: momentum-transfer-1
        on: { damage: { via: grenade } }
        then:
          - { grantEnergy: { to: melee, amount: "12% | 17% | 20%" } }
        reason: "Hitting enemies with your grenade gives you some melee energy."
    passives: []

  - id: melee-kickstart
    name: Melee Kickstart
    kind: armorMod
    affinity: neutral
    hash: [1763780622, 1139671158]
    description: "When your melee energy is fully expended (its last charge used) while you hold Armor Charge, spends all of it for melee energy. Each mod and each Armor Charge stack counts once; with 2|3|...|9 of them: 16.2% | 21.7% | 28.4% | 34.4% | 38.4% | 41.3% | 43.4% | 45% (PvE). Affected by chunk energy scalars."
    source: "compendium/2026-10-09/Armor Mods#13"
    rules:
      # The refund is indexed by charges (mods + stacks spent), the Compendium's table (ADRs D33).
      # With 2 mods: 1|2|3 Armor Charge -> 21.7%|28.4%|34.4% of a charge. It fires when the melee
      # energy is fully expended, as Bungie's text says (the Compendium: on melee use): with one
      # melee charge every use, with more the use the player marks as the last one (`melee:last`,
      # ADRs D36).
      - id: melee-kickstart-1
        on: { energyExpended: melee }
        when: [ { has: armor-charge } ]
        then:
          - { convertStacksToEnergy: { consumed: armor-charge, to: melee, byCharges: { from: 2, values: "16.2% | 21.7% | 28.4% | 34.4% | 38.4% | 41.3% | 43.4% | 45%" } } }
        reason: "Using your last melee charge while you hold Armor Charges burns them all for melee energy - the more charges and copies, the bigger the refund."
    passives: []

  # ---------------------------------------------------------------- Orbs of Power
  - id: firepower
    name: Firepower
    kind: armorMod
    affinity: neutral
    hash: [2485657760, 965934024]
    description: "Grenade kills spawn an Orb of Power (0.8% | 1.1% | 1.25% | 1.5% super energy with 1|2|3|4 mods), with a 10 | 5 | 1 s cooldown between orbs with 1|2|3 mods. With Heavy Handed equipped too, both can trigger only if Firepower sits before it (left to right)."
    source: "compendium/2026-10-09/Armor Mods#5"
    rules:
      # The cooldown between orbs is a fact in the description, and so is the order with Heavy
      # Handed: no rule reads the order of the mods.
      - id: firepower-1
        on: { kill: { via: grenade } }
        then:
          - { spawn: orb-of-power }
        reason: "Your grenade kills drop Orbs of Power."
    passives: []

  - id: heavy-handed
    name: Heavy Handed
    kind: armorMod
    affinity: neutral
    hash: [2447449706, 1709236482]
    description: "Powered melee kills spawn an Orb of Power (0.8% | 1.1% | 1.25% | 1.5% super energy with 1|2|3|4 mods), with a 10 | 5 | 1 s cooldown between orbs with 1|2|3 mods. With Firepower equipped too, both can trigger only if Heavy Handed sits after it (left to right)."
    source: "compendium/2026-10-09/Armor Mods#9"
    rules:
      # The cooldown between orbs is a fact in the description, and so is the order with Firepower:
      # no rule reads the order of the mods.
      - id: heavy-handed-1
        on: { kill: { via: melee } }
        then:
          - { spawn: orb-of-power }
        reason: "Your powered melee kills drop Orbs of Power."
    passives: []

  # ---------------------------------------------------------------- Armor Charge
  - id: grenade-font
    name: Grenade Font
    kind: armorMod
    affinity: neutral
    hash: [1781551382, 1255614814]
    description: "While you hold Armor Charge: +20 | +40 | +50 Grenade with 1|2|3 mods. As a passive Armor Charge mod it makes Armor Charge decay, one stack every 10 s (Game Mechanics#94)."
    source: "compendium/2026-10-09/Armor Mods#7"
    rules: []
    passives:
      # A fact shown while Armor Charge is on you, never added to the build's stats (ADRs D1). The
      # decay is a fact too: the player declares Armor Charge ended.
      - id: grenade-font-1
        effect: { modifyStat: { stat: grenade, change: "+20 | +40 | +50" } }
        when: [ { has: armor-charge } ]
        reason: "While you hold Armor Charge, your Grenade stat is higher: +20 with one copy, up to +50 with three."

  - id: melee-font
    name: Melee Font
    kind: armorMod
    affinity: neutral
    hash: [633101315, 2771425787]
    description: "While you hold Armor Charge: +20 | +40 | +50 Melee with 1|2|3 mods. As a passive Armor Charge mod it makes Armor Charge decay, one stack every 10 s (Game Mechanics#94)."
    source: "compendium/2026-10-09/Armor Mods#12"
    rules: []
    passives:
      # A fact shown while Armor Charge is on you, never added to the build's stats (ADRs D1). The
      # decay is a fact too: the player declares Armor Charge ended.
      - id: melee-font-1
        effect: { modifyStat: { stat: melee, change: "+20 | +40 | +50" } }
        when: [ { has: armor-charge } ]
        reason: "While you hold Armor Charge, your Melee stat is higher: +20 with one copy, up to +50 with three."

  - id: shield-break-charge
    name: Shield Break Charge
    kind: armorMod
    affinity: neutral
    hash: [48578555, 3047946307]
    description: "Breaking a combatant's shield with damage of its element grants x1 | x2 Armor Charge with 1|2 mods."
    source: "compendium/2026-10-09/Armor Mods#15"
    rules:
      # The player says which weapon step breaks a shield (`kinetic:kill:shield`, ADRs D36), and says
      # it only when the weapon's element matches the shield's, so "with damage of its element" holds.
      - id: shield-break-charge-1
        on: { shieldBroken: {} }
        then:
          - { applyBuff: { status: armor-charge, stacks: "1 | 2" } }
        reason: "Breaking a combatant's shield with damage of its element gives you Armor Charge."
    passives: []

