# Leg armor mods. Values are PvE values from the Compendium snapshot of 2026-10-09 (Armor Mods tab,
# Legs column: "Armor Mods#7" is the Legs column's row 7, its CSV record number); "a | b | c"
# per-copy values are PerModCount. Names and hashes are Bungie's manifest, every copy of a mod
# listed (hash: [a, b]); the second copy has the same perk text.
#
# The Compendium's generic rows (Holster, Scavenger, Weapon Surge) are one row for every element
# variant: each variant is its own element, citing the generic row, with the element its manifest
# text names. A Harmonic variant matches your Super's element.
#
# Elemental Charge and Recuperation are in mods/armor.yaml.
#
# An Armor Charge mod's "Collecting an Orb of Power gives 1 temporary Armor Charge" (Bungie's text on
# Weapons Font and the Weapon Surge mods) is the orb-of-power keyword's rule (keywords/orb-of-power.yaml,
# Game Mechanics#94), so these mods don't repeat it: a second grant would show two stacks per orb.
elements:
  - id: absolution
    name: Absolution
    kind: armorMod
    affinity: neutral
    hash: [2793473444, 3184690956]   # the second: a copy with identical text
    description: "Picking up an Orb of Power gives 5% | 7.5% | 10% grenade, melee and class ability energy with 1|2|3 mods (Bungie's text: all ability cooldowns)."
    source: "compendium/2026-10-09/Armor Mods#2"
    rules:
      # The Compendium lists grenade, melee and class ability energy; no Super energy.
      - on: { pickUp: orb-of-power }
        then:
          - { grantEnergy: { to: grenade, amount: "5% | 7.5% | 10%" } }
          - { grantEnergy: { to: melee, amount: "5% | 7.5% | 10%" } }
          - { grantEnergy: { to: classAbility, amount: "5% | 7.5% | 10%" } }
        reason: "Every Orb of Power you pick up gives your grenade, melee and class ability some energy."
    passives: []

  - id: better-already
    name: Better Already
    kind: armorMod
    affinity: neutral
    hash: 2194294579
    description: "Picking up an Orb of Power starts your health regenerating at once. More copies add nothing, whatever the tooltip says."
    source: "compendium/2026-10-09/Armor Mods#3"
    rules:
      # A regeneration that starts, not a set heal: the amount is "?" (no source gives one).
      - on: { pickUp: orb-of-power }
        then:
          - { restoreHealth: { amount: "?" } }
        reason: "Picking up an Orb of Power starts your health regenerating right away."
    passives: []

