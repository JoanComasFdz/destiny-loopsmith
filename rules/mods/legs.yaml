  - id: stacks-on-stacks
    name: Stacks on Stacks
    kind: armorMod
    affinity: neutral
    hash: [3994043492, 1627901452]   # the second: a copy with identical text
    description: "Every source of Armor Charge gives one more stack, unless that source says it doesn't (Bungie's text: Orb of Power pickups give 1 more)."
    source: "compendium/2026-10-09/Armor Mods#13"
    rules: []
    passives:
      # The Compendium's "every source" is used over Bungie's "Orb of Power pickups". No rule in the
      # catalog says it doesn't benefit, so the extra stack holds for every grant. Whether more copies
      # add more stacks isn't stated, so it is one.
      - effect: { extraStacks: { status: armor-charge, extra: 1 } }
        reason: "Every Armor Charge you gain comes with one extra stack."

  - id: weapons-font
    name: Weapons Font
    kind: armorMod
    affinity: neutral
    hash: [4046357305, 1901221009]   # the second: a copy with identical text
    description: "While you have any Armor Charge: +20 | +40 | +50 Weapons with 1|2|3 mods."
    source: "compendium/2026-10-09/Armor Mods#14"
    rules: []
    passives:
      # A fact shown while Armor Charge is on you; never added to the build's stats (ADRs D1).
      - effect: { modifyStat: { stat: weapons, change: "+20 | +40 | +50" } }
        when: [ { has: armor-charge } ]
        reason: "While you hold any Armor Charge, your Weapons stat is higher."

